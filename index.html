<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI</title>
  <style>
    :root{
      --bg:#0b0f19; --card:#131a2a; --card2:#1a243b; --line:#243049;
      --txt:#f8fafc; --muted:#94a3b8; --acc:#10b981;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
    .brand{font-weight:900;font-size:18px}
    .brand span{color:var(--acc)}
    .sync{font-size:11px;background:rgba(16,185,129,.15);color:var(--acc);padding:4px 9px;border-radius:99px;font-weight:700}
    .wrap{max-width:760px;margin:auto;padding:10px}
    .main-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
    .m-tab{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:10px 6px;border-radius:10px;font-weight:800;font-size:13px}
    .m-tab.active{background:var(--acc);color:#06281e;border-color:var(--acc)}
    .leagues{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
    .lg-chip{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700}
    .lg-chip.active{background:var(--card2);color:var(--txt);border-color:var(--acc)}
    .search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);margin-bottom:10px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
    .m-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
    .m-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
    .team-name{font-weight:800;font-size:14px}
    .score-box{background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-weight:900;font-size:15px;min-width:68px;color:#fff}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-size:11px}
    td.t-team{text-align:right;font-weight:700}
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="sync" id="syncStatus">جاهز</div>
  </header>

  <div class="wrap">
    <div class="main-tabs">
      <button type="button" class="m-tab active" id="btnMatches" onclick="switchTab('matches')">المباريات</button>
      <button type="button" class="m-tab" id="btnStandings" onclick="switchTab('standings')">الترتيب</button>
      <button type="button" class="m-tab" id="btnRefresh" onclick="doRefresh()">تحديث الآن</button>
    </div>

    <div class="leagues" id="leaguesBar"></div>
    <input class="search" id="q" placeholder="ابحث عن فريق أو بطولة..." onkeyup="renderAll()" />
    <div id="view"></div>
  </div>

  <script>
    var currentTab = 'matches';
    var currentLeague = 'PL';

    var LEAGUES = [
      { code: 'PL', name: 'الدوري الإنجليزي' },
      { code: 'PD', name: 'الدوري الإسباني' },
      { code: 'CL', name: 'دوري الأبطال' },
      { code: 'BL1', name: 'الدوري الألماني' },
      { code: 'SA', name: 'الدوري الإيطالي' }
    ];

    var MATCHES = {
      PL: [
        { league: 'الدوري الإنجليزي', home: 'أرسنال', away: 'ليفربول', score: '2 - 1', status: 'انتهت' },
        { league: 'الدوري الإنجليزي', home: 'مانشستر سيتي', away: 'تشيلسي', score: 'vs', status: 'مجدولة' }
      ],
      PD: [
        { league: 'الدوري الإسباني', home: 'ريال مدريد', away: 'برشلونة', score: '1 - 1', status: 'انتهت' }
      ],
      CL: [
        { league: 'دوري الأبطال', home: 'بايرن ميونخ', away: 'إنتر ميلان', score: '2 - 0', status: 'انتهت' }
      ],
      BL1: [
        { league: 'الدوري الألماني', home: 'بوروسيا دورتموند', away: 'لايبزيغ', score: '3 - 2', status: 'انتهت' }
      ],
      SA: [
        { league: 'الدوري الإيطالي', home: 'ميلان', away: 'نابولي', score: '1 - 0', status: 'انتهت' }
      ]
    };

    var STANDINGS = {
      PL: [
        { pos: 1, team: 'ليفربول', p: 12, w: 9, d: 2, l: 1, pts: 29 },
        { pos: 2, team: 'أرسنال', p: 12, w: 8, d: 3, l: 1, pts: 27 }
      ],
      PD: [
        { pos: 1, team: 'برشلونة', p: 12, w: 10, d: 1, l: 1, pts: 31 },
        { pos: 2, team: 'ريال مدريد', p: 12, w: 8, d: 3, l: 1, pts: 27 }
      ],
      CL: [
        { pos: 1, team: 'بايرن ميونخ', p: 4, w: 3, d: 0, l: 1, pts: 9 }
      ],
      BL1: [
        { pos: 1, team: 'بايرن ميونخ', p: 11, w: 9, d: 2, l: 0, pts: 29 }
      ],
      SA: [
        { pos: 1, team: 'نابولي', p: 12, w: 9, d: 2, l: 1, pts: 29 }
      ]
    };

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('btnMatches').className = 'm-tab' + (tab === 'matches' ? ' active' : '');
      document.getElementById('btnStandings').className = 'm-tab' + (tab === 'standings' ? ' active' : '');
      renderAll();
    }

    function pickLeague(code) {
      currentLeague = code;
      renderLeagues();
      renderAll();
    }

    function doRefresh() {
      var st = document.getElementById('syncStatus');
      st.innerHTML = 'جاري التحديث...';
      setTimeout(function () {
        st.innerHTML = 'محدّث';
        renderAll();
      }, 400);
    }

    function renderLeagues() {
      var html = '';
      for (var i = 0; i < LEAGUES.length; i++) {
        var l = LEAGUES[i];
        var cls = 'lg-chip' + (currentLeague === l.code ? ' active' : '');
        html += '<button type="button" class="' + cls + '" onclick="pickLeague(\'' + l.code + '\')">' + l.name + '</button>';
      }
      document.getElementById('leaguesBar').innerHTML = html;
    }

    function renderAll() {
      var qEl = document.getElementById('q');
      var q = qEl && qEl.value ? qEl.value.toLowerCase() : '';
      var view = document.getElementById('view');

      if (currentTab === 'matches') {
        var list = MATCHES[currentLeague] || [];
        var out = '';
        for (var i = 0; i < list.length; i++) {
          var m = list[i];
          var txt = (m.league + ' ' + m.home + ' ' + m.away + ' ' + m.status).toLowerCase();
          if (!q || txt.indexOf(q) !== -1) {
            out += '<div class="card">' +
              '<div class="m-top"><span>' + m.league + '</span><span>' + m.status + '</span></div>' +
              '<div class="m-grid">' +
                '<div class="team-name">' + m.home + '</div>' +
                '<div class="score-box">' + m.score + '</div>' +
                '<div class="team-name">' + m.away + '</div>' +
              '</div>' +
            '</div>';
          }
        }
        view.innerHTML = out || '<p style="text-align:center;color:#94a3b8">لا توجد مباريات</p>';
      } else {
        var rows = STANDINGS[currentLeague] || [];
        var trs = '';
        for (var j = 0; j < rows.length; j++) {
          var s = rows[j];
          var teamTxt = String(s.team).toLowerCase();
          if (!q || teamTxt.indexOf(q) !== -1) {
            trs += '<tr>' +
              '<td><b>' + s.pos + '</b></td>' +
              '<td class="t-team">' + s.team + '</td>' +
              '<td>' + s.p + '</td><td>' + s.w + '</td><td>' + s.d + '</td><td>' + s.l + '</td>' +
              '<td><b style="color:#10b981">' + s.pts + '</b></td>' +
            '</tr>';
          }
        }
        view.innerHTML = '<div class="card" style="padding:6px"><table>' +
          '<thead><tr><th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>نقاط</th></tr></thead>' +
          '<tbody>' + trs + '</tbody></table></div>';
      }
    }

    renderLeagues();
    renderAll();
  </script>
</body>
</html>
