<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المصحف - وضع أوفلاين</title>
  <style>
    :root {
      --bg-page: #f4f0e6;
      --bg-paper: #fffdf8;
      --bg-header: #164b3b;
      --text-main: #1b2420;
      --text-muted: #5b6861;
      --accent: #1b5e4a;
      --gold: #b58632;
      --border: #dfd6c3;
    }

    :root[data-theme="dark"] {
      --bg-page: #0c0e0d;
      --bg-paper: #121514;
      --bg-header: #101412;
      --text-main: #eceae4;
      --text-muted: #9aa39e;
      --accent: #38a17f;
      --gold: #d4a64a;
      --border: #272d2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Traditional Arabic", "Amiri", Tahoma, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding-bottom: 2rem;
    }

    .topbar {
      background-color: var(--bg-header);
      color: #fff;
      padding: 0.5rem 0.75rem;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: space-between;
      position: sticky;
      top: 0;
    }

    .btn {
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.14);
      color: #fff;
      border-radius: 7px;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
    }

    .wrap {
      max-width: 900px;
      margin: 0.7rem auto;
      padding: 0 0.6rem;
    }

    .box, .paper {
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 0.7rem;
    }

    .search-input {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.35rem 0.6rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-page);
      color: var(--text-main);
    }

    .ayah-item {
      cursor: pointer;
      padding: 0.1rem 0.2rem;
      border-radius: 5px;
    }

    .ayah-item:hover {
      background: rgba(181, 134, 50, 0.18);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.8rem;
      gap: 0.5rem;
    }

    .nav .btn {
      background: var(--accent);
      border: none;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <button id="resumeBtn" class="btn" type="button">آخر قراءة</button>
      <button id="backPagesBtn" class="btn" type="button" style="display:none;">الرجوع للصفحات</button>
    </div>
    <div>
      <button id="themeBtn" class="btn" type="button">تبديل الوضع</button>
      <button id="fontBtn" class="btn" type="button">تكبير الخط</button>
    </div>
  </header>

  <main class="wrap">
    <div class="box">
      <input id="searchInput" class="search-input" type="search" placeholder="ابحث محلياً في الآيات..." />
      <div id="searchResults" style="margin-top:0.5rem;"></div>
    </div>

    <article class="paper">
      <div id="headerInfo" style="color:var(--text-muted);margin-bottom:0.5rem;"></div>
      <div id="contentArea" style="font-size:1.45rem;line-height:1.8;"></div>
      <div id="tafsirBox" style="margin-top:0.8rem;padding-top:0.6rem;border-top:1px solid var(--border);color:var(--text-muted);"></div>

      <div id="pageNav" class="nav">
        <button id="prevBtn" class="btn" type="button">الصفحة السابقة</button>
        <span id="pageLabel">صفحة ١</span>
        <button id="nextBtn" class="btn" type="button">الصفحة التالية</button>
      </div>
    </article>
  </main>

  <script>
    (function () {
      // ضع هنا بيانات الآيات المحلية أو حمّلها من ملف JSON محلي داخل مشروعك:
      // [{ surah: 2, surahName: "البقرة", ayah: 1, page: 2, text: "...", tafsir: "..." }]
      var OFFLINE_AYAHS = [];

      var currentPage = 1;
      var fontSize = 1.45;
      var isDark = false;
      var mode = "pages"; // "pages" | "restOfSurah"

      var contentArea = document.getElementById("contentArea");
      var headerInfo = document.getElementById("headerInfo");
      var tafsirBox = document.getElementById("tafsirBox");
      var pageLabel = document.getElementById("pageLabel");
      var backPagesBtn = document.getElementById("backPagesBtn");
      var pageNav = document.getElementById("pageNav");
      var searchInput = document.getElementById("searchInput");
      var searchResults = document.getElementById("searchResults");

      function saveLast(page, surah, ayah) {
        try {
          localStorage.setItem("offline_mushaf_pos", JSON.stringify({ page: page, surah: surah, ayah: ayah }));
        } catch (e) {}
      }

      function getLast() {
        try {
          var raw = localStorage.getItem("offline_mushaf_pos");
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function renderAyahs(list, showBackButton) {
        contentArea.innerHTML = "";
        mode = showBackButton ? "restOfSurah" : "pages";
        backPagesBtn.style.display = showBackButton ? "inline-block" : "none";
        pageNav.style.display = showBackButton ? "none" : "flex";

        if (!list.length) {
          contentArea.textContent = "أضف بيانات المصحف المحلية في OFFLINE_AYAHS أو اربط ملف JSON المحلي للعرض من دون نت.";
          return;
        }

        for (var i = 0; i < list.length; i++) {
          (function (item) {
            var span = document.createElement("span");
            span.className = "ayah-item";
            span.textContent = item.text + " (" + item.ayah + ") ";
            span.onclick = function () {
              tafsirBox.textContent = (item.surahName || "") + " - آية " + item.ayah + ": " + (item.tafsir || "");
              saveLast(item.page || currentPage, item.surah, item.ayah);
              openRestOfSurah(item.surah, item.ayah);
            };
            contentArea.appendChild(span);
          })(list[i]);
        }
      }

      function openRestOfSurah(surahNum, startAyah) {
        var rest = [];
        for (var i = 0; i < OFFLINE_AYAHS.length; i++) {
          var a = OFFLINE_AYAHS[i];
          if (a.surah === surahNum && a.ayah >= startAyah) {
            rest.push(a);
          }
        }
        headerInfo.textContent = "باقي السورة من الآية " + startAyah;
        renderAyahs(rest, true);
        window.scrollTo(0, 0);
      }

      function renderPage(pageNum) {
        currentPage = pageNum < 1 ? 1 : pageNum;
        pageLabel.textContent = "صفحة " + currentPage;
        headerInfo.textContent = "المصحف المحلي • صفحة " + currentPage;

        var pageItems = [];
        for (var i = 0; i < OFFLINE_AYAHS.length; i++) {
          if (OFFLINE_AYAHS[i].page === currentPage) {
            pageItems.push(OFFLINE_AYAHS[i]);
          }
        }
        renderAyahs(pageItems, false);
      }

      searchInput.oninput = function () {
        var q = searchInput.value.replace(/^\s+|\s+$/g, "");
        searchResults.innerHTML = "";
        if (!q) return;

        var found = [];
        for (var i = 0; i < OFFLINE_AYAHS.length; i++) {
          if (OFFLINE_AYAHS[i].text.indexOf(q) !== -1) {
            found.push(OFFLINE_AYAHS[i]);
          }
        }

        if (!found.length) {
          searchResults.textContent = "لا توجد نتائج محلية مطابقة.";
          return;
        }

        for (var j = 0; j < Math.min(found.length, 30); j++) {
          (function (res) {
            var div = document.createElement("div");
            div.style.padding = "0.35rem 0";
            div.style.cursor = "pointer";
            div.textContent = (res.surahName || "") + " (" + res.ayah + "): " + res.text;
            div.onclick = function () {
              renderPage(res.page || 1);
            };
            searchResults.appendChild(div);
          })(found[j]);
        }
      };

      document.getElementById("prevBtn").onclick = function () {
        if (currentPage > 1) renderPage(currentPage - 1);
      };

      document.getElementById("nextBtn").onclick = function () {
        renderPage(currentPage + 1);
      };

      backPagesBtn.onclick = function () {
        renderPage(currentPage);
      };

      document.getElementById("resumeBtn").onclick = function () {
        var last = getLast();
        if (last && last.page) renderPage(last.page);
      };

      document.getElementById("themeBtn").onclick = function () {
        isDark = !isDark;
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      };

      document.getElementById("fontBtn").onclick = function () {
        fontSize = fontSize >= 2.1 ? 1.35 : Number((fontSize + 0.2).toFixed(2));
        contentArea.style.fontSize = fontSize + "rem";
      };

      renderPage(currentPage);
    })();
  </script>
</body>
</html>
