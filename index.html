<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI - المباريات والترتيب والتفاصيل</title>
  <style>
    :root{
      --bg:#0b0f19; --card:#131a2a; --card2:#1a243b; --line:#243049;
      --txt:#f8fafc; --muted:#94a3b8; --acc:#10b981; --gold:#f59e0b; --err:#f87171;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
    .brand{font-weight:900;font-size:18px}
    .brand span{color:var(--acc)}
    .sync{font-size:11px;background:rgba(16,185,129,.15);color:var(--acc);padding:4px 9px;border-radius:99px;font-weight:700}
    .wrap{max-width:780px;margin:auto;padding:10px}
    .main-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
    .m-tab{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:10px 6px;border-radius:10px;font-weight:800;font-size:13px}
    .m-tab.active{background:var(--acc);color:#06281e;border-color:var(--acc)}
    .sub-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
    .f-chip{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:6px 11px;border-radius:99px;font-size:11px;font-weight:700}
    .f-chip.active{background:var(--acc);color:#06281e;border-color:var(--acc)}
    .leagues{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
    .lg-chip{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}
    .lg-chip.active{background:var(--card2);color:var(--txt);border-color:var(--acc)}
    .search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);margin-bottom:8px}
    .info-bar{font-size:11px;color:var(--gold);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);padding:7px 10px;border-radius:10px;margin-bottom:10px;line-height:1.5}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
    .m-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px;gap:8px}
    .m-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
    .team-name{font-weight:800;font-size:14px}
    .score-box{background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-weight:900;font-size:14px;min-width:74px;color:#fff}
    .meta-row{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
    .m-actions{margin-top:10px;display:flex;justify-content:center}
    .details-btn{background:var(--card2);color:var(--txt);border:1px solid var(--acc);padding:7px 14px;border-radius:9px;font-size:12px;font-weight:800}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-size:11px}
    td.t-team{text-align:right;font-weight:700}

    /* نافذة تفاصيل المباراة */
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;padding:12px;overflow-y:auto}
    .modal-box{max-width:740px;margin:12px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
    .modal-title{font-weight:900;font-size:15px}
    .close-btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800}
    .d-section{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
    .d-sec-title{font-size:12px;font-weight:900;color:var(--acc);margin-bottom:8px}
    .d-two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .d-team-box{background:var(--card2);border-radius:8px;padding:8px}
    .d-team-h{font-size:12px;font-weight:800;margin-bottom:6px;color:#fff}
    .d-list{margin:0;padding-right:16px;font-size:12px;color:var(--txt);line-height:1.7}
    .d-inj{color:var(--err)}
    @media(max-width:560px){.d-two-col{grid-template-columns:1fr}}
  </style>
</head>

      currentTab = tab;
      document.getElementById('btnMatches').className = 'm-tab' + (tab === 'matches' ? ' active' : '');
      document.getElementById('btnStandings').className = 'm-tab' + (tab === 'standings' ? ' active' : '');
      document.getElementById('timeFilters').style.display = tab === 'matches' ? 'flex' : 'none';
      if (tab === 'standings' && currentLeague === 'ALL') {
        currentLeague = 'PL';
        renderLeagues();
      }
      renderAll();
    }

    function pickTimeFilter(filterKey) {
      currentTimeFilter = filterKey;
      var keys = ['all', 'today', 'tomorrow', 'upcoming', 'past'];
      for (var i = 0; i < keys.length; i++) {
        var el = document.getElementById('tf_' + keys[i]);
        if (el) el.className = 'f-chip' + (keys[i] === filterKey ? ' active' : '');
      }
      renderAll();
    }

    function pickLeague(code) {
      currentLeague = code;
      renderLeagues();
      renderAll();
    }

    function doRefresh() {
      var st = document.getElementById('syncStatus');
      st.innerHTML = 'جاري التحديث...';
      setTimeout(function () {
        st.innerHTML = 'جاهز';
        renderAll();
      }, 350);
    }

    function renderLeagues() {
      var html = '';
      for (var i = 0; i < LEAGUES.length; i++) {
        var l = LEAGUES[i];
        var cls = 'lg-chip' + (currentLeague === l.code ? ' active' : '');
        html += '<button type="button" class="' + cls + '" onclick="pickLeague(\'' + l.code + '\')">' + l.name + '</button>';
      }
      document.getElementById('leaguesBar').innerHTML = html;
    }

    function listToItems(arr, extraClass) {
      if (!arr || !arr.length) return '<li style="color:#94a3b8">غير متوفر</li>';
      var out = '';
      for (var i = 0; i < arr.length; i++) {
        out += '<li' + (extraClass ? ' class="' + extraClass + '"' : '') + '>' + arr[i] + '</li>';
      }
      return out;
    }

    function openDetails(matchId) {
      var m = null;
      for (var i = 0; i < MATCHES.length; i++) {
        if (MATCHES[i].id === matchId) {
          m = MATCHES[i];
          break;
        }
      }
      if (!m) return;

      var html =
        '<div class="modal-head">' +
          '<div class="modal-title">' + m.home + ' (' + m.score + ') ' + m.away + '</div>' +
          '<button type="button" class="close-btn" onclick="closeDetails()">إغلاق ✕</button>' +
        '</div>' +

        '<div class="d-section">' +
          '<div class="d-sec-title">معلومات المباراة</div>' +
          '<div style="font-size:12px;line-height:1.8">' +
            '<div><b>البطولة:</b> ' + m.league + ' — <b>الحالة:</b> ' + m.status + '</div>' +
            '<div><b>التاريخ والوقت:</b> ' + m.date + ' • ' + m.time + '</div>' +
            '<div><b>الملعب:</b> ' + (m.stadium || 'غير محدد') + ' • <b>الحكم:</b> ' + (m.referee || 'غير محدد') + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="d-section">' +
          '<div class="d-sec-title">التشكيلة الأساسية</div>' +
          '<div class="d-two-col">' +
            '<div class="d-team-box">' +
              '<div class="d-team-h">' + m.home + ' (' + (m.homeFormation || '') + ')</div>' +
              '<ol class="d-list">' + listToItems(m.homeLineup, '') + '</ol>' +
            '</div>' +
            '<div class="d-team-box">' +
              '<div class="d-team-h">' + m.away + ' (' + (m.awayFormation || '') + ')</div>' +
              '<ol class="d-list">' + listToItems(m.awayLineup, '') + '</ol>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="d-section">' +
          '<div class="d-sec-title">الاحتياط والدكة</div>' +
          '<div class="d-two-col">' +
            '<div class="d-team-box">' +
              '<div class="d-team-h">دكة ' + m.home + '</div>' +
              '<ul class="d-list">' + listToItems(m.homeBench, '') + '</ul>' +
            '</div>' +
            '<div class="d-team-box">' +
              '<div class="d-team-h">دكة ' + m.away + '</div>' +
              '<ul class="d-list">' + listToItems(m.awayBench, '') + '</ul>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="d-section">' +
          '<div class="d-sec-title">الإصابات والغيابات</div>' +
          '<div class="d-two-col">' +
            '<div class="d-team-box">' +
              '<div class="d-team-h">إصابات ' + m.home + '</div>' +
              '<ul class="d-list">' + listToItems(m.homeInjuries, 'd-inj') + '</ul>' +
            '</div>' +
            '<div class="d-team-box">' +
              '<div class="d-team-h">إصابات ' + m.away + '</div>' +
              '<ul class="d-list">' + listToItems(m.awayInjuries, 'd-inj') + '</ul>' +
            '</div>' +
          '</div>' +
        '</div>';

      document.getElementById('detailsContent').innerHTML = html;
      document.getElementById('detailsModal').style.display = 'block';
    }

    function closeDetails() {
      document.getElementById('detailsModal').style.display = 'none';
    }

    function backdropClose(e) {
      if (e && e.target && e.target.id === 'detailsModal') {
        closeDetails();
      }
    }

    function matchesFilter(m, q) {
      if (currentLeague !== 'ALL' && m.leagueCode !== currentLeague) return false;
      if (currentTimeFilter !== 'all' && m.kind !== currentTimeFilter) return false;
      if (q) {
        var hay = (m.league + ' ' + m.home + ' ' + m.away + ' ' + m.status + ' ' + m.date).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }

    function renderAll() {
      var qEl = document.getElementById('q');
      var q = qEl && qEl.value ? qEl.value.trim().toLowerCase() : '';
      var view = document.getElementById('view');
      var info = document.getElementById('infoBar');

      if (currentTab === 'matches') {
        var list = [];
        for (var i = 0; i < MATCHES.length; i++) {
          if (matchesFilter(MATCHES[i], q)) {
            list.push(MATCHES[i]);
          }
        }

        if (q) {
          info.innerHTML = 'نتائج البحث عن "' + qEl.value + '" (' + list.length + ' مباراة) — اضغط تفاصيل المباراة لعرض التشكيلة والدكة والإصابات.';
        } else {
          info.innerHTML = 'اليوم: ' + TODAY_STR + ' | الغد: ' + TOMORROW_STR + ' — اضغط على "تفاصيل المباراة" في أي بطاقة لعرض التشكيلة والدكة والإصابات.';
        }

        var out = '';
        for (var j = 0; j < list.length; j++) {
          var m = list[j];
          out += '<div class="card">' +
            '<div class="m-top"><span>' + m.league + '</span><span>' + m.status + '</span></div>' +
            '<div class="m-grid">' +
              '<div class="team-name">' + m.home + '</div>' +
              '<div class="score-box">' + m.score + '</div>' +
              '<div class="team-name">' + m.away + '</div>' +
            '</div>' +
            '<div class="meta-row">التاريخ: ' + m.date + ' • الساعة: ' + m.time + '</div>' +
            '<div class="m-actions">' +
              '<button type="button" class="details-btn" onclick="openDetails(\'' + m.id + '\')">تفاصيل المباراة</button>' +
            '</div>' +
          '</div>';
        }
        view.innerHTML = out || '<p style="text-align:center;color:#94a3b8">لا توجد مباريات مطابقة</p>';
      } else {
        var rows = STANDINGS[currentLeague] || [];
        info.innerHTML = 'جدول ترتيب الفرق للبطولة المحددة.';
        var trs = '';
        for (var k = 0; k < rows.length; k++) {
          var s = rows[k];
          var tHay = (String(s.team) + ' ' + String(s.pos)).toLowerCase();
          if (!q || tHay.indexOf(q) !== -1) {
            trs += '<tr>' +
              '<td><b>' + s.pos + '</b></td>' +
              '<td class="t-team">' + s.team + '</td>' +
              '<td>' + s.p + '</td><td>' + s.w + '</td><td>' + s.d + '</td><td>' + s.l + '</td>' +
              '<td><b style="color:#10b981">' + s.pts + '</b></td>' +
            '</tr>';
          }
        }
        view.innerHTML = '<div class="card" style="padding:6px"><table>' +
          '<thead><tr><th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>نقاط</th></tr></thead>' +
          '<tbody>' + (trs || '<tr><td colspan="7" style="color:#94a3b8">لا توجد فرق مطابقة</td></tr>') + '</tbody></table></div>';
      }
    }

    renderLeagues();
    renderAll();
  </script>
</body>
</html>
