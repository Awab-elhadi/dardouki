<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DARDOUKI" />
  <title>DARDOUKI - كرة القدم</title>
  <link id="pwaManifestLink" rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22DARDOUKI%22%2C%22short_name%22%3A%22DARDOUKI%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f1f5f9%22%2C%22theme_color%22%3A%22%23f59e0b%22%7D" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --line: #e2e8f0;
      --txt: #0f172a;
      --muted: #64748b;
      --acc: #f59e0b;
      --acc-dark: #78350f;
      --grn: #16a34a;
      --red: #dc2626;
      --soft: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      padding-bottom: 28px;
    }

    a { color: inherit; }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand {
      font-weight: 900;
      font-size: 18px;
      color: var(--txt);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand span {
      background: var(--acc);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sync {
      font-size: 11px;
      background: #fef3c7;
      color: var(--acc-dark);
      padding: 4px 9px;
      border-radius: 99px;
      font-weight: 800;
      white-space: nowrap;
    }

    .sync.err {
      background: #fee2e2;
      color: var(--red);
    }

    .install-btn {
      background: var(--acc);
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: none;
    }

    .wrap {
      max-width: 920px;
      margin: auto;
      padding: 10px;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      background: var(--card);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .title-lbl {
      font-size: 13px;
      font-weight: 900;
    }

    .btn {
      background: var(--txt);
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-sec {
      background: var(--soft);
      color: var(--txt);
      border: 1px solid var(--line);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: var(--card);
      color: var(--txt);
      border: 1px solid var(--line);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--txt);
      color: #ffffff;
      border-color: var(--txt);
    }

    .msg {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: var(--acc-dark);
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
      font-weight: 700;
    }

    .msg.err {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--red);
    }

    .loading-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 10px;
      display: none;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .box-h {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .row {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 105px 1fr auto 1fr 92px;
      align-items: center;
      gap: 8px;
    }

    .row:last-child { border-bottom: none; }

    .st {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      line-height: 1.35;
    }

    .st.live { color: var(--grn); }

    .tm {
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .tm.home {
      justify-content: flex-end;
      text-align: right;
    }

    .tm.away {
      justify-content: flex-start;
      text-align: left;
    }

    .logo-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .logo-lg {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .sc {
      background: var(--soft);
      border: 1px solid var(--line);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 900;
      min-width: 60px;
      text-align: center;
      white-space: nowrap;
    }

    .act-btn {
      background: var(--grn);
      color: #ffffff;
      border: none;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      width: 100%;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .tbl-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: var(--soft);
      font-weight: 900;
      color: var(--muted);
      font-size: 11px;
    }

    tr:last-child td { border-bottom: none; }

    .clickable-row { cursor: pointer; }
    .clickable-row:hover td { background: var(--soft); }

    .league-item, .player-lookup-card, .detail-card {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .league-item:last-child, .player-lookup-card:last-child, .detail-card:last-child {
      border-bottom: none;
    }

    .league-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .league-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 12px;
    }

    .slug-tag {
      font-size: 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      padding: 2px 7px;
      border-radius: 6px;
      color: var(--muted);
      direction: ltr;
      display: inline-block;
    }

    .lookup-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .inp {
      flex: 1;
      min-width: 180px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
      background: var(--card);
      color: var(--txt);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .kv {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .kv-k {
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
    }

    .kv-v {
      font-size: 13px;
      font-weight: 900;
      margin-top: 2px;
      word-break: break-word;
    }

    footer.credit {
      margin-top: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    footer.credit a {
      color: var(--acc-dark);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 78px 1fr auto 1fr 78px;
        gap: 5px;
        padding: 9px 8px;
      }
      .tm { font-size: 11px; }
      .logo-img { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="hdr-actions">
      <button type="button" class="install-btn" id="installPwaBtn">تثبيت التطبيق</button>
      <div class="sync" id="syncBadge">تحديث كل 90 ث</div>
    </div>
  </header>

  <div class="wrap">
    <div class="bar">
      <div class="title-lbl" id="sectionTitle">الرئيسية</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span id="todayIso" style="font-size:11px;color:#64748b;font-weight:800"></span>
        <button type="button" class="btn" id="refreshBtn" onclick="manualRefresh()">تحديث الآن</button>
      </div>
    </div>

    <div class="nav-tabs" role="tablist" aria-label="أقسام DARDOUKI">
      <button type="button" class="tab-btn active" data-tab="home" onclick="switchTab('home')">الرئيسية</button>
      <button type="button" class="tab-btn" data-tab="live" onclick="switchTab('live')">المباريات المباشرة</button>
      <button type="button" class="tab-btn" data-tab="today" onclick="switchTab('today')">مباريات اليوم</button>
      <button type="button" class="tab-btn" data-tab="upcoming" onclick="switchTab('upcoming')">المباريات القادمة</button>
      <button type="button" class="tab-btn" data-tab="results" onclick="switchTab('results')">النتائج السابقة</button>
      <button type="button" class="tab-btn" data-tab="leagues" onclick="switchTab('leagues')">جميع الدوريات المتاحة</button>
      <button type="button" class="tab-btn" data-tab="standings" onclick="switchTab('standings')">ترتيب الفرق</button>
      <button type="button" class="tab-btn" data-tab="scorers" onclick="switchTab('scorers')">الهدافون</button>
      <button type="button" class="tab-btn" data-tab="match" onclick="switchTab('match')">تفاصيل المباريات</button>
      <button type="button" class="tab-btn" data-tab="entity" onclick="switchTab('entity')">صفحات الفرق واللاعبين</button>
    </div>

    <div class="msg" id="msgBox"></div>
    <div class="loading-box" id="loadingBox">جاري تحميل البيانات من SportScore...</div>
    <div id="appContent"></div>

    <footer class="credit">
      Powered by <a href="https://sportscore.com/" target="_blank" rel="noopener noreferrer">SportScore</a>
    </footer>
  </div>

  <script>
    (function () {
      var BASE_URL = 'https://sportscore.com';
      var AUTO_SYNC_MS = 90000;
      var CACHE_TTL_MS = 85000;
      var REQUEST_TIMEOUT_MS = 14000;
      var VERIFIED_LA_LIGA_SLUG = 'spanish-la-liga';

      var state = {
        activeTab: 'home',
        matches: [],
        standings: null,
        scorers: null,
        matchDetail: null,
        selectedMatchSlug: '',
        teamData: null,
        selectedTeamSlug: '',
        playerData: null,
        selectedPlayerSlug: '',
        selectedLeagueSlug: VERIFIED_LA_LIGA_SLUG,
        isLoading: false,
        lastUpdatedAt: 0,
        lastError: ''
      };

      var memCache = new Map();
      var inflightMap = new Map();
      var deferredInstallPrompt = null;

      function getTodayIso() {
        var d = new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function escapeHtml(val) {
        if (val === null || val === undefined) return '';
        return String(val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function sanitizeLogoUrl(url) {
        if (!url || typeof url !== 'string') return '';
        var trimmed = url.trim();
        if (trimmed.indexOf('https://') === 0 || trimmed.indexOf('http://') === 0) {
          return trimmed;
        }
        return '';
      }

      function renderLogoHtml(url, altText, isLarge) {
        var safeUrl = sanitizeLogoUrl(url);
        if (!safeUrl) return '';
        var cls = isLarge ? 'logo-lg' : 'logo-img';
        return '<img class="' + cls + '" src="' + escapeHtml(safeUrl) + '" alt="' + escapeHtml(altText || '') + '" loading="lazy" onerror="this.style.display=\'none\'" />';
      }

      function setNotice(text, isError) {
        var box = document.getElementById('msgBox');
        if (!text) {
          box.style.display = 'none';
          box.textContent = '';
          box.className = 'msg';
          return;
        }
        box.style.display = 'block';
        box.textContent = text;
        box.className = isError ? 'msg err' : 'msg';
      }

      function setLoading(show, label) {
        state.isLoading = !!show;
        var box = document.getElementById('loadingBox');
        var btn = document.getElementById('refreshBtn');
        box.style.display = show ? 'block' : 'none';
        if (label) box.textContent = label;
        if (btn) btn.disabled = !!show;
      }

      function setSyncBadge(text, isError) {
        var badge = document.getElementById('syncBadge');
        badge.textContent = text;
        badge.className = isError ? 'sync err' : 'sync';
      }

      function readCache(key, allowExpired) {
        var now = Date.now();
        var item = memCache.get(key);
        if (item && (allowExpired || (now - item.ts) < CACHE_TTL_MS)) {
          return item.data;
        }
        try {
          var raw = localStorage.getItem('dardouki_cache:' + key);
          if (!raw) return null;
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed.ts !== 'number') return null;
          if (allowExpired || (now - parsed.ts) < CACHE_TTL_MS) {
            memCache.set(key, parsed);
            return parsed.data;
          }
        } catch (e) {}
        return null;
      }

      function writeCache(key, data) {
        var entry = { ts: Date.now(), data: data };
        memCache.set(key, entry);
        try {
          localStorage.setItem('dardouki_cache:' + key, JSON.stringify(entry));
        } catch (e) {}
      }

      function apiGet(endpointPath, forceRefresh) {
        var fullUrl = BASE_URL + endpointPath;
        if (!forceRefresh) {
          var cached = readCache(fullUrl, false);
          if (cached !== null) {
            return Promise.resolve(cached);
          }
        }
        if (inflightMap.has(fullUrl)) {
          return inflightMap.get(fullUrl);
        }

        var promise = new Promise(function (resolve, reject) {
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            var stale = readCache(fullUrl, true);
            if (stale !== null) {
              resolve(stale);
              return;
            }
            reject(new Error('OFFLINE'));
            return;
          }

          var xhr = new XMLHttpRequest();
          xhr.open('GET', fullUrl, true);
          xhr.timeout = REQUEST_TIMEOUT_MS;
          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
              try {
                var json = JSON.parse(xhr.responseText);
                writeCache(fullUrl, json);
                resolve(json);
              } catch (err) {
                reject(new Error('PARSE_ERROR'));
              }
            } else {
              reject(new Error('HTTP_' + xhr.status));
            }
          };
          xhr.ontimeout = function () {
            reject(new Error('TIMEOUT'));
          };
          xhr.onerror = function () {
            reject(new Error('NETWORK_ERROR'));
          };
          xhr.send();
        }).finally(function () {
          inflightMap.delete(fullUrl);
        });

        inflightMap.set(fullUrl, promise);
        return promise;
      }

      function extractListFromPayload(payload) {
        if (!payload) return [];
        if (Array.isArray(payload)) return payload;
        if (Array.isArray(payload.data)) return payload.data;
        if (Array.isArray(payload.matches)) return payload.matches;
        if (Array.isArray(payload.events)) return payload.events;
        if (Array.isArray(payload.results)) return payload.results;
        return [];
      }

      function getEntityName(obj, fallback) {
        if (!obj) return fallback || '';
        if (typeof obj === 'string') return obj;
        return obj.name || obj.title || obj.short_name || obj.full_name || fallback || '';
      }

      function getEntitySlug(obj) {
        if (!obj || typeof obj !== 'object') return '';
        return obj.slug || obj.id || '';
      }

      function normalizeMatch(raw) {
        var m = raw || {};
        var homeObj = m.home_team || m.home || {};
        var awayObj = m.away_team || m.away || {};
        var compObj = m.competition || m.league || m.tournament || {};

        var homeName = getEntityName(homeObj, m.home_team_name || m.home_name || '');
        var awayName = getEntityName(awayObj, m.away_team_name || m.away_name || '');
        var homeSlug = m.home_team_slug || getEntitySlug(homeObj) || '';
        var awaySlug = m.away_team_slug || getEntitySlug(awayObj) || '';
        var matchSlug = m.slug || m.match_slug || m.id || '';

        var homeLogo = sanitizeLogoUrl(
          m.home_logo || homeObj.logo || homeObj.team_logo || homeObj.image || ''
        );
        var awayLogo = sanitizeLogoUrl(
          m.away_logo || awayObj.logo || awayObj.team_logo || awayObj.image || ''
        );
        var compLogo = sanitizeLogoUrl(
          m.competition_logo || compObj.logo || compObj.competition_logo || compObj.image || ''
        );

        var compName = getEntityName(compObj, m.competition_name || m.league_name || '');
        var compSlug = m.competition_slug || getEntitySlug(compObj) || '';

        var statusRaw = String(m.status || m.status_type || m.match_status || m.state || '').trim();
        var stLower = statusRaw.toLowerCase();

        var isLive =
          m.is_live === true ||
          stLower === 'live' ||
          stLower === 'inprogress' ||
          stLower === 'in_progress' ||
          stLower === '1h' ||
          stLower === '2h' ||
          stLower === 'ht' ||
          stLower === 'extra_time';

        var isFinished =
          stLower === 'finished' ||
          stLower === 'ft' ||
          stLower === 'ended' ||
          stLower === 'completed' ||
          stLower === 'after_penalties' ||
          stLower === 'aet';

        var rawDate = String(m.start_at || m.date || m.start_time || m.utc_date || m.timestamp || '');
        var datePart = '';
        var timePart = '';
        if (rawDate) {
          var parsedDate = new Date(rawDate);
          if (!isNaN(parsedDate.getTime())) {
            var py = parsedDate.getFullYear();
            var pm = String(parsedDate.getMonth() + 1).padStart(2, '0');
            var pd = String(parsedDate.getDate()).padStart(2, '0');
            datePart = py + '-' + pm + '-' + pd;
            timePart = String(parsedDate.getHours()).padStart(2, '0') + ':' + String(parsedDate.getMinutes()).padStart(2, '0');
          } else {
            datePart = rawDate.slice(0, 10);
            timePart = rawDate.slice(11, 16);
          }
        }

        var homeScore =
          m.home_score !== undefined && m.home_score !== null && m.home_score !== ''
            ? m.home_score
            : (homeObj.score !== undefined && homeObj.score !== null ? homeObj.score : '');
        var awayScore =
          m.away_score !== undefined && m.away_score !== null && m.away_score !== ''
            ? m.away_score
            : (awayObj.score !== undefined && awayObj.score !== null ? awayObj.score : '');

        var hasScore = homeScore !== '' && awayScore !== '';
        var scoreText = hasScore ? (homeScore + ' - ' + awayScore) : (timePart || 'vs');

        var statusLabel = statusRaw || (isLive ? 'مباشر' : (isFinished ? 'انتهت' : (timePart ? ('مجدولة • ' + timePart) : 'مجدولة')));
        if (isLive && m.minute) {
          statusLabel = statusLabel + ' • ' + m.minute + "'";
        }

        return {
          slug: String(matchSlug || ''),
          homeName: String(homeName || ''),
          awayName: String(awayName || ''),
          homeSlug: String(homeSlug || ''),
          awaySlug: String(awaySlug || ''),
          homeLogo: homeLogo,
          awayLogo: awayLogo,
          compName: String(compName || ''),
          compSlug: String(compSlug || ''),
          compLogo: compLogo,
          datePart: datePart,
          timePart: timePart,
          statusLabel: statusLabel,
          isLive: isLive,
          isFinished: isFinished,
          hasScore: hasScore,
          scoreText: scoreText,
          raw: m
        };
      }

      function loadMatches(forceRefresh) {
        return apiGet('/api/widget/matches/?sport=football&limit=50', forceRefresh).then(function (payload) {
          var rawList = extractListFromPayload(payload);
          var normalized = [];
          for (var i = 0; i < rawList.length; i++) {
            var item = normalizeMatch(rawList[i]);
            if (item.homeName || item.awayName) {
              normalized.push(item);
            }
          }
          state.matches = normalized;
          state.lastUpdatedAt = Date.now();
          state.lastError = '';
          return normalized;
        });
      }

      function syncCurrentTab(forceRefresh, isBackground) {
        var tab = state.activeTab;
        if (!isBackground) {
          setLoading(true, 'جاري تحديث البيانات...');
          setNotice('', false);
        }
        setSyncBadge(isBackground ? 'تحديث تلقائي...' : 'جاري التحديث...', false);

        var tasks = [];
        if (tab === 'home' || tab === 'live' || tab === 'today' || tab === 'upcoming' || tab === 'results' || tab === 'leagues') {
          tasks.push(loadMatches(forceRefresh));
        }
        if (tab === 'home' || tab === 'standings') {
          tasks.push(loadStandings(VERIFIED_LA_LIGA_SLUG, forceRefresh));
        }
        if (tab === 'home' || tab === 'scorers') {
          tasks.push(loadScorers(VERIFIED_LA_LIGA_SLUG, forceRefresh));
        }
        if (tab === 'match' && state.selectedMatchSlug) {
          tasks.push(loadMatchDetail(state.selectedMatchSlug, forceRefresh));
        }
        if (tab === 'entity' && state.selectedTeamSlug) {
          tasks.push(loadTeam(state.selectedTeamSlug, forceRefresh));
        }
        if (tab === 'entity' && state.selectedPlayerSlug) {
          tasks.push(loadPlayer(state.selectedPlayerSlug, forceRefresh));
        }

        Promise.allSettled(tasks).then(function (results) {
          setLoading(false);
          var anyRejected = false;
          var firstErr = '';
          for (var i = 0; i < results.length; i++) {
            if (results[i].status === 'rejected') {
              anyRejected = true;
              if (!firstErr) {
                firstErr = (results[i].reason && results[i].reason.message) || 'NETWORK_ERROR';
              }
            }
          }

          if (anyRejected) {
            state.lastError = firstErr;
            setSyncBadge(firstErr === 'OFFLINE' ? 'بدون إنترنت' : 'تعذر التحديث', true);
            setNotice('تعذر جلب بعض البيانات من SportScore (' + firstErr + '). سيتم إعادة المحاولة تلقائياً كل 90 ثانية.', true);
          } else {
            state.lastError = '';
            setSyncBadge('محدّث • كل 90 ث', false);
            setNotice('', false);
          }

          render();
        });
      }

      window.manualRefresh = function () {
        syncCurrentTab(true, false);
      };

          entity: 'صفحات الفرق واللاعبين'

        document.getElementById('sectionTitle').textContent = labels[tabName] || 'الرئيسية';
        render();
