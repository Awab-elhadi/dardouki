<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DARDOUKI" />
  <title>DARDOUKI</title>
  <link id="pwaManifestLink" rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22DARDOUKI%22%2C%22short_name%22%3A%22DARDOUKI%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f1f5f9%22%2C%22theme_color%22%3A%22%23f59e0b%22%7D" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --line: #e2e8f0;
      --txt: #0f172a;
      --muted: #64748b;
      --acc: #f59e0b;
      --acc-dark: #78350f;
      --grn: #16a34a;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--txt);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      font-weight: 900;
      font-size: 16px;
      color: var(--txt);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand span {
      background: var(--acc);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync {
      font-size: 10px;
      background: #fef3c7;
      color: var(--acc-dark);
      padding: 4px 8px;
      border-radius: 99px;
      font-weight: 800;
      white-space: nowrap;
    }

    .sync.err {
      background: #fee2e2;
      color: var(--red);
    }

    .btn-mini {
      background: var(--txt);
      color: #ffffff;
      border: none;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .install-btn {
      background: var(--acc);
      color: #ffffff;
      border: none;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: none;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: var(--card);
    }

    iframe#sportscoreFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: var(--card);
    }

    .overlay-msg {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      z-index: 10;
    }

    .overlay-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 16px;
      max-width: 380px;
      width: 100%;
    }

    .overlay-title {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .overlay-desc {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    footer.credit {
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 6px 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    footer.credit a {
      color: var(--acc-dark);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">⚡ <span>DARDOUKI</span></div>
      <div class="hdr-actions">
        <button type="button" class="install-btn" id="installPwaBtn">تثبيت</button>
        <div class="sync" id="syncBadge">تحديث كل 90 ث</div>
        <button type="button" class="btn-mini" onclick="reloadSportScoreView()">تحديث</button>
      </div>
    </header>

    <div class="stage">
      <div class="overlay-msg" id="fallbackOverlay">
        <div class="overlay-card">
          <div class="overlay-title" id="overlayTitle">تعذر عرض واجهة SportScore مباشرة</div>
          <div class="overlay-desc" id="overlayDesc">
            قد يمنع المتصفح تضمين الموقع داخل إطار، أو يوجد انقطاع في الاتصال. يمكنك فتحه مباشرة أو إعادة المحاولة.
          </div>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button type="button" class="btn-mini" onclick="reloadSportScoreView()">إعادة المحاولة</button>
            <a class="btn-mini" style="background:var(--grn);text-decoration:none" href="https://sportscore.com/" target="_blank" rel="noopener noreferrer">فتح SportScore</a>
          </div>
        </div>
      </div>

      <iframe
        id="sportscoreFrame"
        src="https://sportscore.com/"
        title="DARDOUKI - SportScore"
        allow="fullscreen"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>

    <footer class="credit">
      Powered by <a href="https://sportscore.com/" target="_blank" rel="noopener noreferrer">SportScore</a>
    </footer>
  </div>

  <script>
    (function () {
      var TARGET_URL = 'https://sportscore.com/';
      var AUTO_SYNC_MS = 90000;
      var frame = document.getElementById('sportscoreFrame');
      var overlay = document.getElementById('fallbackOverlay');
      var badge = document.getElementById('syncBadge');
      var deferredInstallPrompt = null;

      function setBadge(text, isError) {
        badge.textContent = text;
        badge.className = isError ? 'sync err' : 'sync';
      }

      window.reloadSportScoreView = function () {
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          setBadge('بدون إنترنت', true);
          document.getElementById('overlayTitle').textContent = 'لا يوجد اتصال بالإنترنت';
          document.getElementById('overlayDesc').textContent = 'تحقق من اتصالك بالشبكة ثم اضغط إعادة المحاولة.';
          overlay.style.display = 'flex';
          return;
        }
        overlay.style.display = 'none';
        setBadge('جاري التحديث...', false);
        frame.src = TARGET_URL + (TARGET_URL.indexOf('?') === -1 ? '?_t=' : '&_t=') + Date.now();
      };

      frame.addEventListener('load', function () {
        overlay.style.display = 'none';
        setBadge('محدّث • كل 90 ث', false);
      });

      frame.addEventListener('error', function () {
        setBadge('تعذر التحميل', true);
        overlay.style.display = 'flex';
      });

      window.addEventListener('online', function () {
        reloadSportScoreView();
      });

      window.addEventListener('offline', function () {
        setBadge('بدون إنترنت', true);
        document.getElementById('overlayTitle').textContent = 'لا يوجد اتصال بالإنترنت';
        document.getElementById('overlayDesc').textContent = 'تم فقدان الاتصال بالشبكة حالياً.';
        overlay.style.display = 'flex';
      });

      window.addEventListener('beforeinstallprompt', function (ev) {
        ev.preventDefault();
        deferredInstallPrompt = ev;
        var btn = document.getElementById('installPwaBtn');
        if (btn) btn.style.display = 'inline-block';
      });

      var installBtn = document.getElementById('installPwaBtn');
      if (installBtn) {
        installBtn.addEventListener('click', function () {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          deferredInstallPrompt.userChoice.finally(function () {
            deferredInstallPrompt = null;
            installBtn.style.display = 'none';
          });
        });
