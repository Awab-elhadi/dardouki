<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصحف القرآن الكريم</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #f4f0e6;
      --bg-paper: #fffdf8;
      --bg-sidebar: #faf6ed;
      --bg-header: #164b3b;
      --text-main: #1b2420;
      --text-muted: #5b6861;
      --accent: #1b5e4a;
      --accent-soft: rgba(27, 94, 74, 0.12);
      --gold: #b58632;
      --gold-soft: rgba(181, 134, 50, 0.14);
      --border: #dfd6c3;
      --highlight: rgba(181, 134, 50, 0.24);
      --mark-bg: rgba(181, 134, 50, 0.32);
      --ornament: rgba(181, 134, 50, 0.38);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-page: #f4f0e6;
      --bg-paper: #fffdf8;
      --bg-sidebar: #faf6ed;
      --bg-header: #164b3b;
      --text-main: #1b2420;
      --text-muted: #5b6861;
      --accent: #1b5e4a;
      --accent-soft: rgba(27, 94, 74, 0.12);
      --gold: #b58632;
      --gold-soft: rgba(181, 134, 50, 0.14);
      --border: #dfd6c3;
      --highlight: rgba(181, 134, 50, 0.24);
      --mark-bg: rgba(181, 134, 50, 0.32);
      --ornament: rgba(181, 134, 50, 0.38);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #0c0e0d;
      --bg-paper: #121514;
      --bg-sidebar: #161a18;
      --bg-header: #101412;
      --text-main: #eceae4;
      --text-muted: #9aa39e;
      --accent: #38a17f;
      --accent-soft: rgba(56, 161, 127, 0.16);
      --gold: #d4a64a;
      --gold-soft: rgba(212, 166, 74, 0.16);
      --border: #272d2a;
      --highlight: rgba(212, 166, 74, 0.22);
      --mark-bg: rgba(212, 166, 74, 0.32);
      --ornament: rgba(212, 166, 74, 0.32);
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] {
        --bg-page: #0c0e0d;
        --bg-paper: #121514;
        --bg-sidebar: #161a18;
        --bg-header: #101412;
        --text-main: #eceae4;
        --text-muted: #9aa39e;
        --accent: #38a17f;
        --accent-soft: rgba(56, 161, 127, 0.16);
        --gold: #d4a64a;
        --gold-soft: rgba(212, 166, 74, 0.16);
        --border: #272d2a;
        --highlight: rgba(212, 166, 74, 0.22);
        --mark-bg: rgba(212, 166, 74, 0.32);
        --ornament: rgba(212, 166, 74, 0.32);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Traditional Arabic", "Scheherazade New", "Amiri", "Noto Naskh Arabic", Tahoma, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .topbar {
      background-color: var(--bg-header);
      color: #ffffff;
      padding: 0.45rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 7px;
      padding: 0.25rem 0.55rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.22);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-gold {
      background-color: var(--gold);
      color: #111413;
      border-color: transparent;
    }

    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.52);
      z-index: 60;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      right: -310px;
      width: 295px;
      max-width: 85vw;
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      z-index: 70;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.25);
    }

    .side-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 0.8rem 0.95rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-header h2 {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .drawer-search {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .drawer-search input {
      width: 100%;
      font-family: inherit;
      font-size: 0.98rem;
      padding: 0.35rem 0.6rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--bg-paper);
      color: var(--text-main);
      outline: none;
    }

    .surah-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.35rem;
    }

    .surah-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.65rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 1.05rem;
      margin-bottom: 0.15rem;
      border: 1px solid transparent;
    }

    .surah-item:hover {
      background-color: var(--accent-soft);
    }

    .surah-item.active {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .surah-item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .mushaf-wrap {
      max-width: 920px;
      margin: 0.6rem auto 1.5rem;
      padding: 0 0.55rem;
    }

    .ayah-search-box {
      background-color: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.42rem 0.6rem;
      margin-bottom: 0.6rem;
    }

    .ayah-search-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .ayah-search-row input {
      flex: 1;
      min-width: 165px;
      font-family: inherit;
      font-size: 0.96rem;
      padding: 0.28rem 0.55rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--bg-page);
      color: var(--text-main);
      outline: none;
    }

    .scope-btn {
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 0.26rem 0.52rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--accent-soft);
      color: var(--text-main);
      cursor: pointer;
    }

    .search-results-panel {
      display: none;
      margin-top: 0.45rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--border);
      max-height: 240px;
      overflow-y: auto;
    }

    .search-results-panel.open {
      display: block;
    }

    .search-results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .clear-search-btn {
      font-family: inherit;
      font-size: 0.82rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 0.08rem 0.42rem;
      cursor: pointer;
    }

    .result-ayah-card {
      padding: 0.4rem 0.55rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--bg-page);
      margin-bottom: 0.3rem;
      cursor: pointer;
    }

    .result-ayah-card:hover {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .result-ayah-meta {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.08rem;
    }

    .result-ayah-text {
      font-size: 1.15rem;
      line-height: 1.65;
    }

    mark.hit {
      background-color: var(--mark-bg);
      color: inherit;
      padding: 0 0.1rem;
      border-radius: 3px;
    }

    .mushaf-frame {
      background-color: var(--bg-paper);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 0.32rem;
    }

    .mushaf-inner-frame {
      border: 1px solid var(--ornament);
      border-radius: 9px;
      padding: 0.7rem 0.8rem 0.9rem;
      background-image:
        radial-gradient(circle at top right, var(--gold-soft) 0, transparent 22%),
        radial-gradient(circle at top left, var(--gold-soft) 0, transparent 22%),
        radial-gradient(circle at bottom right, var(--gold-soft) 0, transparent 22%),
        radial-gradient(circle at bottom left, var(--gold-soft) 0, transparent 22%);
    }

    .page-header-ornament {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 0.38rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--ornament);
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .surah-cartouche {
      text-align: center;
      border: 1px solid var(--gold);
      background-color: var(--gold-soft);
      border-radius: 9px;
      padding: 0.22rem 0.65rem;
      margin: 0.45rem 0;
    }

    .surah-cartouche::before,
    .surah-cartouche::after {
      content: "❖";
      color: var(--gold);
      font-size: 0.85rem;
      margin: 0 0.4rem;
      vertical-align: middle;
    }

    .surah-cartouche-title {
      display: inline;
      font-size: 1.32rem;
      font-weight: 700;
      color: var(--accent);
    }

    .basmala-ornament {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      padding: 0.15rem 0.35rem 0.3rem;
      margin-bottom: 0.35rem;
      border-bottom: 1px dashed var(--ornament);
    }

    .mushaf-page-text {
      font-size: 1.42rem;
      line-height: 1.72;
      text-align: right;
      word-spacing: normal;
      letter-spacing: normal;
      color: var(--text-main);
      min-height: 80px;
    }

    .ayah-span {
      cursor: pointer;
      padding: 0;
      margin: 0;
      border-radius: 4px;
    }

    .ayah-span:hover {
      background-color: var(--accent-soft);
    }

    .ayah-span.active {
      background-color: var(--highlight);
      box-shadow: inset 0 -2px 0 var(--gold);
    }

    .ayah-rosace {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.25rem;
      height: 1.25rem;
      padding: 0 0.16rem;
      margin: 0 0.12rem;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      background-color: var(--gold-soft);
      border: 1px solid var(--gold);
      border-radius: 50%;
      vertical-align: middle;
      line-height: 1;
    }

    .tafsir-bar {
      margin-top: 0.65rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--ornament);
      font-size: 0.94rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .tafsir-bar strong {
      color: var(--accent);
    }

    .rest-surah-actions {
      margin-top: 0.5rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .rest-surah-actions.show {
      display: flex;
    }

    .back-pages-btn {
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 0.28rem 0.65rem;
      cursor: pointer;
    }

    .page-nav-bar {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--ornament);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .page-indicator {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent);
      padding: 0.14rem 0.6rem;
      border-radius: 20px;
      border: 1px solid var(--ornament);
      background-color: var(--gold-soft);
    }

    .page-nav-bar .btn {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.3rem 0.7rem;
    }
  </style>
</head>
<body>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <aside id="sideDrawer" class="side-drawer" aria-label="قائمة السور">
    <div class="drawer-header">
      <h2>السور (١١٤)</h2>
      <button id="closeDrawerBtn" class="btn" type="button" style="color:var(--text-main);border-color:var(--border);">إغلاق</button>
    </div>
    <div class="drawer-search">
      <input id="surahFilterInput" type="search" placeholder="ابحث عن اسم سورة..." />
    </div>
    <ul id="surahList" class="surah-list"></ul>
  </aside>

  <header class="topbar">
    <div class="topbar-group">
      <button id="openDrawerBtn" class="btn btn-gold" type="button">☰ السور</button>
      <button id="resumeBtn" class="btn" type="button">آخر قراءة</button>
    </div>

    <div class="topbar-group">
      <button id="themeBtn" class="btn" type="button">الوضع: نظام الجهاز</button>
      <button id="fontBtn" class="btn" type="button">تكبير الخط</button>
    </div>
  </header>

  <main class="mushaf-wrap">
    <section class="ayah-search-box" aria-label="البحث في الآيات">
      <div class="ayah-search-row">
        <input id="ayahSearchInput" type="search" placeholder="ابحث في الآيات (مثال: نور السموات، الصراط، أحد)..." />
        <button id="scopeBtn" class="scope-btn" type="button">النطاق: كل المصحف</button>
      </div>
      <div id="searchResultsPanel" class="search-results-panel">
        <div class="search-results-header">
          <span id="searchStatusText">الآيات المطابقة:</span>
          <button id="clearSearchBtn" class="clear-search-btn" type="button">إخفاء النتائج</button>
        </div>
        <div id="searchResultsList"></div>
      </div>
    </section>

    <article class="mushaf-frame">
      <div class="mushaf-inner-frame">
        <div class="page-header-ornament">
          <span id="pageSurahsTop">المصحف الشريف</span>
          <span id="pageNumTop">صفحة ٢ من ٦٠٤</span>
        </div>

        <div id="quranPageText" class="mushaf-page-text"></div>

        <div id="tafsirBar" class="tafsir-bar">
          <strong id="tafsirLabel">التفسير الميسر:</strong>
          <span id="tafsirContent">اضغط على أي آية لفتح باقي السورة من هذه الآية وعرض تفسيرها.</span>
        </div>

        <div id="restSurahActions" class="rest-surah-actions">
          <span id="restSurahStatus" style="font-size:0.86rem;color:var(--text-muted);"></span>
          <button id="backToPagesBtn" class="back-pages-btn" type="button">الرجوع لصفحات المصحف</button>
        </div>

        <div id="pageNavBar" class="page-nav-bar">
          <button id="prevPageBtn" class="btn" type="button">الصفحة السابقة</button>
          <span id="pageCounter" class="page-indicator">صفحة ٢ / ٦٠٤</span>
          <button id="nextPageBtn" class="btn" type="button">الصفحة التالية</button>
        </div>
      </div>
    </article>
  </main>

    function scrollToTopNow() {
      try {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      } catch (e) {}
    }

    function toAr(n) {
      return String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[Number(d)]);
    }

    function normalizeArabic(str) {
      try {
        return String(str || "")
          .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
          .replace(/[ٱإأآا]/g, "ا")
          .replace(/[ىيئ]/g, "ي")
          .replace(/ة/g, "ه")
          .replace(/ؤ/g, "و")
          .replace(/\s+/g, " ")
          .trim();
      } catch (e) {
        return String(str || "").trim();
      }
    }

    function escapeRegExp(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightPlainText(text, query) {
      const q = query.trim();
      if (!q) return document.createTextNode(text);
      const regex = new RegExp(`(${escapeRegExp(q)})`, "gi");
      const parts = text.split(regex);
      const frag = document.createDocumentFragment();
      parts.forEach((part) => {
        if (!part) return;
        if (part.toLowerCase() === q.toLowerCase()) {
          const mark = document.createElement("mark");
          mark.className = "hit";
          mark.textContent = part;
          frag.appendChild(mark);
        } else {
          frag.appendChild(document.createTextNode(part));
        }
      });
      return frag;
    }

    function applyTheme(mode) {
      document.documentElement.setAttribute("data-theme", mode);
      themeBtn.textContent = THEME_LABELS[mode] || THEME_LABELS.auto;
      try {
        localStorage.setItem(THEME_KEY, mode);
      } catch (e) {}
    }

    function initTheme() {
      let saved = "auto";
      try {
        saved = localStorage.getItem(THEME_KEY) || "auto";
      } catch (e) {}
      const idx = THEME_MODES.indexOf(saved);
      themeIndex = idx >= 0 ? idx : 0;
      applyTheme(THEME_MODES[themeIndex]);
    }

    function openDrawer() {
      sideDrawer.classList.add("open");
      drawerBackdrop.classList.add("open");
    }

    function closeDrawer() {
      sideDrawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    function getSurahAtPage(pageNum) {
      let active = SURAHS_114[0];
      for (const s of SURAHS_114) {
        if (s[4] <= pageNum) active = s;
        else break;
      }
      return active[0];
    }

    function renderSurahList(filter = "") {
      const q = filter.trim();
      const activeSurahNum = viewMode === "restOfSurah" && restSurahNum ? restSurahNum : getSurahAtPage(currentPage);
      surahList.innerHTML = "";
      SURAHS_114
        .filter(([, name]) => !q || name.includes(q))
        .forEach(([num, name, , , startPage]) => {
          const li = document.createElement("li");
          li.className = "surah-item" + (num === activeSurahNum ? " active" : "");
          li.innerHTML = `<span>${toAr(num)}. ${name}</span><span class="surah-item-meta">ص ${toAr(startPage)}</span>`;
          li.addEventListener("click", () => {
            closeDrawer();
            loadMushafPage(startPage, `${num}:1`, true);
          });
          surahList.appendChild(li);
        });
    }

    function savePos(page, surah, ayah) {
      try {
        localStorage.setItem(POS_KEY, JSON.stringify({ page, surah, ayah }));
      } catch (e) {}
    }

    function getPos() {
      try {
        const raw = localStorage.getItem(POS_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function makeSurahCartouche(surahName) {
      const box = document.createElement("div");
      box.className = "surah-cartouche";
      const h = document.createElement("div");
      h.className = "surah-cartouche-title";
      h.textContent = surahName;
      box.appendChild(h);
      return box;
    }

    function makeBasmalaBox() {
      const b = document.createElement("div");
      b.className = "basmala-ornament";
      b.textContent = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
      return b;
    }

    function renderAyahNodes(ayahs, showCartoucheAtStart = false) {
      quranPageText.innerHTML = "";

      if (!ayahs.length) {
        quranPageText.textContent = "تعذر تحميل الآيات؛ تحقق من الاتصال بالإنترنت.";
        return;
      }

      ayahs.forEach((ayah, idx) => {
        if ((ayah.numberInSurah === 1 && currentPage !== 1 && viewMode === "pages") || (idx === 0 && showCartoucheAtStart)) {
          quranPageText.appendChild(makeSurahCartouche(ayah.surahName));
          if (ayah.numberInSurah === 1 && ayah.surahNumber !== 1 && ayah.surahNumber !== 9) {
            quranPageText.appendChild(makeBasmalaBox());
          }
        }

        let txt = ayah.text;
        if (
          ayah.surahNumber !== 1 &&
          ayah.numberInSurah === 1 &&
          txt.indexOf("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ") === 0
        ) {
          txt = txt.slice("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ".length);
        }

        const key = `${ayah.surahNumber}:${ayah.numberInSurah}`;
        const span = document.createElement("span");
        span.className = "ayah-span";
        span.dataset.key = key;

        const badge = document.createElement("span");
        badge.className = "ayah-rosace";
        badge.textContent = toAr(ayah.numberInSurah);

        span.textContent = txt;
        span.appendChild(badge);

        span.addEventListener("click", () => {
          if (viewMode === "pages") {
            openRestOfSurah(ayah.surahNumber, ayah.numberInSurah, ayah.surahName);
          } else {
            highlightAndShowTafsir(ayah.surahNumber, ayah.numberInSurah, ayah.surahName);
          }
        });

        quranPageText.appendChild(span);
        quranPageText.appendChild(document.createTextNode(" "));
      });
    }

    function highlightAndShowTafsir(surahNum, ayahNum, surahName = "") {
      const key = `${surahNum}:${ayahNum}`;
      quranPageText.querySelectorAll(".ayah-span").forEach((el) => {
        el.classList.toggle("active", el.dataset.key === key);
      });

      const foundTafsir = currentPageTafsir.find(
        (t) =>
          (t.surah && t.surah.number === Number(surahNum) && t.numberInSurah === Number(ayahNum)) ||
          (t.numberInSurah === Number(ayahNum) && viewMode === "restOfSurah" && Number(restSurahNum) === Number(surahNum))
      );

      const sInfo = SURAHS_114.find(([n]) => n === Number(surahNum));
      const sName = surahName || (sInfo ? sInfo[1] : "");

      tafsirLabel.textContent = `${sName} • آية (${toAr(ayahNum)}): `;
      tafsirContent.textContent = foundTafsir ? foundTafsir.text : "تم تحديد موضع القراءة وحفظه تلقائياً.";
      savePos(currentPage, Number(surahNum), Number(ayahNum));
    }

    async function openRestOfSurah(surahNum, startAyahNum, surahName = "") {
      viewMode = "restOfSurah";
      restSurahNum = Number(surahNum);
      restStartAyah = Number(startAyahNum) || 1;

      const sInfo = SURAHS_114.find(([n]) => n === restSurahNum);
      const sName = surahName || (sInfo ? sInfo[1] : `سورة ${toAr(restSurahNum)}`);

      pageSurahsTop.textContent = `${sName} • من آية (${toAr(restStartAyah)}) إلى آخر السورة`;
      pageNumTop.textContent = "عرض باقي السورة";
      pageNavBar.style.display = "none";
      restSurahActions.classList.add("show");
      restSurahStatus.textContent = `جاري تحميل باقي ${sName} من الآية (${toAr(restStartAyah)})...`;

      renderSurahList(surahFilterInput.value);
      scrollToTopNow();

      try {
        const qRes = await fetch(`${API_BASE}/surah/${restSurahNum}/quran-uthmani`);
        const qJson = await qRes.json();

        fetch(`${API_BASE}/surah/${restSurahNum}/ar.muyassar`)
          .then((r) => r.json())
          .then((fJson) => {
            if (viewMode === "restOfSurah" && restSurahNum === Number(surahNum) && fJson.code === 200 && fJson.data && Array.isArray(fJson.data.ayahs)) {
              currentPageTafsir = fJson.data.ayahs;
              highlightAndShowTafsir(restSurahNum, restStartAyah, sName);
            }
          })
          .catch(() => {});

        if (viewMode === "restOfSurah" && restSurahNum === Number(surahNum) && qJson.code === 200 && qJson.data && Array.isArray(qJson.data.ayahs)) {
          const allSurahAyahs = qJson.data.ayahs.map((a) => ({
            surahNumber: restSurahNum,
            surahName: sName,
            numberInSurah: a.numberInSurah,
            text: a.text
          }));

          const remaining = allSurahAyahs.filter((a) => a.numberInSurah >= restStartAyah);
          renderAyahNodes(remaining, true);
          restSurahStatus.textContent = `يعرض من آية (${toAr(restStartAyah)}) إلى آية (${toAr(allSurahAyahs.length)}) في ${sName}`;
          highlightAndShowTafsir(restSurahNum, restStartAyah, sName);
          scrollToTopNow();
        }
      } catch (e) {
        if (viewMode === "restOfSurah") {
          restSurahStatus.textContent = "تعذر تحميل باقي السورة؛ تحقق من الاتصال بالإنترنت.";
        }
      }
    }

    function renderPageContent(ayahs, tafsirList, targetKey = null) {
      viewMode = "pages";
      restSurahNum = null;
      restStartAyah = null;
      pageNavBar.style.display = "flex";
      restSurahActions.classList.remove("show");

      currentPageAyahs = Array.isArray(ayahs) ? ayahs : [];
      if (Array.isArray(tafsirList) && tafsirList.length) {
        currentPageTafsir = tafsirList;
      }

      const uniqueSurahs = [];
      currentPageAyahs.forEach((a) => {
        if (!uniqueSurahs.includes(a.surahName)) uniqueSurahs.push(a.surahName);
      });

      pageSurahsTop.textContent = uniqueSurahs.join(" • ") || "المصحف الشريف";
      pageNumTop.textContent = `صفحة ${toAr(currentPage)} من ${toAr(TOTAL_MUSHAF_PAGES)}`;
      pageCounter.textContent = `صفحة ${toAr(currentPage)} / ${toAr(TOTAL_MUSHAF_PAGES)}`;
      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= TOTAL_MUSHAF_PAGES;

      renderAyahNodes(currentPageAyahs, false);

      if (currentPageAyahs.length) {
        const firstKey = `${currentPageAyahs[0].surahNumber}:${currentPageAyahs[0].numberInSurah}`;
        const chosenKey =
          targetKey && currentPageAyahs.some((a) => `${a.surahNumber}:${a.numberInSurah}` === targetKey)
            ? targetKey
            : firstKey;

        const [sPart, aPart] = chosenKey.split(":");
        highlightAndShowTafsir(Number(sPart), Number(aPart));
      }
    }

    function renderSearchMatches(matches, query, note = "") {
      searchResultsPanel.classList.add("open");
      searchResultsList.innerHTML = "";

      if (!matches.length) {
        searchStatusText.textContent = note || "لا توجد آيات مطابقة لهذا البحث.";
        return;
      }

      searchStatusText.textContent = note || `الآيات المطابقة (${toAr(matches.length)}):`;

      matches.slice(0, 60).forEach((item) => {
        const card = document.createElement("div");
        card.className = "result-ayah-card";

        const meta = document.createElement("div");
        meta.className = "result-ayah-meta";
        const pTxt = item.page ? ` • صفحة ${toAr(item.page)}` : "";
        meta.textContent = `${item.surahName} • آية (${toAr(item.ayahNumber)})${pTxt}`;

        const body = document.createElement("div");
        body.className = "result-ayah-text";
        body.appendChild(highlightPlainText(item.text, query));

        card.appendChild(meta);
        card.appendChild(body);

        card.addEventListener("click", async () => {
          const destPage = item.page || currentPage;
          const destKey = `${item.surahNumber}:${item.ayahNumber}`;
          if (destPage !== currentPage) {
            await loadMushafPage(destPage, destKey, true);
          } else {
            renderPageContent(currentPageAyahs, currentPageTafsir, destKey);
          }
        });

        searchResultsList.appendChild(card);
      });
    }

    function filterLocalMatches(q) {
      const normQ = normalizeArabic(q);
      const words = normQ.split(" ").filter(Boolean);
      return currentPageAyahs
        .filter((a) => {
          if (a.text.indexOf(q) !== -1) return true;
          const normAyah = normalizeArabic(a.text);
          if (!normQ) return false;
          if (normAyah.indexOf(normQ) !== -1) return true;
          return words.length > 1 && words.every((w) => normAyah.indexOf(w) !== -1);
        })
        .map((a) => ({
          surahNumber: a.surahNumber,
          surahName: a.surahName,
          ayahNumber: a.numberInSurah,
          page: currentPage,
          text: a.text
        }));
    }

    async function runAyahSearch() {
      const q = ayahSearchInput.value.trim();
      if (!q) {
        searchResultsPanel.classList.remove("open");
        searchResultsList.innerHTML = "";
        return;
      }

      const localMatches = filterLocalMatches(q);

      if (!searchAllQuran) {
        renderSearchMatches(localMatches, q);
        return;
      }

      renderSearchMatches(localMatches, q, "جاري البحث في جميع صفحات المصحف...");
      try {
        const res = await fetch(`${API_BASE}/search/${encodeURIComponent(q)}/all/quran-uthmani`);
        const data = await res.json();
        if (data.code === 200 && data.data && Array.isArray(data.data.matches) && data.data.matches.length) {
          const apiMatches = data.data.matches.map((m) => ({
            surahNumber: m.surah.number,
            surahName: m.surah.name,
            ayahNumber: m.numberInSurah,
            page: m.page || null,
            text: m.text
          }));
          renderSearchMatches(apiMatches, q);
        } else {
          renderSearchMatches(localMatches, q);
        }
      } catch (e) {
        renderSearchMatches(localMatches, q, localMatches.length ? "" : "تعذر البحث في كامل المصحف؛ تحقق من الاتصال بالإنترنت.");
      }
    }

    function fetchTafsirAsync(pageNum) {
      fetch(`${API_BASE}/page/${pageNum}/ar.muyassar`)
        .then((res) => res.json())
        .then((json) => {
          if (viewMode === "pages" && currentPage === pageNum && json.code === 200 && json.data && Array.isArray(json.data.ayahs)) {
            currentPageTafsir = json.data.ayahs;
          }
        })
        .catch(() => {});
    }

    async function loadMushafPage(pageNum, targetKey = null, shouldScrollTop = false) {
      const clampedPage = Math.min(Math.max(1, Number(pageNum) || 2), TOTAL_MUSHAF_PAGES);
      viewMode = "pages";
      restSurahNum = null;
      restStartAyah = null;
      currentPage = clampedPage;
      currentPageTafsir = [];

      pageNavBar.style.display = "flex";
      restSurahActions.classList.remove("show");
      renderSurahList(surahFilterInput.value);
      pageNumTop.textContent = `صفحة ${toAr(currentPage)} من ${toAr(TOTAL_MUSHAF_PAGES)}`;
      pageCounter.textContent = `صفحة ${toAr(currentPage)} / ${toAr(TOTAL_MUSHAF_PAGES)}`;
      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= TOTAL_MUSHAF_PAGES;

      if (shouldScrollTop) {
        scrollToTopNow();
      }

      fetchTafsirAsync(clampedPage);

      try {
        const res = await fetch(`${API_BASE}/page/${clampedPage}/quran-uthmani`);
        const json = await res.json();

        if (viewMode === "pages" && currentPage === clampedPage && json.code === 200 && json.data && Array.isArray(json.data.ayahs) && json.data.ayahs.length) {
          const mappedAyahs = json.data.ayahs.map((a) => ({
            surahNumber: a.surah.number,
            surahName: a.surah.name,
            numberInSurah: a.numberInSurah,
            text: a.text
          }));
          renderPageContent(mappedAyahs, currentPageTafsir, targetKey);
