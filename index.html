<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI - مباريات حية</title>
  <style>
    :root{
      --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
      --txt:#0f172a; --muted:#64748b; --acc:#f59e0b; --acc-dark:#78350f;
      --grn:#16a34a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:#ffffff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
    .brand{font-weight:900;font-size:18px;color:#0f172a}
    .brand span{background:var(--acc);color:#fff;padding:2px 7px;border-radius:6px;margin-left:4px}
    .sync{font-size:11px;background:#fef3c7;color:var(--acc-dark);padding:4px 9px;border-radius:99px;font-weight:800}

    .wrap{max-width:780px;margin:auto;padding:10px}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;background:#fff;padding:10px 12px;border-radius:10px;border:1px solid var(--line);flex-wrap:wrap}
    .title-lbl{font-size:13px;font-weight:900}
    .btn{background:#0f172a;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer}

    .leagues{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
    .lg-chip{white-space:nowrap;background:#fff;color:var(--txt);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer}
    .lg-chip.active{background:var(--acc);color:#fff;border-color:var(--acc)}

    .msg{background:#fffbeb;border:1px solid #fde68a;color:var(--acc-dark);padding:9px 11px;border-radius:8px;font-size:12px;margin-bottom:10px;display:none}

    .box{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .box-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}
    .row{padding:11px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:84px 1fr auto 1fr 84px;align-items:center;gap:6px}
    .row:last-child{border-bottom:none}
    .st{font-size:10px;font-weight:800;color:var(--muted);line-height:1.35}
    .st.live{color:var(--grn)}
    .tm{font-size:12px;font-weight:800}
    .tm.home{text-align:right}
    .tm.away{text-align:left}
    .sc{background:#f8fafc;border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:900;min-width:56px;text-align:center}
    .watch-btn{background:var(--grn);color:#fff;text-decoration:none;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:800;display:inline-block;text-align:center}
    .empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}

    @media(max-width:600px){
      .row{grid-template-columns:72px 1fr auto 1fr 78px;gap:4px;padding:9px 8px}
      .tm{font-size:11px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="sync" id="syncBadge">مباشر • كل 90 ث</div>
  </header>

  <div class="wrap">
    <div class="bar">
      <div class="title-lbl" id="liveTitle">المباريات الحية</div>
      <button type="button" class="btn" onclick="loadPaidLiveMatches()">تحديث الآن</button>
    </div>

    <div class="leagues" id="leaguesBar"></div>
    <div class="msg" id="msgBox"></div>

    <div class="box">
      <div class="box-h">
        <span id="currentLeagueName">الدوري الإسباني</span>
        <span id="todayIso" style="font-size:11px;color:#64748b"></span>
      </div>
      <div id="matchesList"></div>
    </div>
  </div>

  <script>
    // ضع هنا رابط نقطة النهاية (Endpoint) الخاصة بمصدرك المدفوع
    var PAID_API_URL = '';
    // اختياري: اسم وقيمة هيدر المفتاح إذا لم يكن الرابط وسيطاً يضيف المفتاح تلقائياً
    var PAID_API_HEADER_NAME = '';
    var PAID_API_HEADER_VALUE = '';

    var AUTO_SYNC_MS = 90000;
    var currentLeague = 'pd';
    var matchesByLeague = {};

    var LEAGUES = [
      { code: 'pd', name: 'الدوري الإسباني' },
      { code: 'pl', name: 'الدوري الإنجليزي' },
      { code: 'bl1', name: 'الدوري الألماني' },
      { code: 'sa', name: 'الدوري الإيطالي' },
      { code: 'cl', name: 'دوري أبطال أوروبا' },
      { code: 'spl', name: 'الدوري السعودي' },
      { code: 'egy', name: 'الدوري المصري' }
    ];

    function getTodayIso() {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function getLeague(code) {
      for (var i = 0; i < LEAGUES.length; i++) {
        if (LEAGUES[i].code === code) return LEAGUES[i];
      }
      return LEAGUES[0];
    }

    function buildWatchUrl(home, away, rawUrl) {
      if (rawUrl) {
        var u = String(rawUrl).trim();
        if (u.indexOf('http://') === 0 || u.indexOf('https://') === 0) return u;
        return 'https://' + u;
      }
      return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(home + ' vs ' + away + ' بث مباشر');
    }

    function renderLeagues() {
      var html = '';
      for (var i = 0; i < LEAGUES.length; i++) {
        var l = LEAGUES[i];
        var cls = 'lg-chip' + (currentLeague === l.code ? ' active' : '');
        html += '<button type="button" class="' + cls + '" onclick="selectLeague(\'' + l.code + '\')">' + l.name + '</button>';
      }
      document.getElementById('leaguesBar').innerHTML = html;
    }

    function selectLeague(code) {
      currentLeague = code;
      renderLeagues();
      renderList();
      loadPaidLiveMatches();
    }

    function normalizePaidMatches(data, leagueCode) {
      var rawArr = Array.isArray(data)
        ? data
        : (data && Array.isArray(data.matches) ? data.matches : (data && Array.isArray(data.response) ? data.response : []));

      var list = [];
      for (var i = 0; i < rawArr.length; i++) {
        var item = rawArr[i];
        var itemLeague = String(item.leagueCode || item.league || '').toLowerCase();
        if (leagueCode && itemLeague && itemLeague !== leagueCode.toLowerCase()) continue;

        var home = item.home || (item.teams && item.teams.home && item.teams.home.name) || 'فريق 1';
        var away = item.away || (item.teams && item.teams.away && item.teams.away.name) || 'فريق 2';
        var score = item.score || (
          (item.goals && item.goals.home !== undefined && item.goals.away !== undefined)
            ? (item.goals.home + ' - ' + item.goals.away)
            : 'vs'
        );
        var status = item.status || (item.fixture && item.fixture.status && item.fixture.status.short) || 'مباشر';
        var isLive = Boolean(item.isLive || status === 'مباشر' || status === 'LIVE' || status === '1H' || status === '2H' || status === 'HT');
        var watch = buildWatchUrl(home, away, item.watchUrl || item.streamUrl || item.url || '');

        list.push({
          home: String(home),
          away: String(away),
          score: String(score),
          status: String(status),
          isLive: isLive,
          watchUrl: watch
        });
      }
      return list;
    }

    function loadPaidLiveMatches() {
      var lg = getLeague(currentLeague);
      var badge = document.getElementById('syncBadge');
      var msg = document.getElementById('msgBox');

      if (!PAID_API_URL) {
        badge.innerHTML = 'بانتظار الربط • 90 ث';
        msg.style.display = 'block';
        msg.innerHTML = 'أدخل رابط المصدر المدفوع في المتغير <b>PAID_API_URL</b> داخل الكود ليتم جلب المباريات الحية وتحديثها تلقائياً كل 90 ثانية.';
        renderList();
        return;
      }

      badge.innerHTML = 'جاري التحديث...';
      var sep = PAID_API_URL.indexOf('?') === -1 ? '?' : '&';
      var reqUrl = PAID_API_URL + sep + 'league=' + encodeURIComponent(lg.code) + '&date=' + encodeURIComponent(getTodayIso());

      var xhr = new XMLHttpRequest();
      xhr.open('GET', reqUrl, true);
      xhr.timeout = 9000;
      if (PAID_API_HEADER_NAME && PAID_API_HEADER_VALUE) {
        xhr.setRequestHeader(PAID_API_HEADER_NAME, PAID_API_HEADER_VALUE);
      }
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
          try {
            var parsed = JSON.parse(xhr.responseText);
            matchesByLeague[lg.code] = normalizePaidMatches(parsed, lg.code);
            badge.innerHTML = 'مباشر • كل 90 ث';
            msg.style.display = 'none';
          } catch (e) {
            badge.innerHTML = 'خطأ بيانات';
            msg.style.display = 'block';
            msg.innerHTML = 'تعذر قراءة بيانات المصدر المدفوع بصيغة JSON.';
          }
        } else {
          badge.innerHTML = 'غير متاح';
          msg.style.display = 'block';
          msg.innerHTML = 'تعذر الوصول للمصدر المدفوع (رمز الحالة ' + xhr.status + ').';
        }
        renderList();
      };
      xhr.ontimeout = function () {
        badge.innerHTML = 'انتهت المهلة';
        msg.style.display = 'block';
        msg.innerHTML = 'تأخر رد المصدر المدفوع، سيتم إعادة المحاولة تلقائياً كل 90 ثانية.';
        renderList();
      };
      xhr.onerror = function () {
        badge.innerHTML = 'خطأ اتصال';
        msg.style.display = 'block';
        msg.innerHTML = 'تعذر الاتصال بالمصدر المدفوع من الجهاز الحالي.';
        renderList();
      };
      xhr.send();
    }

    function renderList() {
      var today = getTodayIso();
      var lg = getLeague(currentLeague);
      document.getElementById('todayIso').innerHTML = today;
      document.getElementById('currentLeagueName').innerHTML = lg.name;
      document.getElementById('liveTitle').innerHTML = 'المباريات الحية - ' + lg.name;

      var list = matchesByLeague[lg.code] || [];
      if (!list.length) {
        document.getElementById('matchesList').innerHTML = '<div class="empty">لا توجد مباريات حية معروضة لبطولة ' + lg.name + ' حالياً.</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < list.length; i++) {
        var m = list[i];
        html += '<div class="row">' +
          '<div class="st ' + (m.isLive ? 'live' : '') + '">' + m.status + '</div>' +
          '<div class="tm home">' + m.home + '</div>' +
          '<div class="sc">' + m.score + '</div>' +
          '<div class="tm away">' + m.away + '</div>' +
          '<div style="text-align:left"><a class="watch-btn" href="' + m.watchUrl + '" target="_blank" rel="noopener noreferrer">مشاهدة</a></div>' +
        '</div>';
      }
      document.getElementById('matchesList').innerHTML = html;
    }

    renderLeagues();
    renderList();
    loadPaidLiveMatches();
    setInterval(loadPaidLiveMatches, AUTO_SYNC_MS);
  </script>
</body>
</html>
