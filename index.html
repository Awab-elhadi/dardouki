<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI - المباريات والترتيب والتشكيلة</title>
  <style>
    :root{
      --bg:#0b0f19; --card:#131a2a; --card2:#1a243b; --line:#243049;
      --txt:#f8fafc; --muted:#94a3b8; --acc:#10b981; --gold:#f59e0b; --err:#f87171;
      --pitch1:#14532d; --pitch2:#166534;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
    .brand{font-weight:900;font-size:18px}
    .brand span{color:var(--acc)}
    .sync{font-size:11px;background:rgba(16,185,129,.15);color:var(--acc);padding:4px 9px;border-radius:99px;font-weight:700}
    .wrap{max-width:780px;margin:auto;padding:10px}
    .main-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
    .m-tab{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:10px 6px;border-radius:10px;font-weight:800;font-size:13px}
    .m-tab.active{background:var(--acc);color:#06281e;border-color:var(--acc)}
    .leagues{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
    .lg-chip{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}
    .lg-chip.active{background:var(--card2);color:var(--txt);border-color:var(--acc)}
    .search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);margin-bottom:8px}
    .notice{font-size:12px;color:var(--gold);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:9px 11px;border-radius:10px;margin-bottom:10px;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
    .m-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px;gap:8px}
    .m-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
    .team-name{font-weight:800;font-size:14px}
    .score-box{background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-weight:900;font-size:14px;min-width:74px;color:#fff}
    .meta-row{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
    .m-actions{margin-top:10px;display:flex;justify-content:center}
    .details-btn{background:var(--card2);color:var(--txt);border:1px solid var(--acc);padding:7px 14px;border-radius:9px;font-size:12px;font-weight:800}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-size:11px}
    td.t-team{text-align:right;font-weight:700}

    /* نافذة التفاصيل ومخطط الملعب */
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;padding:10px;overflow-y:auto}
    .modal-box{max-width:740px;margin:10px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
    .modal-title{font-weight:900;font-size:15px}
    .close-btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800}
    .team-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .sw-btn{background:var(--bg);color:var(--muted);border:1px solid var(--line);padding:8px;border-radius:9px;font-weight:800;font-size:12px}
    .sw-btn.active{background:var(--acc);color:#06281e;border-color:var(--acc)}

    .pitch{
      position:relative;
      background:repeating-linear-gradient(
        to bottom,
        var(--pitch1) 0%,
        var(--pitch1) 16.6%,
        var(--pitch2) 16.6%,
        var(--pitch2) 33.2%
      );
      border:2px solid rgba(255,255,255,.45);
      border-radius:12px;
      padding:14px 8px;
      margin-bottom:12px;
      min-height:360px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .pitch-midline{
      position:absolute;
      top:50%;
      left:8px;
      right:8px;
      height:1px;
      background:rgba(255,255,255,.28);
      pointer-events:none;
    }
    .pitch-circle{
      position:absolute;
      top:50%;
      left:50%;
      width:74px;
      height:74px;
      transform:translate(-50%,-50%);
      border:1px solid rgba(255,255,255,.28);
      border-radius:50%;
      pointer-events:none;
    }
    .pitch-row{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:space-around;
      align-items:center;
      flex-wrap:wrap;
      gap:6px;
      margin:4px 0;
    }
    .player-node{
      display:flex;
      flex-direction:column;
      align-items:center;
      max-width:86px;
      text-align:center;
    }
    .jersey{
      width:30px;
      height:30px;
      border-radius:50%;
      background:#0f172a;
      border:2px solid #ffffff;
      color:#ffffff;
      font-size:11px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:3px;
    }
    .p-name{
      background:rgba(11,15,25,.82);
      color:#fff;
      font-size:10px;
      font-weight:700;
      padding:2px 6px;
      border-radius:6px;
      line-height:1.3;
      word-break:break-word;
    }
    .d-section{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
    .d-sec-title{font-size:12px;font-weight:900;color:var(--acc);margin-bottom:8px}
    .d-list{margin:0;padding-right:16px;font-size:12px;color:var(--txt);line-height:1.7}
    .d-inj{color:var(--err)}
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="sync" id="syncStatus">جاهز</div>
  </header>

  <div class="wrap">
    <div class="main-tabs">
      <button type="button" class="m-tab active" id="btnMatches" onclick="switchTab('matches')">المباريات</button>
      <button type="button" class="m-tab" id="btnStandings" onclick="switchTab('standings')">الترتيب</button>
      <button type="button" class="m-tab" id="btnRefresh" onclick="syncCurrentLeague()">تحديث الآن</button>
    </div>

    <div class="leagues" id="leaguesBar"></div>
    <input class="search" id="q" placeholder="ابحث عن فريق أو بطولة..." onkeyup="renderAll()" />
    <div class="notice" id="noticeBox">يتم جلب البيانات مباشرة من المصدر الرياضي دون أي بيانات وهمية أو قديمة.</div>
    <div id="view"></div>
  </div>

  <div class="modal-backdrop" id="detailsModal" onclick="backdropClose(event)">
    <div class="modal-box" id="detailsContent"></div>
  </div>

  <script>
    var currentTab = 'matches';
    var currentLeague = 'bl1';
    var activeModalMatch = null;
    var activeTeamSide = 'home';

    var LEAGUES = [
      { code: 'bl1', name: 'الدوري الألماني', openligaShortcut: 'bl1', openligaSeason: '2026', tsdbId: '4331', tsdbSeason: '2026-2027' },
      { code: 'pl', name: 'الدوري الإنجليزي', openligaShortcut: '', openligaSeason: '', tsdbId: '4328', tsdbSeason: '2026-2027' },
      { code: 'pd', name: 'الدوري الإسباني', openligaShortcut: '', openligaSeason: '', tsdbId: '4335', tsdbSeason: '2026-2027' },
      { code: 'cl', name: 'دوري الأبطال', openligaShortcut: '', openligaSeason: '', tsdbId: '4480', tsdbSeason: '2026-2027' },
      { code: 'sa', name: 'الدوري الإيطالي', openligaShortcut: '', openligaSeason: '', tsdbId: '4332', tsdbSeason: '2026-2027' },
      { code: 'spl', name: 'الدوري السعودي', openligaShortcut: '', openligaSeason: '', tsdbId: '4668', tsdbSeason: '2026-2027' },
      { code: 'egy', name: 'الدوري المصري', openligaShortcut: '', openligaSeason: '', tsdbId: '4498', tsdbSeason: '2026-2027' }
    ];

    var matchesByLeague = {};
    var standingsByLeague = {};

    function getLeagueObj(code) {
      for (var i = 0; i < LEAGUES.length; i++) {
        if (LEAGUES[i].code === code) return LEAGUES[i];
      }
      return LEAGUES[0];
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('btnMatches').className = 'm-tab' + (tab === 'matches' ? ' active' : '');
      document.getElementById('btnStandings').className = 'm-tab' + (tab === 'standings' ? ' active' : '');
      renderAll();
    }

    function pickLeague(code) {
      currentLeague = code;
      renderLeagues();
      renderAll();
      syncCurrentLeague();
    }

    function renderLeagues() {
      var html = '';
      for (var i = 0; i < LEAGUES.length; i++) {
        var l = LEAGUES[i];
        var cls = 'lg-chip' + (currentLeague === l.code ? ' active' : '');
        html += '<button type="button" class="' + cls + '" onclick="pickLeague(\'' + l.code + '\')">' + l.name + '</button>';
      }
      document.getElementById('leaguesBar').innerHTML = html;
    }

    function xhrGet(url, onSuccess, onError) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = 8000;
        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              onSuccess(JSON.parse(xhr.responseText));
            } catch (e) {
              if (onError) onError('تعذر قراءة استجابة المصدر');
            }
          } else {
            if (onError) onError('HTTP ' + xhr.status);
          }
        };
        xhr.ontimeout = function () {
          if (onError) onError('انتهت مهلة الاتصال');
        };
        xhr.onerror = function () {
          if (onError) onError('تعذر الاتصال بالمصدر');
        };
        xhr.send();
      } catch (e) {
        if (onError) onError('خطأ في طلب الشبكة');
      }
    }

    function parseOpenLigaMatches(rows, lgObj) {
      if (!rows || !rows.length) return [];
      var out = [];
      for (var i = 0; i < rows.length; i++) {
        var m = rows[i];
        var home = (m.team1 && (m.team1.teamName || m.team1.shortName)) || 'فريق 1';
        var away = (m.team2 && (m.team2.teamName || m.team2.shortName)) || 'فريق 2';
        var results = m.matchResults || [];
        var score = 'vs';
        if (results.length > 0) {
          var lastR = results[results.length - 1];
          if (lastR.pointsTeam1 !== undefined && lastR.pointsTeam2 !== undefined) {
            score = lastR.pointsTeam1 + ' - ' + lastR.pointsTeam2;
          }
        }
        var status = m.matchIsFinished ? 'انتهت' : 'مجدولة';
        var dt = m.matchDateTime || '';
        out.push({
          id: 'ol_' + (m.matchID || i),
          league: lgObj.name,
          home: home,
          away: away,
          score: score,
          status: status,
          dateTime: dt.replace('T', ' ').slice(0, 16),
          homeLineup: [],
          awayLineup: [],
          homeBench: [],
          awayBench: [],
          homeInjuries: [],
          awayInjuries: []
        });
      }
      return out;
    }

    function parseOpenLigaStandings(rows) {
      if (!rows || !rows.length) return [];
      var out = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        out.push({
          pos: i + 1,
          team: r.teamName || r.shortName || 'فريق',
          p: r.matches !== undefined ? r.matches : '-',
          w: r.won !== undefined ? r.won : '-',
          d: r.draw !== undefined ? r.draw : '-',
          l: r.lost !== undefined ? r.lost : '-',
          pts: r.points !== undefined ? r.points : '-'
        });
      }
      return out;
    }

    function syncCurrentLeague() {
      var lg = getLeagueObj(currentLeague);
      var st = document.getElementById('syncStatus');
      var notice = document.getElementById('noticeBox');
      st.innerHTML = 'جاري الجلب...';

      if (lg.openligaShortcut) {
        var matchesUrl = 'https://api.openligadb.de/getmatchdata/' + lg.openligaShortcut + '/' + lg.openligaSeason;
        var tableUrl = 'https://api.openligadb.de/getbltable/' + lg.openligaShortcut + '/' + lg.openligaSeason;
        var doneCount = 0;
        var errList = [];

        function finishStep() {
          doneCount++;
          if (doneCount < 2) return;
          var hasMatches = (matchesByLeague[lg.code] && matchesByLeague[lg.code].length > 0);
          var hasTable = (standingsByLeague[lg.code] && standingsByLeague[lg.code].length > 0);
          if (hasMatches || hasTable) {
            st.innerHTML = 'متصل';
            notice.style.display = 'none';
          } else {
            st.innerHTML = 'غير متاح';
            notice.style.display = 'block';
            notice.innerHTML = 'لم يرد أي بيانات حية من المصدر لهذه البطولة حالياً (' + errList.join(' | ') + ').';
          }
          renderAll();
        }

        xhrGet(matchesUrl, function (data) {
          matchesByLeague[lg.code] = parseOpenLigaMatches(data, lg);
          finishStep();
        }, function (err) {
          errList.push('المباريات: ' + err);
          finishStep();
        });

        xhrGet(tableUrl, function (data) {
          standingsByLeague[lg.code] = parseOpenLigaStandings(data);
          finishStep();
        }, function (err) {
          errList.push('الترتيب: ' + err);
          finishStep();
        });
      } else {
        st.innerHTML = 'بانتظار مصدر';
        notice.style.display = 'block';
        notice.innerHTML = 'بطولة "' + lg.name + '" لا تملك مزود بيانات حياً مفعّلاً ومضموناً بدون حظر أو بيانات وهمية في هذا الإطار حالياً. تم حذف البيانات الوهمية بالكامل.';
        renderAll();
      }
    }

    function buildPitchHtml(players, teamLabel) {
      if (!players || !players.length) {
        return '<div class="d-section"><div class="d-sec-title">مخطط الملعب — ' + teamLabel + '</div>' +
          '<div style="font-size:12px;color:#94a3b8">لا تتوفر تشكيلة رسمية معلنة لهذه المباراة من المصدر حالياً.</div></div>';
      }

      var gk = players.slice(0, 1);
      var def = players.slice(1, 5);
      var mid = players.slice(5, 8);
      var fwd = players.slice(8, 11);

      function renderRow(list, startNum) {
        var html = '<div class="pitch-row">';
        for (var i = 0; i < list.length; i++) {
          var num = startNum + i;
          html += '<div class="player-node">' +
            '<div class="jersey">' + num + '</div>' +
            '<div class="p-name">' + list[i] + '</div>' +
          '</div>';
        }
        html += '</div>';
        return html;
      }

      return '<div class="pitch">' +
        '<div class="pitch-midline"></div>' +
        '<div class="pitch-circle"></div>' +
        renderRow(fwd, 9) +
        renderRow(mid, 6) +
        renderRow(def, 2) +
        renderRow(gk, 1) +
      '</div>';
    }

    function renderListItems(items, cls) {
      if (!items || !items.length) {
        return '<li style="color:#94a3b8">غير متوفر من المصدر حالياً</li>';
      }
      var html = '';
      for (var i = 0; i < items.length; i++) {
        html += '<li' + (cls ? ' class="' + cls + '"' : '') + '>' + items[i] + '</li>';
      }
      return html;
    }

    function openMatchDetails(matchId) {
      var list = matchesByLeague[currentLeague] || [];
      var found = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === matchId) {
          found = list[i];
          break;
        }
      }
      if (!found) return;
      activeModalMatch = found;
      activeTeamSide = 'home';
      renderModalContent();
      document.getElementById('detailsModal').style.display = 'block';
    }

    function switchModalTeam(side) {
      activeTeamSide = side;
      renderModalContent();
    }

    function renderModalContent() {
      var m = activeModalMatch;
      if (!m) return;
      var isHome = activeTeamSide === 'home';
      var activeName = isHome ? m.home : m.away;
      var activeLineup = isHome ? m.homeLineup : m.awayLineup;
      var activeBench = isHome ? m.homeBench : m.awayBench;
      var activeInj = isHome ? m.homeInjuries : m.awayInjuries;

      var html =
        '<div class="modal-head">' +
          '<div class="modal-title">' + m.home + ' (' + m.score + ') ' + m.away + '</div>' +
          '<button type="button" class="close-btn" onclick="closeDetails()">إغلاق ✕</button>' +
        '</div>' +

        '<div class="d-section">' +
          '<div class="d-sec-title">بيانات المباراة</div>' +
          '<div style="font-size:12px;line-height:1.7">' +
            '<div><b>البطولة:</b> ' + m.league + ' — <b>الحالة:</b> ' + m.status + '</div>' +
            (m.dateTime ? '<div><b>الموعد:</b> ' + m.dateTime + '</div>' : '') +
          '</div>' +
        '</div>' +

        '<div class="team-switch">' +
          '<button type="button" class="sw-btn ' + (isHome ? 'active' : '') + '" onclick="switchModalTeam(\'home\')">ملعب: ' + m.home + '</button>' +
          '<button type="button" class="sw-btn ' + (!isHome ? 'active' : '') + '" onclick="switchModalTeam(\'away\')">ملعب: ' + m.away + '</button>' +
        '</div>' +

        buildPitchHtml(activeLineup, activeName) +

        '<div class="d-section">' +
          '<div class="d-sec-title">الاحتياط والدكة — ' + activeName + '</div>' +
          '<ul class="d-list">' + renderListItems(activeBench, '') + '</ul>' +
        '</div>' +

        '<div class="d-section">' +
          '<div class="d-sec-title">الإصابات والغيابات — ' + activeName + '</div>' +
          '<ul class="d-list">' + renderListItems(activeInj, 'd-inj') + '</ul>' +
        '</div>';

      document.getElementById('detailsContent').innerHTML = html;
    }

    function closeDetails() {
      document.getElementById('detailsModal').style.display = 'none';
    }

    function backdropClose(e) {
      if (e && e.target && e.target.id === 'detailsModal') {
        closeDetails();
      }
    }

    function renderAll() {
      var qEl = document.getElementById('q');
      var q = qEl && qEl.value ? qEl.value.trim().toLowerCase() : '';
      var view = document.getElementById('view');

      if (currentTab === 'matches') {
        var list = matchesByLeague[currentLeague] || [];
        var out = '';
        for (var i = 0; i < list.length; i++) {
          var m = list[i];
          var hay = (m.league + ' ' + m.home + ' ' + m.away + ' ' + m.status + ' ' + (m.dateTime || '')).toLowerCase();
          if (!q || hay.indexOf(q) !== -1) {
            out += '<div class="card">' +
              '<div class="m-top"><span>' + m.league + '</span><span>' + m.status + '</span></div>' +
              '<div class="m-grid">' +
                '<div class="team-name">' + m.home + '</div>' +
                '<div class="score-box">' + m.score + '</div>' +
                '<div class="team-name">' + m.away + '</div>' +
              '</div>' +
              (m.dateTime ? '<div class="meta-row">' + m.dateTime + '</div>' : '') +
              '<div class="m-actions">' +
                '<button type="button" class="details-btn" onclick="openMatchDetails(\'' + m.id + '\')">تفاصيل المباراة</button>' +
              '</div>' +
            '</div>';
          }
        }
        view.innerHTML = out || '<p style="text-align:center;color:#94a3b8">لا توجد مباريات متاحة حالياً لهذه البطولة</p>';
      } else {
        var rows = standingsByLeague[currentLeague] || [];
        var trs = '';
        for (var j = 0; j < rows.length; j++) {
          var s = rows[j];
          var tHay = (String(s.team) + ' ' + String(s.pos)).toLowerCase();
          if (!q || tHay.indexOf(q) !== -1) {
            trs += '<tr>' +
              '<td><b>' + s.pos + '</b></td>' +
              '<td class="t-team">' + s.team + '</td>' +
              '<td>' + s.p + '</td><td>' + s.w + '</td><td>' + s.d + '</td><td>' + s.l + '</td>' +
              '<td><b style="color:#10b981">' + s.pts + '</b></td>' +
            '</tr>';
          }
        }
        view.innerHTML = '<div class="card" style="padding:6px"><table>' +
          '<thead><tr><th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>نقاط</th></tr></thead>' +
          '<tbody>' + (trs || '<tr><td colspan="7" style="color:#94a3b8">لا يوجد جدول ترتيب متاح حالياً</td></tr>') + '</tbody></table></div>';
      }
    }

    renderLeagues();
    renderAll();
    syncCurrentLeague();
  </script>
</body>
</html>
