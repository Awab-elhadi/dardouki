<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI - الدوري الإسباني</title>
  <style>
    :root{
      --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
      --txt:#0f172a; --muted:#64748b; --acc:#f59e0b; --acc-dark:#78350f;
      --grn:#16a34a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:#ffffff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
    .brand{font-weight:900;font-size:18px;color:#0f172a}
    .brand span{background:var(--acc);color:#fff;padding:2px 7px;border-radius:6px;margin-left:4px}
    .sync{font-size:11px;background:#fef3c7;color:var(--acc-dark);padding:4px 9px;border-radius:99px;font-weight:800}

    .wrap{max-width:780px;margin:auto;padding:10px}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;background:#fff;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
    .title-lbl{font-size:13px;font-weight:900}
    .btn{background:#0f172a;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer}

    .msg{background:#fffbeb;border:1px solid #fde68a;color:var(--acc-dark);padding:9px 11px;border-radius:8px;font-size:12px;margin-bottom:10px;display:none}

    .box{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .box-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}
    .row{padding:11px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:96px 1fr auto 1fr 84px;align-items:center;gap:6px}
    .row:last-child{border-bottom:none}
    .st{font-size:10px;font-weight:800;color:var(--muted);line-height:1.35}
    .st.live{color:var(--grn)}
    .tm{font-size:12px;font-weight:800}
    .tm.home{text-align:right}
    .tm.away{text-align:left}
    .sc{background:#f8fafc;border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:900;min-width:56px;text-align:center}
    .watch-btn{background:var(--grn);color:#fff;text-decoration:none;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:800;display:inline-block;text-align:center}
    .empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}

    @media(max-width:600px){
      .row{grid-template-columns:78px 1fr auto 1fr 76px;gap:4px;padding:9px 8px}
      .tm{font-size:11px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="sync" id="syncBadge">تحديث كل 90 ث</div>
  </header>

  <div class="wrap">
    <div class="bar">
      <div class="title-lbl">الدوري الإسباني</div>
      <button type="button" class="btn" onclick="loadLaliga()">تحديث الآن</button>
    </div>

    <div class="msg" id="msgBox"></div>

    <div class="box">
      <div class="box-h">
        <span>مباريات الدوري الإسباني</span>
        <span id="todayIso" style="font-size:11px;color:#64748b"></span>
      </div>
      <div id="matchesList"></div>
    </div>
  </div>

  <script>
    var NINJAS_API_KEY = '8GfktW80IcFGeHARH8YjwY20AG6WvqbkyManYSTQ';
    var AUTO_SYNC_MS = 90000;
    var REQUEST_TIMEOUT_MS = 12000;
    var laligaMatches = [];

    function getTodayIso() {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function buildWatchUrl(home, away) {
      return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(home + ' vs ' + away);
    }

    function formatTimeFromIso(isoStr) {
      if (!isoStr) return '';
      var dt = new Date(isoStr);
      if (isNaN(dt.getTime())) return String(isoStr).slice(11, 16);
      var h = String(dt.getHours()).padStart(2, '0');
      var min = String(dt.getMinutes()).padStart(2, '0');
      return h + ':' + min;
    }

    function parseNinjasMatches(data) {
      var arr = Array.isArray(data) ? data : (data && Array.isArray(data.matches) ? data.matches : []);
      var list = [];
      for (var i = 0; i < arr.length; i++) {
        var item = arr[i] || {};
        var home = (item.home_team && item.home_team.name) || item.home_team || item.home || 'فريق 1';
        var away = (item.away_team && item.away_team.name) || item.away_team || item.away || 'فريق 2';
        var venueName = (item.venue && item.venue.name) ? item.venue.name : '';
        var venueCity = (item.venue && item.venue.city) ? item.venue.city : '';
        var venueSub = venueName ? (venueName + (venueCity ? (' • ' + venueCity) : '')) : (item.date || '');

        var hScore = item.home_score;
        var aScore = item.away_score;
        var hasScore = hScore !== undefined && hScore !== null && hScore !== '' && aScore !== undefined && aScore !== null && aScore !== '';
        var startClock = formatTimeFromIso(item.start_time || '');
        var rawStatus = item.status ? String(item.status) : '';
        var stLower = rawStatus.toLowerCase();
        var isLive = stLower.indexOf('live') !== -1 || stLower.indexOf('in_progress') !== -1;

        var statusLabel = 'مجدولة';
        if (isLive) statusLabel = 'مباشر';
        else if (rawStatus === 'scheduled') statusLabel = startClock ? ('مجدولة • ' + startClock) : 'مجدولة';
        else if (rawStatus) statusLabel = rawStatus;

        list.push({
          home: String(home),
          away: String(away),
          sub: venueSub,
          score: hasScore ? (hScore + ' - ' + aScore) : (startClock || 'vs'),
          status: statusLabel,
          isLive: isLive,
          watchUrl: buildWatchUrl(String(home), String(away))
        });
      }
      return list;
    }

    function fetchJsonWithTimeout(url, headers, timeoutMs) {
      return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = timeoutMs;
        if (headers) {
          for (var k in headers) {
            if (Object.prototype.hasOwnProperty.call(headers, k)) {
              xhr.setRequestHeader(k, headers[k]);
            }
          }
        }
        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
            try {
              var obj = JSON.parse(xhr.responseText);
              if (obj && typeof obj.contents === 'string') {
                obj = JSON.parse(obj.contents);
              }
              resolve(obj);
            } catch (e) {
              reject(new Error('PARSE_ERROR'));
            }
          } else {
            reject(new Error('HTTP_' + xhr.status));
          }
        };
        xhr.ontimeout = function () {
          reject(new Error('TIMEOUT'));
        };
        xhr.onerror = function () {
          reject(new Error('NETWORK_ERROR'));
        };
        xhr.send();
      });
    }

    function fetchLaligaData() {
      var targetUrl = 'https://api.api-ninjas.com/v1/soccermatches?league=laliga';
      var headers = { 'X-Api-Key': NINJAS_API_KEY };
      var candidates = [
        { url: targetUrl, hdr: headers },
        { url: 'https://corsproxy.io/?' + encodeURIComponent(targetUrl), hdr: headers },
        { url: 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl), hdr: null }
      ];

      var idx = 0;
      function nextAttempt() {
        if (idx >= candidates.length) {
          return Promise.reject(new Error('NETWORK_ERROR'));
        }
        var c = candidates[idx++];
        return fetchJsonWithTimeout(c.url, c.hdr, REQUEST_TIMEOUT_MS).catch(function () {
          return nextAttempt();
        });
      }

      return nextAttempt();
    }

    function loadLaliga() {
      var badge = document.getElementById('syncBadge');
      var msg = document.getElementById('msgBox');

      badge.innerHTML = 'جاري التحديث...';
      fetchLaligaData().then(function (parsed) {
        laligaMatches = parseNinjasMatches(parsed);
        badge.innerHTML = 'محدّث • كل 90 ث';
        msg.style.display = laligaMatches.length ? 'none' : 'block';
        if (!laligaMatches.length) {
          msg.innerHTML = 'لم يرجع API Ninjas مباريات للدوري الإسباني حالياً.';
        }
        renderList();
      }).catch(function (err) {
        var reason = err && err.message ? err.message : 'NETWORK_ERROR';
        badge.innerHTML = reason === 'TIMEOUT' ? 'انتهت المهلة' : 'غير متاح';
        msg.style.display = 'block';
        msg.innerHTML = 'تعذر جلب مباريات الدوري الإسباني (' + reason + ')، سيعاد المحاولة كل 90 ثانية.';
        renderList();
      });
    }

    function renderList() {
      document.getElementById('todayIso').innerHTML = getTodayIso();
      if (!laligaMatches.length) {
        document.getElementById('matchesList').innerHTML = '<div class="empty">لا توجد مباريات معروضة حالياً لبطولة الدوري الإسباني.</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < laligaMatches.length; i++) {
        var m = laligaMatches[i];
        html += '<div class="row">' +
          '<div class="st ' + (m.isLive ? 'live' : '') + '">' + m.status + '<br><span style="color:#94a3b8">' + (m.sub || '') + '</span></div>' +
          '<div class="tm home">' + m.home + '</div>' +
          '<div class="sc">' + m.score + '</div>' +
          '<div class="tm away">' + m.away + '</div>' +
          '<div style="text-align:left"><a class="watch-btn" href="' + m.watchUrl + '" target="_blank" rel="noopener noreferrer">مشاهدة</a></div>' +
        '</div>';
      }
      document.getElementById('matchesList').innerHTML = html;
    }

    renderList();
    loadLaliga();
    setInterval(loadLaliga, AUTO_SYNC_MS);
  </script>
</body>
</html>
