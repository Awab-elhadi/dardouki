<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI - أخبار ونتائج وانتقالات</title>
  <style>
    :root{
      --bg:#0b0f19; --card:#131a2a; --card2:#1a243b; --line:#243049;
      --txt:#f8fafc; --muted:#94a3b8; --acc:#10b981; --live:#ef4444; --gold:#f59e0b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
    .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}
    .brand span{color:var(--acc)}
    .sync{font-size:11px;background:rgba(16,185,129,.15);color:var(--acc);padding:4px 9px;border-radius:99px;font-weight:700}
    .wrap{max-width:760px;margin:auto;padding:10px}
    .main-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
    .m-tab{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:9px 6px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer}
    .m-tab.active{background:var(--acc);color:#06281e;border-color:var(--acc)}
    .leagues{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
    .leagues::-webkit-scrollbar{display:none}
    .lg-chip{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer}
    .lg-chip.active{background:var(--card2);color:var(--txt);border-color:var(--acc)}
    .search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);margin-bottom:10px;font-family:inherit}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
    .m-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px}
    .live-badge{color:var(--live);font-weight:800;display:inline-flex;align-items:center;gap:5px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:blink 1.2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .m-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
    .team-name{font-weight:800;font-size:14px}
    .score-box{background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-weight:900;font-size:15px;min-width:68px;color:#fff}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-size:11px}
    td.t-team{text-align:right;font-weight:700}
    .note{font-size:12px;color:var(--gold);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);padding:8px 10px;border-radius:10px;margin-bottom:10px;line-height:1.5}
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="sync" id="syncStatus">جاهز</div>
  </header>

  <div class="wrap">
    <div class="main-tabs">
      <button class="m-tab active" id="tabMatches" onclick="setTab('matches', this)">المباريات</button>
      <button class="m-tab" id="tabStandings" onclick="setTab('standings', this)">الترتيب</button>
      <button class="m-tab" onclick="refreshAll()">تحديث الآن</button>
    </div>

    <div class="leagues" id="leaguesBar"></div>
    <input class="search" id="q" placeholder="ابحث عن فريق أو بطولة..." oninput="render()" />
    <div class="note" id="apiNote" style="display:none"></div>
    <div id="view"></div>
  </div>

        { id: 'f4', league: 'الدوري الإسباني', home: 'أتلتيكو مدريد', away: 'إشبيلية', score: 'vs', status: 'مجدولة', live: false }

    const FALLBACK_STANDINGS = {

    };

    const state = {
      tab: 'matches',
      leagueCode: '4328',
      matches: FALLBACK_MATCHES['4328'].slice(),
      standings: FALLBACK_STANDINGS['4328'].slice()
    };

    function setTab(tab, btn) {
      state.tab = tab;
      document.querySelectorAll('.m-tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      render();
    }

    function selectLeague(code) {
      state.leagueCode = code;
      state.matches = (FALLBACK_MATCHES[code] || []).slice();
      state.standings = (FALLBACK_STANDINGS[code] || []).slice();
      renderLeagues();
      render();
      refreshAll();
    }

    function renderLeagues() {
      const bar = document.getElementById('leaguesBar');
      if (!bar) return;
      bar.innerHTML = LEAGUES.map(l =>
        `<button class="lg-chip ${state.leagueCode === l.code ? 'active' : ''}" onclick="selectLeague('${l.code}')">${l.name}</button>`
      ).join('');
    }

    function fetchJson(url) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = 8000;
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              resolve(JSON.parse(xhr.responseText));
            } catch (e) {
              reject(new Error('بيانات غير صالحة'));
            }
          } else {
            reject(new Error('HTTP ' + xhr.status));
          }
        };
        xhr.ontimeout = () => reject(new Error('انتهت المهلة'));
        xhr.onerror = () => reject(new Error('تعذر الاتصال'));
        xhr.send();
      });
    }

    function formatEvent(ev, lgName, isUpcoming) {
      const hScore = ev.intHomeScore;
      const aScore = ev.intAwayScore;
      const hasScore = hScore !== null && aScore !== null && hScore !== undefined && aScore !== undefined && String(hScore) !== '' && String(aScore) !== '';
      const statusStr = String(ev.strStatus || '').toUpperCase();
      const live = ['1H', '2H', 'HT', 'ET', 'P', 'LIVE'].indexOf(status
