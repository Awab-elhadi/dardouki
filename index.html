<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI - دوري أبطال أوروبا والدوري الإسباني</title>
  <style>
    :root{
      --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
      --txt:#0f172a; --muted:#64748b; --acc:#f59e0b; --acc-dark:#78350f;
      --grn:#16a34a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:#ffffff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
    .brand{font-weight:900;font-size:18px;color:#0f172a}
    .brand span{background:var(--acc);color:#fff;padding:2px 7px;border-radius:6px;margin-left:4px}
    .sync{font-size:11px;background:#fef3c7;color:var(--acc-dark);padding:4px 9px;border-radius:99px;font-weight:800}

    .wrap{max-width:780px;margin:auto;padding:10px}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;background:#fff;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
    .title-lbl{font-size:13px;font-weight:900}
    .btn{background:#0f172a;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer}

    .leagues{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .lg-chip{background:#fff;color:var(--txt);border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-size:12px;font-weight:800;cursor:pointer}
    .lg-chip.active{background:var(--acc);color:#fff;border-color:var(--acc)}

    .msg{background:#fffbeb;border:1px solid #fde68a;color:var(--acc-dark);padding:9px 11px;border-radius:8px;font-size:12px;margin-bottom:10px;display:none}

    .box{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .box-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}
    .row{padding:11px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:84px 1fr auto 1fr 84px;align-items:center;gap:6px}
    .row:last-child{border-bottom:none}
    .st{font-size:10px;font-weight:800;color:var(--muted);line-height:1.35}
    .st.live{color:var(--grn)}
    .tm{font-size:12px;font-weight:800}
    .tm.home{text-align:right}
    .tm.away{text-align:left}
    .sc{background:#f8fafc;border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:900;min-width:56px;text-align:center}
    .watch-btn{background:var(--grn);color:#fff;text-decoration:none;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:800;display:inline-block;text-align:center}
    .empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}

    @media(max-width:600px){
      .row{grid-template-columns:72px 1fr auto 1fr 78px;gap:4px;padding:9px 8px}
      .tm{font-size:11px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="sync" id="syncBadge">تحديث كل 90 ث</div>
  </header>

  <div class="wrap">
    <div class="bar">
      <div class="title-lbl" id="currentLeagueName">دوري أبطال أوروبا</div>
      <button type="button" class="btn" onclick="loadMatches()">تحديث الآن</button>
    </div>

    <div class="leagues" id="leaguesBar"></div>
    <div class="msg" id="msgBox"></div>

    <div class="box">
      <div class="box-h">
        <span id="boxTitle">مباريات البطولة</span>
        <span id="todayIso" style="font-size:11px;color:#64748b"></span>
      </div>
      <div id="matchesList"></div>
    </div>
  </div>

  <script>
    var TSDB_BASE = 'https://www.thesportsdb.com/api/v1/json/123';
    var AUTO_SYNC_MS = 90000;
    var currentLeague = 'cl';
    var matchesByLeague = { cl: [], pd: [] };

    var TEAM_AR = {
      'real madrid': 'ريال مدريد',
      'fc barcelona': 'برشلونة',
      'barcelona': 'برشلونة',
      'atletico madrid': 'أتلتيكو مدريد',
      'sevilla': 'إشبيلية',
      'real sociedad': 'ريال سوسيداد',
      'athletic club': 'أتلتيك بيلباو',
      'villarreal': 'فياريال',
      'real betis': 'ريال بيتيس',
      'girona': 'جيرونا',
      'getafe': 'خيتافي',
      'mallorca': 'مايوركا',
      'las palmas': 'لاس بالماس',
      'alaves': 'ديبورتيفو ألافيس',
      'osasuna': 'أوساسونا',
      'rayo vallecano': 'رايو فايكانو',
      'celta vigo': 'سيلتا فيغو',
      'valladolid': 'بلد الوليد',
      'leganes': 'ليغانيس',
      'espanyol': 'إسبانيول',
      'fc bayern münchen': 'بايرن ميونخ',
      'bayern munich': 'بايرن ميونخ',
      'borussia dortmund': 'بوروسيا دورتموند',
      'rb leipzig': 'لايبزيغ',
      'bayer leverkusen': 'باير ليفركوزن',
      'arsenal': 'أرسنال',
      'liverpool': 'ليفربول',
      'manchester city': 'مانشستر سيتي',
      'chelsea': 'تشيلسي',
      'inter': 'إنتر ميلان',
      'inter milan': 'إنتر ميلان',
      'ac milan': 'ميلان',
      'juventus': 'يوفنتوس',
      'paris saint-germain': 'باريس سان جيرمان'
    };

    var LEAGUES = [
      { code: 'cl', name: 'دوري أبطال أوروبا', tsdbId: '4480' },
      { code: 'pd', name: 'الدوري الإسباني', tsdbId: '4335' }
    ];

    function getTodayIso() {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function translateTeam(raw) {
      if (!raw) return 'فريق';
      var clean = String(raw).trim();
      var low = clean.toLowerCase();
      if (TEAM_AR[low]) return TEAM_AR[low];
      var keys = Object.keys(TEAM_AR);
      for (var i = 0; i < keys.length; i++) {
        if (low.indexOf(keys[i]) !== -1) return TEAM_AR[keys[i]];
      }
      return clean;
    }

    function getLeague(code) {
      return code === 'pd' ? LEAGUES[1] : LEAGUES[0];
    }

    function isSoccerEvent(ev) {
      var sport = (ev && ev.strSport) ? String(ev.strSport).toLowerCase() : 'soccer';
      return sport === 'soccer' || sport === 'football';
    }

    function buildWatchUrl(home, away, rawVideo) {
      if (rawVideo) {
        var u = String(rawVideo).trim();
        if (u.indexOf('http://') === 0 || u.indexOf('https://') === 0) return u;
        return 'https://' + u;
      }
      return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(home + ' vs ' + away);
    }

    function renderLeagues() {
      var html = '';
      for (var i = 0; i < LEAGUES.length; i++) {
        var l = LEAGUES[i];
        var cls = 'lg-chip' + (currentLeague === l.code ? ' active' : '');
        html += '<button type="button" class="' + cls + '" onclick="selectLeague(\'' + l.code + '\')">' + l.name + '</button>';
      }
      document.getElementById('leaguesBar').innerHTML = html;
    }

    function selectLeague(code) {
      currentLeague = code;
      renderLeagues();
      renderList();
      loadMatches();
    }

    function fetchJson(url, ok, fail) {
      var targets = [
        url,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url)
      ];
      var idx = 0;

      function next() {
        if (idx >= targets.length) {
          if (fail) fail('تعذر الاتصال');
          return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open('GET', targets[idx++], true);
        xhr.timeout = 8000;
        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
            try {
              var raw = JSON.parse(xhr.responseText);
              var data = (raw && typeof raw.contents === 'string') ? JSON.parse(raw.contents) : raw;
              ok(data);
            } catch (e) { next(); }
          } else { next(); }
        };
        xhr.ontimeout = next;
        xhr.onerror = next;
        xhr.send();
      }
      next();
    }

    function loadMatches() {
      var lg = getLeague(currentLeague);
      var badge = document.getElementById('syncBadge');
      var msg = document.getElementById('msgBox');
      badge.innerHTML = 'جاري التحديث...';

      var nextUrl = TSDB_BASE + '/eventsnextleague.php?id=' + lg.tsdbId;
      var lastUrl = TSDB_BASE + '/eventslast.php?id=' + lg.tsdbId;
      var combined = [];
      var done = 0;

      function mapEvents(arr) {
        for (var i = 0; i < (arr || []).length; i++) {
          var ev = arr[i];
          if (!isSoccerEvent(ev)) continue;
          var hs = ev.intHomeScore;
          var as = ev.intAwayScore;
          var hasScore = hs !== null && as !== null && hs !== undefined && as !== undefined && String(hs) !== '' && String(as) !== '';
          var tPart = ev.strTime ? String(ev.strTime).slice(0, 5) : '';
          var homeName = translateTeam(ev.strHomeTeam);
          var awayName = translateTeam(ev.strAwayTeam);
          combined.push({
            home: homeName,
            away: awayName,
            date: ev.dateEvent || '',
            score: hasScore ? (hs + ' - ' + as) : (tPart || 'vs'),
            status: hasScore ? 'انتهت' : (tPart || 'مجدولة'),
            isLive: false,
            watchUrl: buildWatchUrl(homeName, awayName, ev.strVideo || '')
          });
        }
      }

      function finish() {
        done++;
        if (done < 2) return;
        matchesByLeague[lg.code] = combined;
        badge.innerHTML = combined.length ? 'محدّث • كل 90 ث' : 'غير متاح';
        msg.style.display = combined.length ? 'none' : 'block';
        if (!combined.length) {
          msg.innerHTML = 'لم يرجع المصدر بيانات لبطولة "' + lg.name + '" حالياً.';
        }
        renderList();
      }

      fetchJson(nextUrl, function (d) { mapEvents(d && d.events); finish(); }, function () { finish(); });
      fetchJson(lastUrl, function (d) { mapEvents(d && d.results); finish(); }, function () { finish(); });
    }

    function renderList() {
      var today = getTodayIso();
      var lg = getLeague(currentLeague);
      document.getElementById('todayIso').innerHTML = today;
      document.getElementById('currentLeagueName').innerHTML = lg.name;
      document.getElementById('boxTitle').innerHTML = 'مباريات ' + lg.name;

      var list = matchesByLeague[lg.code] || [];
      if (!list.length) {
        document.getElementById('matchesList').innerHTML = '<div class="empty">لا توجد مباريات متاحة حالياً لبطولة ' + lg.name + '.</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < list.length; i++) {
        var m = list[i];
        html += '<div class="row">' +
          '<div class="st ' + (m.isLive ? 'live' : '') + '">' + m.status + '<br><span style="color:#94a3b8">' + (m.date || '') + '</span></div>' +
          '<div class="tm home">' + m.home + '</div>' +
          '<div class="sc">' + m.score + '</div>' +
          '<div class="tm away">' + m.away + '</div>' +
          '<div style="text-align:left"><a class="watch-btn" href="' + m.watchUrl + '" target="_blank" rel="noopener noreferrer">مشاهدة</a></div>' +
        '</div>';
      }
      document.getElementById('matchesList').innerHTML = html;
    }

    renderLeagues();
    renderList();
    loadMatches();
    setInterval(loadMatches, AUTO_SYNC_MS);
  </script>
</body>
</html>
