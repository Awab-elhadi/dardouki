<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصحف القرآن الكريم</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #f5f2eb;
      --bg-paper: #fffdf8;
      --bg-sidebar: #faf7f0;
      --bg-header: #164b3b;
      --text-main: #1b2420;
      --text-muted: #5b6861;
      --accent: #1b5e4a;
      --accent-soft: rgba(27, 94, 74, 0.12);
      --gold: #b88b3a;
      --border: #dfd8c8;
      --highlight: rgba(184, 139, 58, 0.22);
      --mark-bg: rgba(184, 139, 58, 0.28);
      --col-rule: rgba(184, 139, 58, 0.25);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-page: #f5f2eb;
      --bg-paper: #fffdf8;
      --bg-sidebar: #faf7f0;
      --bg-header: #164b3b;
      --text-main: #1b2420;
      --text-muted: #5b6861;
      --accent: #1b5e4a;
      --accent-soft: rgba(27, 94, 74, 0.12);
      --gold: #b88b3a;
      --border: #dfd8c8;
      --highlight: rgba(184, 139, 58, 0.22);
      --mark-bg: rgba(184, 139, 58, 0.28);
      --col-rule: rgba(184, 139, 58, 0.25);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #0c0e0d;
      --bg-paper: #121514;
      --bg-sidebar: #161a18;
      --bg-header: #101412;
      --text-main: #eceae4;
      --text-muted: #9aa39e;
      --accent: #38a17f;
      --accent-soft: rgba(56, 161, 127, 0.16);
      --gold: #d4a64a;
      --border: #272d2a;
      --highlight: rgba(212, 166, 74, 0.22);
      --mark-bg: rgba(212, 166, 74, 0.3);
      --col-rule: rgba(212, 166, 74, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] {
        --bg-page: #0c0e0d;
        --bg-paper: #121514;
        --bg-sidebar: #161a18;
        --bg-header: #101412;
        --text-main: #eceae4;
        --text-muted: #9aa39e;
        --accent: #38a17f;
        --accent-soft: rgba(56, 161, 127, 0.16);
        --gold: #d4a64a;
        --border: #272d2a;
        --highlight: rgba(212, 166, 74, 0.22);
        --mark-bg: rgba(212, 166, 74, 0.3);
        --col-rule: rgba(212, 166, 74, 0.18);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Traditional Arabic", "Scheherazade New", "Amiri", "Noto Naskh Arabic", Tahoma, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.75;
      min-height: 100vh;
    }

    .topbar {
      background-color: var(--bg-header);
      color: #ffffff;
      padding: 0.55rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 8px;
      padding: 0.32rem 0.65rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.22);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-gold {
      background-color: var(--gold);
      color: #111413;
      border-color: transparent;
    }

    /* القائمة الجانبية للسور */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 60;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      right: -310px;
      width: 295px;
      max-width: 85vw;
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      z-index: 70;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.25);
    }

    .side-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .drawer-header h2 {
      font-size: 1.25rem;
      color: var(--accent);
    }

    .drawer-search {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }

    .drawer-search input {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.4rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-paper);
      color: var(--text-main);
      outline: none;
    }

    .surah-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.4rem;
    }

    .surah-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.08rem;
      margin-bottom: 0.2rem;
      border: 1px solid transparent;
    }

    .surah-item:hover {
      background-color: var(--accent-soft);
    }

    .surah-item.active {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .surah-item-meta {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* مساحة الصفحة الرئيسية كالصحيفة */
    .newspaper-wrap {
      max-width: 1120px;
      margin: 0.75rem auto 2rem;
      padding: 0 0.75rem;
    }

    /* شريط البحث عن الآيات */
    .ayah-search-box {
      background-color: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 0.75rem;
      margin-bottom: 0.75rem;
    }

    .ayah-search-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .ayah-search-row input {
      flex: 1;
      min-width: 180px;
      font-family: inherit;
      font-size: 1.02rem;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-page);
      color: var(--text-main);
      outline: none;
    }

    .scope-btn {
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 0.32rem 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--accent-soft);
      color: var(--text-main);
      cursor: pointer;
    }

    .search-results-panel {
      display: none;
      margin-top: 0.6rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border);
      max-height: 280px;
      overflow-y: auto;
    }

    .search-results-panel.open {
      display: block;
    }

    .search-results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .clear-search-btn {
      font-family: inherit;
      font-size: 0.88rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
      cursor: pointer;
    }

    .result-ayah-card {
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-page);
      margin-bottom: 0.45rem;
      cursor: pointer;
    }

    .result-ayah-card:hover {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .result-ayah-meta {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }

    .result-ayah-text {
      font-size: 1.45rem;
      line-height: 2;
      color: var(--text-main);
    }

    mark.hit {
      background-color: var(--mark-bg);
      color: inherit;
      padding: 0 0.15rem;
      border-radius: 4px;
    }

    .newspaper-sheet {
      background-color: var(--bg-paper);
      border: 1px solid var(--border);
      border-top: 4px solid var(--gold);
      border-radius: 10px;
      padding: 1rem 1.15rem 1.5rem;
    }

    .sheet-masthead {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 0.6rem;
      margin-bottom: 0.85rem;
      border-bottom: 2px double var(--border);
    }

    .sheet-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .sheet-info {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .basmala-line {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 0.45rem 0.5rem;
      margin-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    .newspaper-columns {
      font-size: 2.05rem;
      line-height: 2.55;
      text-align: justify;
      column-count: 1;
      column-gap: 2rem;
      column-rule: 1px solid var(--col-rule);
    }

    @media (min-width: 820px) {
      .newspaper-columns {
        column-count: 2;
      }
    }

    .ayah-unit {
      cursor: pointer;
      padding: 0.04rem 0.16rem;
      border-radius: 5px;
    }

    .ayah-unit:hover {
      background-color: var(--accent-soft);
    }

    .ayah-unit.active {
      background-color: var(--highlight);
      box-shadow: inset 0 -2px 0 var(--gold);
    }

    .ayah-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.65rem;
      height: 1.65rem;
      padding: 0 0.25rem;
      margin: 0 0.22rem;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 50%;
      border: 1px solid var(--gold);
      color: var(--accent);
      vertical-align: middle;
    }

    .tafsir-strip {
      margin-top: 1.15rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .tafsir-strip strong {
      color: var(--text-main);
    }

    .sheet-footer-nav {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .sheet-footer-nav .btn {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.42rem 0.9rem;
    }
  </style>
</head>
<body>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <aside id="sideDrawer" class="side-drawer" aria-label="قائمة السور">
    <div class="drawer-header">
      <h2>السور (١١٤)</h2>
      <button id="closeDrawerBtn" class="btn" type="button" style="color:var(--text-main);border-color:var(--border);">إغلاق</button>
    </div>
    <div class="drawer-search">
      <input id="surahFilterInput" type="search" placeholder="ابحث عن اسم سورة..." />
    </div>
    <ul id="surahList" class="surah-list"></ul>
  </aside>

  <header class="topbar">
    <div class="topbar-group">
      <button id="openDrawerBtn" class="btn btn-gold" type="button">☰ السور</button>
      <button id="resumeBtn" class="btn" type="button">آخر قراءة</button>
    </div>

    <div class="topbar-group">
      <button id="themeBtn" class="btn" type="button">الوضع: نظام الجهاز</button>
      <button id="fontBtn" class="btn" type="button">تكبير الخط</button>
    </div>
  </header>

  <main class="newspaper-wrap">
    <section class="ayah-search-box" aria-label="البحث في الآيات">
      <div class="ayah-search-row">
        <input id="ayahSearchInput" type="search" placeholder="ابحث في الآيات واظهر النتائج..." />
        <button id="scopeBtn" class="scope-btn" type="button">النطاق: السورة الحالية</button>
      </div>
      <div id="searchResultsPanel" class="search-results-panel">
        <div class="search-results-header">
          <span id="searchStatusText">الآيات المطابقة:</span>
          <button id="clearSearchBtn" class="clear-search-btn" type="button">إخفاء النتائج</button>
        </div>
        <div id="searchResultsList"></div>
      </div>
    </section>

    <article class="newspaper-sheet">
      <div class="sheet-masthead">
        <h1 id="surahTitle" class="sheet-title">سورة الفاتحة</h1>
        <div id="surahDetails" class="sheet-info">١ من ١١٤ • مكية • ٧ آيات</div>
      </div>

      <div id="basmalaBox" class="basmala-line" style="display: none;">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
      </div>

      <div id="quranText" class="newspaper-columns"></div>

      <div id="tafsirStrip" class="tafsir-strip">
        <strong id="tafsirLabel">التفسير الميسر:</strong>
        <span id="tafsirContent">اضغط على أي آية لعرض تفسيرها وحفظ موضع قراءتك.</span>
      </div>

      <div class="sheet-footer-nav">
        <button id="prevBtn" class="btn" type="button">السورة السابقة</button>
        <button id="nextBtn" class="btn" type="button">السورة التالية</button>
      </div>
    </article>
  </main>

        "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
        "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
        "الرَّحْمَٰنِ الرَّحِيمِ",
        "مَالِكِ يَوْمِ الدِّينِ",
        "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
        "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
        "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"
      ],
      112: [
        "قُلْ هُوَ اللَّهُ أَحَدٌ",
        "اللَّهُ الصَّمَدُ",
        "لَمْ يَلِدْ وَلَمْ يُولَدْ",
        "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ"
      ],
      113: [
        "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
        "مِنْ شَرِّ مَا خَلَقَ",
        "وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ",
        "وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",
        "وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ"
      ],
      114: [
        "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
        "مَلِكِ النَّاسِ",
        "إِلَٰهِ النَّاسِ",
        "مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",
        "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",
        "مِنَ الْجِنَّةِ وَالنَّاسِ"
      ]
    };

    const API_BASE = "https://api.alquran.cloud/v1";
    const POS_KEY = "quran_newspaper_pos_v2";
    const THEME_KEY = "quran_newspaper_theme_v2";
    const THEME_MODES = ["auto", "light", "dark"];
    const THEME_LABELS = {
      auto: "الوضع: نظام الجهاز",
      light: "الوضع: أبيض",
      dark: "الوضع: أسود"
    };

    const sideDrawer = document.getElementById("sideDrawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const openDrawerBtn = document.getElementById("openDrawerBtn");
    const closeDrawerBtn = document.getElementById("closeDrawerBtn");
    const surahFilterInput = document.getElementById("surahFilterInput");
    const surahList = document.getElementById("surahList");

    const ayahSearchInput = document.getElementById("ayahSearchInput");
    const scopeBtn = document.getElementById("scopeBtn");
    const searchResultsPanel = document.getElementById("searchResultsPanel");
    const searchStatusText = document.getElementById("searchStatusText");
    const searchResultsList = document.getElementById("searchResultsList");
    const clearSearchBtn = document.getElementById("clearSearchBtn");

    const resumeBtn = document.getElementById("resumeBtn");
    const themeBtn = document.getElementById("themeBtn");
    const fontBtn = document.getElementById("fontBtn");
    const surahTitle = document.getElementById("surahTitle");
    const surahDetails = document.getElementById("surahDetails");
    const basmalaBox = document.getElementById("basmalaBox");
    const quranText = document.getElementById("quranText");
    const tafsirLabel = document.getElementById("tafsirLabel");
    const tafsirContent = document.getElementById("tafsirContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentSurah = 1;
    let currentAyahs = [];
    let currentTafsir = [];
    let fontRem = 2.05;
    let themeIndex = 0;
    let searchAllQuran = false;
    let searchTimer = null;

    function toAr(n) {
      return String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[Number(d)]);
    }

    function normalizeArabic(str) {
      return String(str || "")
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
        .replace(/[إأآا]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/ؤ/g, "و")
        .replace(/ئ/g, "ي");
    }

    function escapeRegExp(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightPlainText(text, query) {
      const q = query.trim();
      if (!q) return document.createTextNode(text);
      const regex = new RegExp(`(${escapeRegExp(q)})`, "gi");
      const parts = text.split(regex);
      const frag = document.createDocumentFragment();
      parts.forEach((part) => {
        if (!part) return;
        if (part.toLowerCase() === q.toLowerCase()) {
          const mark = document.createElement("mark");
          mark.className = "hit";
          mark.textContent = part;
          frag.appendChild(mark);
        } else {
          frag.appendChild(document.createTextNode(part));
        }
      });
      return frag;
    }

    function applyTheme(mode) {
      document.documentElement.setAttribute("data-theme", mode);
      themeBtn.textContent = THEME_LABELS[mode] || THEME_LABELS.auto;
      try {
        localStorage.setItem(THEME_KEY, mode);
      } catch (e) {}
    }

    function initTheme() {
      let saved = "auto";
      try {
        saved = localStorage.getItem(THEME_KEY) || "auto";
      } catch (e) {}
      const idx = THEME_MODES.indexOf(saved);
      themeIndex = idx >= 0 ? idx : 0;
      applyTheme(THEME_MODES[themeIndex]);
    }

    function openDrawer() {
      sideDrawer.classList.add("open");
      drawerBackdrop.classList.add("open");
    }

    function closeDrawer() {
      sideDrawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    function renderSurahList(filter = "") {
      const q = filter.trim();
      surahList.innerHTML = "";
      SURAHS_114
        .filter(([, name]) => !q || name.includes(q))
        .forEach(([num, name, count]) => {
          const li = document.createElement("li");
          li.className = "surah-item" + (num === currentSurah ? " active" : "");
          li.innerHTML = `<span>${toAr(num)}. ${name}</span><span class="surah-item-meta">${toAr(count)} آية</span>`;
          li.addEventListener("click", () => {
            closeDrawer();
            loadSurah(num, 1);
          });
          surahList.appendChild(li);
        });
    }

    function savePos(surah, ayah) {
      try {
        localStorage.setItem(POS_KEY, JSON.stringify({ surah, ayah }));
      } catch (e) {}
    }

    function getPos() {
      try {
        const raw = localStorage.getItem(POS_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function buildFallback(num, count) {
      if (FALLBACK_AYAHS[num]) {
        return FALLBACK_AYAHS[num].map((text, i) => ({ numberInSurah: i + 1, text }));
      }
      return Array.from({ length: count }, (_, i) => ({
        numberInSurah: i + 1,
        text: `الآية (${toAr(i + 1)}) — فعّل الإنترنت لتحميل النص الكامل للسورة.`
      }));
    }

    function renderAyahs(ayahs) {
      currentAyahs = ayahs;
      quranText.innerHTML = "";
      ayahs.forEach((ayah) => {
        const span = document.createElement("span");
        span.className = "ayah-unit";
        span.dataset.ayah = ayah.numberInSurah;

        let txt = ayah.text;
        if (
          currentSurah !== 1 &&
          ayah.numberInSurah === 1 &&
          txt.startsWith("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ")
        ) {
          txt = txt.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ", "");
        }

        const badge = document.createElement("span");
        badge.className = "ayah-mark";
        badge.textContent = toAr(ayah.numberInSurah);

        span.textContent = txt;
        span.appendChild(badge);
        span.addEventListener("click", () => selectAyah(ayah.numberInSurah));

        quranText.appendChild(span);
        quranText.appendChild(document.createTextNode(" "));
      });
    }

    function selectAyah(ayahNum, scrollIntoView = false) {
      const target = Number(ayahNum);
      let activeEl = null;
      quranText.querySelectorAll(".ayah-unit").forEach((el) => {
        const isMatch = Number(el.dataset.ayah) === target;
        el.classList.toggle("active", isMatch);
        if (isMatch) activeEl = el;
      });

      if (scrollIntoView && activeEl) {
        activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      const found = currentTafsir.find((a) => a.numberInSurah === target);
      tafsirLabel.textContent = `آية (${toAr(target)}): `;
      tafsirContent.textContent = found ? found.text : "تم تحديد موضع القراءة وحفظه تلقائياً.";
      savePos(currentSurah, target);
    }

    function renderSearchMatches(matches, query) {
      searchResultsPanel.classList.add("open");
      searchResultsList.innerHTML = "";

      if (!matches.length) {
        searchStatusText.textContent = "لا توجد آيات مطابقة لهذا البحث.";
        return;
      }

      searchStatusText.textContent = `الآيات المطابقة (${toAr(matches.length)}):`;

      matches.slice(0, 50).forEach((item) => {
        const card = document.createElement("div");
        card.className = "result-ayah-card";

        const meta = document.createElement("div");
        meta.className = "result-ayah-meta";
        meta.textContent = `${item.surahName} • آية (${toAr(item.ayahNumber)})`;

        const body = document.createElement("div");
        body.className = "result-ayah-text";
        body.appendChild(highlightPlainText(item.text, query));

        card.appendChild(meta);
        card.appendChild(body);

        card.addEventListener("click", async () => {
          if (item.surahNumber !== currentSurah) {
            await loadSurah(item.surahNumber, item.ayahNumber);
          } else {
            selectAyah(item.ayahNumber, true);
          }
        });

        searchResultsList.appendChild(card);
      });
    }

    async function runAyahSearch() {
      const q = ayahSearchInput.value.trim();
      if (!q) {
        searchResultsPanel.classList.remove("open");
        searchResultsList.innerHTML = "";
        return;
      }

      const normQ = normalizeArabic(q);
      const surahInfo = SURAHS_114.find(([n]) => n === currentSurah) || SURAHS_114[0];

      const localMatches = currentAyahs
        .filter((a) => a.text.includes(q) || normalizeArabic(a.text).includes(normQ))
        .map((a) => ({
          surahNumber: currentSurah,
          surahName: surahInfo[1],
          ayahNumber: a.numberInSurah,
          text: a.text
        }));

      renderSearchMatches(localMatches, q);

      if (searchAllQuran) {
        searchStatusText.textContent = "جاري البحث في جميع سور القرآن...";
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 8000);
          const res = await fetch(
            `${API_BASE}/search/${encodeURIComponent(q)}/all/quran-uthmani`,
            { signal: ctrl.signal }
          );
          clearTimeout(timer);
          const data = await res.json();
          if (data.code === 200 && data.data && Array.isArray(data.data.matches)) {
            const apiMatches = data.data.matches.map((m) => ({
              surahNumber: m.surah.number,
              surahName: m.surah.name,
              ayahNumber: m.numberInSurah,
              text: m.text
            }));
            renderSearchMatches(apiMatches, q);
          }
        } catch (e) {
          renderSearchMatches(localMatches, q);
        }
      }
    }

    async function loadSurah(surahNum, targetAyah = 1) {
      const info = SURAHS_114.find(([n]) => n === Number(surahNum)) || SURAHS_114[0];
      const [num, name, count, rev] = info;

      currentSurah = num;
      surahTitle.textContent = name;
      surahDetails.textContent = `${toAr(num)} من ١١٤ • ${rev} • ${toAr(count)} آية`;
      basmalaBox.style.display = num !== 1 && num !== 9 ? "block" : "none";
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= 114;

      renderSurahList(surahFilterInput.value);
      currentTafsir = [];
      renderAyahs(buildFallback(num, count));
      selectAyah(targetAyah, targetAyah > 1);

      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 7000);
        const [tRes, fRes] = await Promise.all([
          fetch(`${API_BASE}/surah/${num}/quran-uthmani`, { signal: ctrl.signal }),
          fetch(`${API_BASE}/surah/${num}/ar.muyassar`, { signal: ctrl.signal })
        ]);
        clearTimeout(timer);

        const [tJson, fJson] = await Promise.all([tRes.json(), fRes.json()]);
        if (tJson.code === 200 && tJson.data && Array.isArray(tJson.data.ayahs)) {
          currentTafsir = (fJson.code === 200 && fJson.data && fJson.data.ayahs) || [];
          renderAyahs(tJson.data.ayahs);
          selectAyah(targetAyah, targetAyah > 1);
        }
      } catch (e) {}
    }

    openDrawerBtn.addEventListener("click", openDrawer);
    closeDrawerBtn.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);
    surahFilterInput.addEventListener("input", (e) => renderSurahList(e.target.value));

    ayahSearchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runAyahSearch, 220);
    });

    scopeBtn.addEventListener("click", () => {
      searchAllQuran = !searchAllQuran;
      scopeBtn.textContent = searchAllQuran ? "النطاق: كل المصحف" : "النطاق: السورة الحالية";
      if (ayahSearchInput.value.trim()) runAyahSearch();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchResultsPanel.classList.remove("open");
    });

    themeBtn.addEventListener("click", () => {
      themeIndex = (themeIndex + 1) % THEME_MODES.length;
      applyTheme(THEME_MODES[themeIndex]);
    });

    fontBtn.addEventListener("click", () => {
      fontRem = fontRem >= 2.85 ? 1.85 : Number((fontRem + 0.25).toFixed(2));
      quranText.style.fontSize = `${fontRem}rem`;
      fontBtn.textContent = fontRem >= 2.85 ? "تصغير الخط" : "تكبير الخط";
    });

    resumeBtn.addEventListener("click", () => {
      const saved = getPos();
      loadSurah(saved && saved.surah ? saved.surah : 1, saved && saved.ayah ? saved.ayah : 1);
    });

    prevBtn.addEventListener("click", () => {
      if (currentSurah > 1) loadSurah(currentSurah - 1, 1);
    });

    nextBtn.addEventListener("click", () => {
      if (currentSurah < 114) loadSurah(currentSurah + 1, 1);
    });

    initTheme();
    const initial = getPos();
    loadSurah(initial && initial.surah ? initial.surah : 1, initial && initial.ayah ? initial.ayah : 1);
  </script>
</body>
</html>
