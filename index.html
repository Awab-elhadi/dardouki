<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصحف القرآن الكريم</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #f4f0e6;
      --bg-paper: #fffdf8;
      --bg-sidebar: #faf6ed;
      --bg-header: #164b3b;
      --text-main: #1b2420;
      --text-muted: #5b6861;
      --accent: #1b5e4a;
      --accent-soft: rgba(27, 94, 74, 0.12);
      --gold: #b58632;
      --gold-soft: rgba(181, 134, 50, 0.14);
      --border: #dfd6c3;
      --highlight: rgba(181, 134, 50, 0.24);
      --mark-bg: rgba(181, 134, 50, 0.32);
      --ornament: rgba(181, 134, 50, 0.38);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-page: #f4f0e6;
      --bg-paper: #fffdf8;
      --bg-sidebar: #faf6ed;
      --bg-header: #164b3b;
      --text-main: #1b2420;
      --text-muted: #5b6861;
      --accent: #1b5e4a;
      --accent-soft: rgba(27, 94, 74, 0.12);
      --gold: #b58632;
      --gold-soft: rgba(181, 134, 50, 0.14);
      --border: #dfd6c3;
      --highlight: rgba(181, 134, 50, 0.24);
      --mark-bg: rgba(181, 134, 50, 0.32);
      --ornament: rgba(181, 134, 50, 0.38);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #0c0e0d;
      --bg-paper: #121514;
      --bg-sidebar: #161a18;
      --bg-header: #101412;
      --text-main: #eceae4;
      --text-muted: #9aa39e;
      --accent: #38a17f;
      --accent-soft: rgba(56, 161, 127, 0.16);
      --gold: #d4a64a;
      --gold-soft: rgba(212, 166, 74, 0.16);
      --border: #272d2a;
      --highlight: rgba(212, 166, 74, 0.22);
      --mark-bg: rgba(212, 166, 74, 0.32);
      --ornament: rgba(212, 166, 74, 0.32);
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] {
        --bg-page: #0c0e0d;
        --bg-paper: #121514;
        --bg-sidebar: #161a18;
        --bg-header: #101412;
        --text-main: #eceae4;
        --text-muted: #9aa39e;
        --accent: #38a17f;
        --accent-soft: rgba(56, 161, 127, 0.16);
        --gold: #d4a64a;
        --gold-soft: rgba(212, 166, 74, 0.16);
        --border: #272d2a;
        --highlight: rgba(212, 166, 74, 0.22);
        --mark-bg: rgba(212, 166, 74, 0.32);
        --ornament: rgba(212, 166, 74, 0.32);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Traditional Arabic", "Scheherazade New", "Amiri", "Noto Naskh Arabic", Tahoma, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .topbar {
      background-color: var(--bg-header);
      color: #ffffff;
      padding: 0.45rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 7px;
      padding: 0.25rem 0.55rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.22);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-gold {
      background-color: var(--gold);
      color: #111413;
      border-color: transparent;
    }

    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.52);
      z-index: 60;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      right: -310px;
      width: 295px;
      max-width: 85vw;
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      z-index: 70;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.25);
    }

    .side-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 0.8rem 0.95rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-header h2 {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .drawer-search {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .drawer-search input {
      width: 100%;
      font-family: inherit;
      font-size: 0.98rem;
      padding: 0.35rem 0.6rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--bg-paper);
      color: var(--text-main);
      outline: none;
    }

    .surah-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.35rem;
    }

    .surah-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.65rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 1.05rem;
      margin-bottom: 0.15rem;
      border: 1px solid transparent;
    }

    .surah-item:hover {
      background-color: var(--accent-soft);
    }

    .surah-item.active {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .surah-item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .mushaf-wrap {
      max-width: 920px;
      margin: 0.6rem auto 1.5rem;
      padding: 0 0.55rem;
    }

    .ayah-search-box {
      background-color: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.42rem 0.6rem;
      margin-bottom: 0.6rem;
    }

    .ayah-search-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .ayah-search-row input {
      flex: 1;
      min-width: 165px;
      font-family: inherit;
      font-size: 0.96rem;
      padding: 0.28rem 0.55rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--bg-page);
      color: var(--text-main);
      outline: none;
    }

    .scope-btn {
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 0.26rem 0.52rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--accent-soft);
      color: var(--text-main);
      cursor: pointer;
    }

    .search-results-panel {
      display: none;
      margin-top: 0.45rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--border);
      max-height: 230px;
      overflow-y: auto;
    }

    .search-results-panel.open {
      display: block;
    }

    .search-results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .clear-search-btn {
      font-family: inherit;
      font-size: 0.82rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 0.08rem 0.42rem;
      cursor: pointer;
    }

    .result-ayah-card {
      padding: 0.4rem 0.55rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background-color: var(--bg-page);
      margin-bottom: 0.3rem;
      cursor: pointer;
    }

    .result-ayah-card:hover {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .result-ayah-meta {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.08rem;
    }

    .result-ayah-text {
      font-size: 1.15rem;
      line-height: 1.65;
    }

    mark.hit {
      background-color: var(--mark-bg);
      color: inherit;
      padding: 0 0.1rem;
      border-radius: 3px;
    }

    .mushaf-frame {
      background-color: var(--bg-paper);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 0.32rem;
    }

    .mushaf-inner-frame {
      border: 1px solid var(--ornament);
      border-radius: 9px;
      padding: 0.7rem 0.8rem 0.9rem;
      background-image:
        radial-gradient(circle at top right, var(--gold-soft) 0, transparent 22%),
        radial-gradient(circle at top left, var(--gold-soft) 0, transparent 22%),
        radial-gradient(circle at bottom right, var(--gold-soft) 0, transparent 22%),
        radial-gradient(circle at bottom left, var(--gold-soft) 0, transparent 22%);
    }

    .page-header-ornament {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 0.38rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--ornament);
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .surah-cartouche {
      text-align: center;
      border: 1px solid var(--gold);
      background-color: var(--gold-soft);
      border-radius: 9px;
      padding: 0.25rem 0.65rem;
      margin-bottom: 0.45rem;
    }

    .surah-cartouche::before,
    .surah-cartouche::after {
      content: "❖";
      color: var(--gold);
      font-size: 0.88rem;
      margin: 0 0.4rem;
      vertical-align: middle;
    }

    .surah-title {
      display: inline;
      font-size: 1.38rem;
      font-weight: 700;
      color: var(--accent);
    }

    .basmala-ornament {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      padding: 0.2rem 0.35rem 0.35rem;
      margin-bottom: 0.4rem;
      border-bottom: 1px dashed var(--ornament);
    }

    /* خط متناسق ومسافات طبيعية بدون فجوات */
    .mushaf-page-text {
      font-size: 1.42rem;
      line-height: 1.72;
      text-align: right;
      word-spacing: normal;
      letter-spacing: normal;
      color: var(--text-main);
    }

    .ayah-span {
      cursor: pointer;
      padding: 0;
      margin: 0;
      border-radius: 4px;
    }

    .ayah-span:hover {
      background-color: var(--accent-soft);
    }

    .ayah-span.active {
      background-color: var(--highlight);
      box-shadow: inset 0 -2px 0 var(--gold);
    }

    .ayah-rosace {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.25rem;
      height: 1.25rem;
      padding: 0 0.16rem;
      margin: 0 0.12rem;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      background-color: var(--gold-soft);
      border: 1px solid var(--gold);
      border-radius: 50%;
      vertical-align: middle;
      line-height: 1;
    }

    .tafsir-bar {
      margin-top: 0.65rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--ornament);
      font-size: 0.94rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .tafsir-bar strong {
      color: var(--accent);
    }

    .page-nav-bar {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--ornament);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .page-indicator {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent);
      padding: 0.14rem 0.6rem;
      border-radius: 20px;
      border: 1px solid var(--ornament);
      background-color: var(--gold-soft);
    }

    .page-nav-bar .btn {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.3rem 0.7rem;
    }

    .surah-step-bar {
      margin-top: 0.5rem;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .surah-step-bar .btn {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.24rem 0.6rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <aside id="sideDrawer" class="side-drawer" aria-label="قائمة السور">
    <div class="drawer-header">
      <h2>السور (١١٤)</h2>
      <button id="closeDrawerBtn" class="btn" type="button" style="color:var(--text-main);border-color:var(--border);">إغلاق</button>
    </div>
    <div class="drawer-search">
      <input id="surahFilterInput" type="search" placeholder="ابحث عن اسم سورة..." />
    </div>
    <ul id="surahList" class="surah-list"></ul>
  </aside>

  <header class="topbar">
    <div class="topbar-group">
      <button id="openDrawerBtn" class="btn btn-gold" type="button">☰ السور</button>
      <button id="resumeBtn" class="btn" type="button">آخر قراءة</button>
    </div>

    <div class="topbar-group">
      <button id="themeBtn" class="btn" type="button">الوضع: نظام الجهاز</button>
      <button id="fontBtn" class="btn" type="button">تكبير الخط</button>
    </div>
  </header>

  <main class="mushaf-wrap">
    <section class="ayah-search-box" aria-label="البحث في الآيات">
      <div class="ayah-search-row">
        <input id="ayahSearchInput" type="search" placeholder="ابحث في الآيات (مثال: العالمين، الصراط، أحد)..." />
        <button id="scopeBtn" class="scope-btn" type="button">النطاق: السورة الحالية</button>
      </div>
      <div id="searchResultsPanel" class="search-results-panel">
        <div class="search-results-header">
          <span id="searchStatusText">الآيات المطابقة:</span>
          <button id="clearSearchBtn" class="clear-search-btn" type="button">إخفاء النتائج</button>
        </div>
        <div id="searchResultsList"></div>
      </div>
    </section>

    <article class="mushaf-frame">
      <div class="mushaf-inner-frame">
        <div class="page-header-ornament">
          <span id="surahMetaTop">سورة الفاتحة • مكية</span>
          <span id="pageBadgeTop">صفحة ١</span>
        </div>

        <div class="surah-cartouche">
          <h1 id="surahTitle" class="surah-title">سورة الفاتحة</h1>
        </div>

        <div id="basmalaBox" class="basmala-ornament" style="display: none;">
          بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
        </div>

        <div id="quranPageText" class="mushaf-page-text"></div>

        <div id="tafsirBar" class="tafsir-bar">
          <strong id="tafsirLabel">التفسير الميسر:</strong>
          <span id="tafsirContent">اضغط على أي آية لعرض تفسيرها وحفظ موضع قراءتك.</span>
        </div>

        <div class="page-nav-bar">
          <button id="prevPageBtn" class="btn" type="button">الصفحة السابقة</button>
          <span id="pageCounter" class="page-indicator">صفحة ١ من ١</span>
          <button id="nextPageBtn" class="btn" type="button">الصفحة التالية</button>
        </div>

        <div class="surah-step-bar">
          <button id="prevSurahBtn" class="btn" type="button">← السورة السابقة</button>
          <button id="nextSurahBtn" class="btn" type="button">السورة التالية →</button>
        </div>
      </div>
    </article>
  </main>

      [85, "سورة البروج", 22, "مكية"],
      [86, "سورة الطارق", 17, "مكية"],
      [87, "سورة الأعلى", 19, "مكية"],
      [88, "سورة الغاشية", 26, "مكية"],
      [89, "سورة الفجر", 30, "مكية"],
      [90, "سورة البلد", 20, "مكية"],
      [91, "سورة الشمس", 15, "مكية"],
      [92, "سورة الليل", 21, "مكية"],
      [93, "سورة الضحى", 11, "مكية"],
      [94, "سورة الشرح", 8, "مكية"],
      [95, "سورة التين", 8, "مكية"],
      [96, "سورة العلق", 19, "مكية"],
      [97, "سورة القدر", 5, "مكية"],
      [98, "سورة البينة", 8, "مدنية"],
      [99, "سورة الزلزلة", 8, "مدنية"],
      [100, "سورة العاديات", 11, "مكية"],
      [101, "سورة القارعة", 11, "مكية"],
      [102, "سورة التكاثر", 8, "مكية"],
      [103, "سورة العصر", 3, "مكية"],
      [104, "سورة الهمزة", 9, "مكية"],
      [105, "سورة الفيل", 5, "مكية"],
      [106, "سورة قريش", 4, "مكية"],
      [107, "سورة الماعون", 7, "مكية"],
      [108, "سورة الكوثر", 3, "مكية"],
      [109, "سورة الكافرون", 6, "مكية"],
      [110, "سورة النصر", 3, "مدنية"],
      [111, "سورة المسد", 5, "مكية"],
      [112, "سورة الإخلاص", 4, "مكية"],
      [113, "سورة الفلق", 5, "مكية"],
      [114, "سورة الناس", 6, "مكية"]
    ];

    const FALLBACK_AYAHS = {
      1: [
        "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
        "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
        "الرَّحْمَٰنِ الرَّحِيمِ",
        "مَالِكِ يَوْمِ الدِّينِ",
        "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
        "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
        "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"
      ],
      112: [
        "قُلْ هُوَ اللَّهُ أَحَدٌ",
        "اللَّهُ الصَّمَدُ",
        "لَمْ يَلِدْ وَلَمْ يُولَدْ",
        "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ"
      ],
      113: [
        "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
        "مِنْ شَرِّ مَا خَلَقَ",
        "وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ",
        "وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",
        "وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ"
      ],
      114: [
        "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
        "مَلِكِ النَّاسِ",
        "إِلَٰهِ النَّاسِ",
        "مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",
        "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",
        "مِنَ الْجِنَّةِ وَالنَّاسِ"
      ]
    };

    const API_BASE = "https://api.alquran.cloud/v1";
    const POS_KEY = "quran_pages_ornate_pos_v3";
    const THEME_KEY = "quran_pages_ornate_theme_v3";
    const THEME_MODES = ["auto", "light", "dark"];
    const THEME_LABELS = {
      auto: "الوضع: نظام الجهاز",
      light: "الوضع: أبيض",
      dark: "الوضع: أسود"
    };
    const AYAHS_PER_PAGE = 22;
    const DEFAULT_FONT_REM = 1.42;

    const sideDrawer = document.getElementById("sideDrawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const openDrawerBtn = document.getElementById("openDrawerBtn");
    const closeDrawerBtn = document.getElementById("closeDrawerBtn");
    const surahFilterInput = document.getElementById("surahFilterInput");
    const surahList = document.getElementById("surahList");

    const ayahSearchInput = document.getElementById("ayahSearchInput");
    const scopeBtn = document.getElementById("scopeBtn");
    const searchResultsPanel = document.getElementById("searchResultsPanel");
    const searchStatusText = document.getElementById("searchStatusText");
    const searchResultsList = document.getElementById("searchResultsList");
    const clearSearchBtn = document.getElementById("clearSearchBtn");

    const resumeBtn = document.getElementById("resumeBtn");
    const themeBtn = document.getElementById("themeBtn");
    const fontBtn = document.getElementById("fontBtn");
    const surahMetaTop = document.getElementById("surahMetaTop");
    const pageBadgeTop = document.getElementById("pageBadgeTop");
    const surahTitle = document.getElementById("surahTitle");
    const basmalaBox = document.getElementById("basmalaBox");
    const quranPageText = document.getElementById("quranPageText");
    const tafsirLabel = document.getElementById("tafsirLabel");
    const tafsirContent = document.getElementById("tafsirContent");
    const pageCounter = document.getElementById("pageCounter");
    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");
    const prevSurahBtn = document.getElementById("prevSurahBtn");
    const nextSurahBtn = document.getElementById("nextSurahBtn");

    let currentSurah = 1;
    let currentAyahs = [];
    let currentTafsir = [];
    let isOnlineSurahLoaded = false;
    let currentPage = 1;
    let fontRem = DEFAULT_FONT_REM;
    let themeIndex = 0;
    let searchAllQuran = false;
    let searchTimer = null;

    function toAr(n) {
      return String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[Number(d)]);
    }

    function normalizeArabic(str) {
      return String(str || "")
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
        .replace(/[ٱإأآا]/g, "ا")
        .replace(/[ىيئ]/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/ؤ/g, "و")
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeRegExp(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightPlainText(text, query) {
      const q = query.trim();
      if (!q) return document.createTextNode(text);
      const regex = new RegExp(`(${escapeRegExp(q)})`, "gi");
      const parts = text.split(regex);
      const frag = document.createDocumentFragment();
      parts.forEach((part) => {
        if (!part) return;
        if (part.toLowerCase() === q.toLowerCase()) {
          const mark = document.createElement("mark");
          mark.className = "hit";
          mark.textContent = part;
          frag.appendChild(mark);
        } else {
          frag.appendChild(document.createTextNode(part));
        }
      });
      return frag;
    }

    function applyTheme(mode) {
      document.documentElement.setAttribute("data-theme", mode);
      themeBtn.textContent = THEME_LABELS[mode] || THEME_LABELS.auto;
      try {
        localStorage.setItem(THEME_KEY, mode);
      } catch (e) {}
    }

    function initTheme() {
      let saved = "auto";
      try {
        saved = localStorage.getItem(THEME_KEY) || "auto";
      } catch (e) {}
      const idx = THEME_MODES.indexOf(saved);
      themeIndex = idx >= 0 ? idx : 0;
      applyTheme(THEME_MODES[themeIndex]);
    }

    function openDrawer() {
      sideDrawer.classList.add("open");
      drawerBackdrop.classList.add("open");
    }

    function closeDrawer() {
      sideDrawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    function renderSurahList(filter = "") {
      const q = filter.trim();
      surahList.innerHTML = "";
      SURAHS_114
        .filter(([, name]) => !q || name.includes(q))
        .forEach(([num, name, count]) => {
          const li = document.createElement("li");
          li.className = "surah-item" + (num === currentSurah ? " active" : "");
          li.innerHTML = `<span>${toAr(num)}. ${name}</span><span class="surah-item-meta">${toAr(count)} آية</span>`;
          li.addEventListener("click", () => {
            closeDrawer();
            loadSurah(num, 1, 1);
          });
          surahList.appendChild(li);
        });
    }

    function savePos(surah, ayah, page) {
      try {
        localStorage.setItem(POS_KEY, JSON.stringify({ surah, ayah, page }));
      } catch (e) {}
    }

    function getPos() {
      try {
        const raw = localStorage.getItem(POS_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function buildFallback(num, count) {
      if (FALLBACK_AYAHS[num]) {
        return FALLBACK_AYAHS[num].map((text, i) => ({ numberInSurah: i + 1, text }));
      }
      return Array.from({ length: count }, (_, i) => ({
        numberInSurah: i + 1,
        text: `الآية (${toAr(i + 1)}) — فعّل الإنترنت لتحميل النص الكامل للسورة.`
      }));
    }

    function getTotalPages() {
      return Math.max(1, Math.ceil(currentAyahs.length / AYAHS_PER_PAGE));
    }

    function renderCurrentPage(targetAyah = null) {
      const totalPages = getTotalPages();
      currentPage = Math.min(Math.max(1, Number(currentPage) || 1), totalPages);

      const startIdx = (currentPage - 1) * AYAHS_PER_PAGE;
      const pageAyahs = currentAyahs.slice(startIdx, startIdx + AYAHS_PER_PAGE);

      const info = SURAHS_114.find(([n]) => n === currentSurah) || SURAHS_114[0];
      surahMetaTop.textContent = `${info[1]} • ${info[3]} • ${toAr(info[2])} آية`;
      pageBadgeTop.textContent = `صفحة ${toAr(currentPage)}`;
      pageCounter.textContent = `صفحة ${toAr(currentPage)} من ${toAr(totalPages)}`;
      basmalaBox.style.display = currentSurah !== 1 && currentSurah !== 9 && currentPage === 1 ? "block" : "none";

      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= totalPages;

      quranPageText.innerHTML = "";
      pageAyahs.forEach((ayah) => {
        const span = document.createElement("span");
        span.className = "ayah-span";
        span.dataset.ayah = ayah.numberInSurah;

        let txt = ayah.text;
        if (
          currentSurah !== 1 &&
          ayah.numberInSurah === 1 &&
          txt.startsWith("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ")
        ) {
          txt = txt.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ", "");
        }

        const badge = document.createElement("span");
        badge.className = "ayah-rosace";
        badge.textContent = toAr(ayah.numberInSurah);

        span.textContent = txt;
        span.appendChild(badge);
        span.addEventListener("click", () => selectAyah(ayah.numberInSurah));

        quranPageText.appendChild(span);
        quranPageText.appendChild(document.createTextNode(" "));
      });

      const ayahToSelect =
        targetAyah && pageAyahs.some((a) => a.numberInSurah === Number(targetAyah))
          ? Number(targetAyah)
          : pageAyahs[0]
          ? pageAyahs[0].numberInSurah
          : 1;

      selectAyah(ayahToSelect);
    }

    function selectAyah(ayahNum) {
      const target = Number(ayahNum);

      quranPageText.querySelectorAll(".ayah-span").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.ayah) === target);
      });

      const found = currentTafsir.find((a) => a.numberInSurah === target);
      tafsirLabel.textContent = `آية (${toAr(target)}): `;
      tafsirContent.textContent = found ? found.text : "تم تحديد موضع القراءة وحفظه تلقائياً.";
      savePos(currentSurah, target, currentPage);
    }

    function renderSearchMatches(matches, query, note = "") {
      searchResultsPanel.classList.add("open");
      searchResultsList.innerHTML = "";

      if (!matches.length) {
        searchStatusText.textContent = note || "لا توجد آيات مطابقة لهذا البحث.";
        return;
      }

      searchStatusText.textContent = note || `الآيات المطابقة (${toAr(matches.length)}):`;

      matches.slice(0, 60).forEach((item) => {
        const card = document.createElement("div");
        card.className = "result-ayah-card";

        const meta = document.createElement("div");
        meta.className = "result-ayah-meta";
        meta.textContent = `${item.surahName} • آية (${toAr(item.ayahNumber)})`;

        const body = document.createElement("div");
        body.className = "result-ayah-text";
        body.appendChild(highlightPlainText(item.text, query));

        card.appendChild(meta);
        card.appendChild(body);

        card.addEventListener("click", async () => {
          const destPage = Math.max(1, Math.ceil(item.ayahNumber / AYAHS_PER_PAGE));
          if (item.surahNumber !== currentSurah) {
            await loadSurah(item.surahNumber, item.ayahNumber, destPage);
          } else {
            currentPage = destPage;
            renderCurrentPage(item.ayahNumber);
          }
        });

        searchResultsList.appendChild(card);
      });
    }

    async function runAyahSearch() {
      const q = ayahSearchInput.value.trim();
      if (!q) {
        searchResultsPanel.classList.remove("open");
        searchResultsList.innerHTML = "";
        return;
      }

      const normQ = normalizeArabic(q);
      const surahInfo = SURAHS_114.find(([n]) => n === currentSurah) || SURAHS_114[0];

      const localMatches = currentAyahs
        .filter((a) => {
          if (a.text.includes(q)) return true;
          const normAyah = normalizeArabic(a.text);
          return normQ && normAyah.includes(normQ);
        })
        .map((a) => ({
          surahNumber: currentSurah,
          surahName: surahInfo[1],
          ayahNumber: a.numberInSurah,
          text: a.text
        }));

      const offlineNotice =
        !isOnlineSurahLoaded && !localMatches.length && currentSurah !== 1 && currentSurah < 112
          ? "النص الكامل للسورة غير محمّل بدون إنترنت؛ فعّل الإنترنت أو غيّر النطاق إلى كل المصحف."
          : "";

      renderSearchMatches(localMatches, q, offlineNotice);

      if (searchAllQuran) {
        searchStatusText.textContent = "جاري البحث في جميع سور القرآن...";
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 8000);
          const res = await fetch(
            `${API_BASE}/search/${encodeURIComponent(q)}/all/quran-uthmani`,
            { signal: ctrl.signal }
          );
          clearTimeout(timer);
          const data = await res.json();
          if (data.code === 200 && data.data && Array.isArray(data.data.matches)) {
            const apiMatches = data.data.matches.map((m) => ({
              surahNumber: m.surah.number,
              surahName: m.surah.name,
              ayahNumber: m.numberInSurah,
              text: m.text
            }));
            renderSearchMatches(apiMatches, q);
          }
        } catch (e) {
          renderSearchMatches(localMatches, q, "تعذر البحث في كامل المصحف؛ تحقق من الاتصال بالإنترنت.");
        }
      }
    }

    async function loadSurah(surahNum, targetAyah = 1, targetPage = 1) {
      const info = SURAHS_114.find(([n]) => n === Number(surahNum)) || SURAHS_114[0];
      const [num, name, count] = info;

      currentSurah = num;
      surahTitle.textContent = name;
      prevSurahBtn.disabled = num <= 1;
      nextSurahBtn.disabled = num >= 114;

      renderSurahList(surahFilterInput.value);
      currentTafsir = [];
      isOnlineSurahLoaded = false;
      currentAyahs = buildFallback(num, count);
      currentPage = targetPage || Math.max(1, Math.ceil(targetAyah / AYAHS_PER_PAGE));
      renderCurrentPage(targetAyah);

      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 7000);
        const [tRes, fRes] = await Promise.all([
          fetch(`${API_BASE}/surah/${num}/quran-uthmani`, { signal: ctrl.signal }),
          fetch(`${API_BASE}/surah/${num}/ar.muyassar`, { signal: ctrl.signal })
        ]);
        clearTimeout(timer);

        const [tJson, fJson] = await Promise.all([tRes.json(), fRes.json()]);
        if (tJson.code === 200 && tJson.data && Array.isArray(tJson.data.ayahs)) {
          isOnlineSurahLoaded = true;
          currentAyahs = tJson.data.ayahs;
          currentTafsir = (fJson.code === 200 && fJson.data && fJson.data.ayahs) || [];
          currentPage = targetPage || Math.max(1, Math.ceil(targetAyah / AYAHS_PER_PAGE));
          renderCurrentPage(targetAyah);
          if (ayahSearchInput.value.trim()) runAyahSearch();
        }
      } catch (e) {}
    }

    openDrawerBtn.addEventListener("click", openDrawer);
    closeDrawerBtn.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);
    surahFilterInput.addEventListener("input", (e) => renderSurahList(e.target.value));

    ayahSearchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runAyahSearch, 200);
    });

    scopeBtn.addEventListener("click", () => {
      searchAllQuran = !searchAllQuran;
      scopeBtn.textContent = searchAllQuran ? "النطاق: كل المصحف" : "النطاق: السورة الحالية";
      if (ayahSearchInput.value.trim()) runAyahSearch();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchResultsPanel.classList.remove("open");
    });

    themeBtn.addEventListener("click", () => {
      themeIndex = (themeIndex + 1) % THEME_MODES.length;
      applyTheme(THEME_MODES[themeIndex]);
    });

    fontBtn.addEventListener("click", () => {
      fontRem = fontRem >= 2.08 ? 1.24 : Number((fontRem + 0.18).toFixed(2));
      quranPageText.style.fontSize = `${fontRem}rem`;
      fontBtn.textContent = fontRem >= 2.08 ? "تصغير الخط" : "تكبير الخط";
    });

    resumeBtn.addEventListener("click", () => {
      const saved = getPos();
      loadSurah(
        saved && saved.surah ? saved.surah : 1,
        saved && saved.ayah ? saved.ayah : 1,
        saved && saved.page ? saved.page : 1
      );
    });

    prevPageBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        renderCurrentPage();
      }
    });

    nextPageBtn.addEventListener("click", () => {
      if (currentPage < getTotalPages()) {
        currentPage += 1;
        renderCurrentPage();
      }
    });

    prevSurahBtn.addEventListener("click", () => {
      if (currentSurah > 1) loadSurah(currentSurah - 1, 1, 1);
    });

    nextSurahBtn.addEventListener("click", () => {
      if (currentSurah < 114) loadSurah(currentSurah + 1, 1, 1);
    });

    initTheme();
    const initial = getPos();
    loadSurah(
      initial && initial.surah ? initial.surah : 1,
      initial && initial.ayah ? initial.ayah : 1,
      initial && initial.page ? initial.page : 1
    );
  </script>
</body>
</html>
