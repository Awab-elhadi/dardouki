<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARDOUKI - الموسوعة الكروية والمباريات والترتيب</title>
  <style>
    :root{
      --bg:#f1f5f9; --card:#ffffff; --card2:#f8fafc; --line:#e2e8f0;
      --txt:#0f172a; --muted:#64748b; --acc:#f59e0b; --acc-dark:#78350f;
      --grn:#16a34a; --red:#dc2626; --blu:#2563eb; --pitch1:#15803d; --pitch2:#166534;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
    header{background:#ffffff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30}
    .brand{font-weight:900;font-size:18px;color:#0f172a}
    .brand span{background:var(--acc);color:#fff;padding:2px 7px;border-radius:6px;margin-left:4px}
    .sync{font-size:11px;background:#fef3c7;color:var(--acc-dark);padding:4px 9px;border-radius:99px;font-weight:800}

    .wrap{max-width:920px;margin:auto;padding:10px}
    .nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
    .n-tab{background:#fff;color:var(--muted);border:1px solid var(--line);padding:9px 6px;border-radius:8px;font-weight:800;font-size:12px}
    .n-tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}

    .sub-actions{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .act-btn{background:#fff;color:var(--txt);border:1px solid var(--line);padding:7px 11px;border-radius:8px;font-size:11px;font-weight:800}
    .act-btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}

    .days-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
    .day-btn{min-width:68px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;color:var(--muted)}
    .day-btn.active{background:var(--acc);border-color:var(--acc);color:#fff}
    .day-name{display:block;font-size:10px;font-weight:700}
    .day-num{display:block;font-size:15px;font-weight:900;margin:1px 0}
    .day-mon{display:block;font-size:10px}

    .search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt);margin-bottom:8px;font-size:13px}

    .filter-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .f-chip{background:#fff;color:var(--txt);border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800}
    .f-chip.active{background:#fef3c7;border-color:var(--acc);color:var(--acc-dark)}

    .leagues{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
    .lg-chip{white-space:nowrap;background:#fff;color:var(--txt);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:800}
    .lg-chip.active{background:#0f172a;color:#fff;border-color:#0f172a}

    .notice{font-size:12px;color:var(--acc-dark);background:#fffbeb;border:1px solid #fde68a;padding:9px 11px;border-radius:8px;margin-bottom:10px;line-height:1.55}

    .comp-block{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
    .comp-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff}
    .comp-title{font-weight:900;font-size:14px;color:var(--txt)}
    .comp-sub{font-size:11px;color:var(--muted)}
    .round-bar{background:#f8fafc;color:var(--muted);font-size:11px;font-weight:700;padding:6px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}

    .match-row{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:80px 1fr auto 1fr 84px;align-items:center;gap:6px}
    .match-row:last-child{border-bottom:none}
    .m-status-col{font-size:11px;color:var(--muted);font-weight:700}
    .m-status-col.live{color:var(--grn);font-weight:900}
    .team-cell{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
    .team-cell.home{justify-content:flex-start}
    .team-cell.away{justify-content:flex-end;text-align:left}
    .t-badge{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#0f172a;font-size:10px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    .center-score{background:#f8fafc;border:1px solid var(--line);padding:4px 9px;border-radius:6px;font-weight:900;font-size:12px;min-width:58px;text-align:center}
    .act-col{text-align:left}
    .mini-btn{background:#fff;border:1px solid var(--line);color:var(--txt);padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800}

    .stand-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:11px;min-width:540px}
    th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-size:10px;background:#f8fafc}
    td.t-team{text-align:right;font-weight:800}
    .form-dots{display:inline-flex;gap:2px;direction:ltr}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .dot.w{background:#16a34a}.dot.d{background:#94a3b8}.dot.l{background:#dc2626}
    .legend-row{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);padding:8px 4px 2px}
    .leg-item{display:inline-flex;align-items:center;gap:4px}
    .leg-bar{width:3px;height:11px;border-radius:2px;display:inline-block}

    .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
    .info-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
    .info-title{font-weight:900;font-size:13px;margin-bottom:6px;color:var(--txt)}
    .info-meta{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
    .tag{display:inline-block;background:#f1f5f9;color:var(--txt);font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;margin:2px}
    .tag.gold{background:#fef3c7;color:var(--acc-dark)}
    .tag.green{background:#dcfce7;color:#166534}

    .player-card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .p-big-ava{
      width:48px;height:48px;border-radius:50%;
      background:#0f172a;color:#fff;border:2px solid var(--acc);
      font-size:13px;font-weight:900;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;flex-shrink:0;
    }
    .p-big-ava img{width:100%;height:100%;object-fit:cover;display:block}

    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.72);z-index:60;padding:8px;overflow-y:auto}
    .modal-box{max-width:840px;margin:8px auto;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
    .modal-top{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .modal-tabs{display:flex;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:#fff;font-size:12px;font-weight:800}
    .d-tab{background:none;border:none;color:var(--muted);padding:4px 2px;font-weight:800}
    .d-tab.active{color:var(--txt);border-bottom:2px solid var(--acc)}
    .modal-body{padding:12px}

    .formations-bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;margin-bottom:8px;padding:0 4px}
    .dual-pitch{
      position:relative;
      display:grid;
      grid-template-columns:1fr 1fr;
      background:repeating-linear-gradient(to right,var(--pitch1) 0%,var(--pitch1) 16.6%,var(--pitch2) 16.6%,var(--pitch2) 33.2%);
      border:2px solid #fff;
      border-radius:10px;
      min-height:360px;
      padding:10px 6px;
      margin-bottom:12px;
      overflow:hidden;
    }
    .dual-pitch::after{
      content:"";
      position:absolute;
      top:50%;left:50%;
      width:68px;height:68px;
      transform:translate(-50%,-50%);
      border:1.5px solid rgba(255,255,255,.45);
      border-radius:50%;
      pointer-events:none;
    }
    .half-pitch{display:flex;flex-direction:column;justify-content:space-around;z-index:2;padding:4px}
    .p-col{display:flex;flex-direction:column;justify-content:space-around;align-items:center;gap:6px}
    .half-pitch.home-half{flex-direction:row;border-left:1px dashed rgba(255,255,255,.45)}
    .half-pitch.away-half{flex-direction:row-reverse;border-right:1px dashed rgba(255,255,255,.45)}
    .p-token{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:78px}
    .p-ava{
      width:38px;height:38px;border-radius:50%;
      background:#0f172a;color:#fff;border:2px solid #ffffff;
      box-shadow:0 2px 6px rgba(0,0,0,.35);
      font-size:11px;font-weight:900;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    .p-ava img{width:100%;height:100%;object-fit:cover;display:block}
    .p-lbl{
      background:rgba(15,23,42,.92);color:#ffffff;
      font-size:10px;font-weight:800;
      padding:2px 6px;border-radius:6px;margin-top:3px;
      word-break:break-word;line-height:1.25;
    }

    .sec-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
    .sec-h{font-size:12px;font-weight:900;margin-bottom:8px;color:var(--txt)}
    .two-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .ply-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #f1f5f9;font-size:12px}
    .ply-line:last-child{border-bottom:none}
    .ply-left{display:flex;align-items:center;gap:8px}
    .ply-thumb{
      width:28px;height:28px;border-radius:50%;
      background:#e2e8f0;color:#0f172a;border:1.5px solid #cbd5e1;
      font-size:10px;font-weight:900;
      display:inline-flex;align-items:center;justify-content:center;
      overflow:hidden;flex-shrink:0;
    }
    .ply-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .inj-plus{color:var(--red);font-weight:900;margin-left:4px}

    @media(max-width:650px){
      .nav-grid{grid-template-columns:repeat(2,1fr)}
      .match-row{grid-template-columns:66px 1fr auto 1fr 72px;gap:4px;padding:8px}
      .two-teams{grid-template-columns:1fr}
      .dual-pitch{min-height:310px}
      .p-ava{width:34px;height:34px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ <span>DARDOUKI</span></div>
    <div class="sync" id="syncStatus">تحديث تلقائي كل 90 ث</div>
  </header>

  <div class="wrap">
    <div class="nav-grid">
      <button type="button" class="n-tab active" id="tab_matches" onclick="switchSection('matches')">المباريات والنتائج</button>
      <button type="button" class="n-tab" id="tab_standings" onclick="switchSection('standings')">جدول الترتيب</button>
      <button type="button" class="n-tab" id="tab_archive" onclick="switchSection('archive')">الأرشيف وكأس العالم</button>
      <button type="button" class="n-tab" id="tab_players" onclick="switchSection('players')">اللاعبون والبطولات</button>
    </div>

    <div class="sub-actions">
      <button type="button" class="act-btn primary" onclick="syncLeague()">تحديث مباشر الآن (90 ث)</button>
      <button type="button" class="act-btn" onclick="openDataSourceModal()">ربط ملف/مصدر بيانات JSON</button>
    </div>

    <div id="matchesControls">
      <div class="days-strip" id="daysStrip"></div>
      <div class="filter-row">
        <button type="button" class="f-chip active" id="fc_all_range" onclick="pickStatusFilter('all_range')">الفاتت والقادمة</button>
        <button type="button" class="f-chip" id="fc_day" onclick="pickStatusFilter('day')">حسب اليوم المحدد</button>
        <button type="button" class="f-chip" id="fc_live" onclick="pickStatusFilter('live')">مباشر</button>
        <button type="button" class="f-chip" id="fc_fav" onclick="pickStatusFilter('fav')">المفضلة</button>
      </div>
    </div>

    <div id="archiveControls" style="display:none" class="filter-row">
      <button type="button" class="f-chip active" id="ac_all" onclick="pickArchiveFilter('all')">كل السنوات</button>
      <button type="button" class="f-chip" id="ac_pre2000" onclick="pickArchiveFilter('pre2000')">ما قبل 2000</button>
      <button type="button" class="f-chip" id="ac_wc" onclick="pickArchiveFilter('wc')">كأس العالم</button>
      <button type="button" class="f-chip" id="ac_2000plus" onclick="pickArchiveFilter('2000plus')">2000 - الآن</button>
    </div>

    <input class="search" id="q" placeholder="ابحث عن فريق، مباراة، نسخة كأس العالم، لاعب، أو بطولة..." onkeyup="renderAll()" />
    <div class="leagues" id="leaguesBar"></div>
    <div class="notice" id="noticeBox">
      يعرض التطبيق المباريات الفاتت والقادمة والتحديثات كل 90 ثانية من المصادر المتاحة أو ملفات البيانات المربوطة دون أي بيانات وهمية أو مختلقة.
    </div>
    <div id="view"></div>
  </div>

  <div class="modal-backdrop" id="detailModal" onclick="backdropClose(event)">
    <div class="modal-box" id="detailContent"></div>
  </div>

  <script>
    var TSDB_BASE = 'https://www.thesportsdb.com/api/v1/json/123';
    var AUTO_SYNC_MS = 90000; // تحديث تلقائي كل دقيقة ونصف (90 ثانية)

    var currentSection = 'matches';
    var currentLeague = 'bl1';
    var selectedDate = getIsoDate(0);
    var statusFilter = 'all_range';
    var archiveFilter = 'all';
    var favTeams = {};

    var matchesByLeague = {};
    var standingsByLeague = {};
    var archiveMatches = [];
    var playersDirectory = [];
    var externalFeedUrl = '';

    var modalMatch = null;
    var modalSubTab = 'lineup';

    var DAYS_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    var MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

    var TEAM_AR = {
      'fc bayern münchen': 'بايرن ميونخ',
      'bayern münchen': 'بايرن ميونخ',

      'borussia dortmund': 'بوروسيا دورتموند',

    };

    var LEAGUES = [
      { code: 'bl1', name: 'الدوري الألماني', country: 'ألمانيا', tier: 'كبرى', openligaShortcut: 'bl1', openligaSeason: '2026', tsdbId: '4331', tsdbSeason: '2026-2027' },
      { code: 'pl', name: 'الدوري الإنجليزي الممتاز', country: 'إنجلترا', tier: 'كبرى', openligaShortcut: '', openligaSeason: '', tsdbId: '4328', tsdbSeason: '2026-2027' },
      { code: 'pd', name: 'الدوري الإسباني', country: 'إسبانيا', tier: 'كبرى', openligaShortcut: '', openligaSeason: '', tsdbId: '4335', tsdbSeason: '2026-2027' },
      { code: 'cl', name: 'دوري أبطال أوروبا', country: 'أوروبا', tier: 'قارية', openligaShortcut: '', openligaSeason: '', tsdbId: '4480', tsdbSeason: '2026-2027' },
      { code: 'sa', name: 'الدوري الإيطالي', country: 'إيطاليا', tier: 'كبرى', openligaShortcut: '', openligaSeason: '', tsdbId: '4332', tsdbSeason: '2026-2027' },

      { code: 'minor', name: 'الدوريات الصغرى والدرجات', country: 'متعدد', tier: 'صغرى', openligaShortcut: '', openligaSeason: '', tsdbId: '', tsdbSeason: '' }
    ];

    function getIsoDate(offsetDays) {
      var d = new Date();
      d.setDate(d.getDate() + offsetDays);
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function translateTeam(raw) {
      if (!raw) return 'فريق';
      var clean = String(raw).trim();
      var low = clean.toLowerCase();
      if (TEAM_AR[low]) return TEAM_AR[low];
      var keys = Object.keys(TEAM_AR);
      for (var i = 0; i < keys.length; i++) {
        if (low.indexOf(keys[i]) !== -1) return TEAM_AR[keys[i]];
      }
      return clean;
    }

    function translateRound(rawRound) {
      if (!rawRound) return 'الجولة';
      return String(rawRound).replace(/^Spieltag\s*/i, 'الجولة ').replace(/^Matchday\s*/i, 'الجولة ');
    }

    function initialsBadge(name) {
      if (!name) return 'FC';
      var parts = String(name).trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2);
      return (parts[0].charAt(0) + parts[1].charAt(0));
    }

    function getLeague(code) {
      for (var i = 0; i < LEAGUES.length; i++) {
        if (LEAGUES[i].code === code) return LEAGUES[i];
      }

    function fetchJsonWithFallback(url, ok, fail) {
      var proxies = [
        url,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url)
      ];
      var idx = 0;

      function tryNext() {
        if (idx >= proxies.length) {
          if (fail) fail('تعذر الاتصال بالمصدر');
          return;
        }
        var target = proxies[idx++];
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', target, true);
          xhr.timeout = 8000;
          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
              try {
                var raw = JSON.parse(xhr.responseText);
                var data = (raw && typeof raw.contents === 'string') ? JSON.parse(raw.contents) : raw;
                ok(data);
              } catch (e) {
                tryNext();
              }
            } else {
              tryNext();
            }
          };
          xhr.ontimeout = tryNext;
          xhr.onerror = tryNext;
          xhr.send();
        } catch (e) {
          tryNext();
        }
      }

      tryNext();
    }

    function parseOpenLigaMatches(rows, lg) {
      if (!rows || !rows.length) return [];
      var list = [];
      for (var i = 0; i < rows.length; i++) {
        var m = rows[i];
        var home = translateTeam((m.team1 && (m.team1.teamName || m.team1.shortName)) || 'فريق 1');
        var away = translateTeam((m.team2 && (m.team2.teamName || m.team2.shortName)) || 'فريق 2');
        var results = m.matchResults || [];
        var hasRes = results.length > 0;
        var scoreText = '';
        if (hasRes) {
          var lastR = results[results.length - 1];
          scoreText = lastR.pointsTeam1 + ' - ' + lastR.pointsTeam2;
        }
        var dtRaw = m.matchDateTime || '';
        var datePart = dtRaw.slice(0, 10);
        var timePart = dtRaw.slice(11, 16);
        var roundName = (m.group && m.group.groupName) ? translateRound(m.group.groupName) : 'الجولة';
        var isLive = !m.matchIsFinished && hasRes;
        var statusLabel = m.matchIsFinished ? 'انتهت' : (isLive ? 'مباشر' : (timePart || 'قادمة'));

        list.push({
          id: 'ol_' + (m.matchID || i),
          league: lg.name,
          country: lg.country,
          round: roundName,
          date: datePart,
          time: timePart,
          home: home,
          away: away,
          scoreOrTime: hasRes ? scoreText : (timePart || 'قادمة'),
          statusLabel: statusLabel,
          isLive: isLive,
          stadium: m.location ? ((m.location.locationCity ? m.location.locationCity + ' - ' : '') + (m.location.locationStadium || '')) : '',
          referee: '',
          channels: [],
          homeFormation: '',
          awayFormation: '',
          homeLineup: [],
          awayLineup: [],
          homeBench: [],
          awayBench: [],
          homeInjuries: [],
          awayInjuries: []
        });
      }
      return list;
    }

    function parseOpenLigaStandings(rows) {
      if (!rows || !rows.length) return [];
      var out = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var gf = r.goals !== undefined ? r.goals : '-';
        var ga = r.opponentGoals !== undefined ? r.opponentGoals : '-';
        var gd = (typeof gf === 'number' && typeof ga === 'number') ? ((gf - ga > 0 ? '+' : '') + (gf - ga)) : '-';
        out.push({
          pos: i + 1,
          team: translateTeam(r.teamName || r.shortName || 'فريق'),
          p: r.matches !== undefined ? r.matches : '-',
          w: r.won !== undefined ? r.won : '-',
          d: r.draw !== undefined ? r.draw : '-',
          l: r.lost !== undefined ? r.lost : '-',
          gf: gf,
          ga: ga,
          gd: gd,
          pts: r.points !== undefined ? r.points : '-'
        });
      }
      out.sort(function (a, b) { return Number(a.pos) - Number(b.pos); });
      return out;
    }

    function parseTsdbEvent(ev, lg, upcoming) {
      var hs = ev.intHomeScore;
      var as = ev.intAwayScore;
      var hasScore = hs !== null && as !== null && hs !== undefined && as !== undefined && String(hs) !== '' && String(as) !== '';
      var timePart = ev.strTime ? String(ev.strTime).slice(0, 5) : '';
      return {
        id: 'ts_' + (ev.idEvent || (ev.strHomeTeam + '_' + ev.strAwayTeam + '_' + ev.dateEvent)),
        league: lg.name,
        country: lg.country,
        round: ev.intRound ? ('الجولة ' + ev.intRound) : (upcoming ? 'مباريات قادمة' : 'مباريات سابقة'),
        date: ev.dateEvent || '',
        time: timePart,
        home: translateTeam(ev.strHomeTeam || 'فريق 1'),
        away: translateTeam(ev.strAwayTeam || 'فريق 2'),
        scoreOrTime: hasScore ? (hs + ' - ' + as) : (timePart || 'قادمة'),
        statusLabel: hasScore ? 'انتهت' : (timePart || 'قادمة'),
        isLive: false,
        stadium: ev.strVenue || '',
        referee: '',
        channels: ev.strTVStation ? [ev.strTVStation] : [],
        homeFormation: '',
        awayFormation: '',
        homeLineup: [],
        awayLineup: [],
        homeBench: [],
        awayBench: [],
        homeInjuries: [],
        awayInjuries: []
      };
    }

    function applyExternalFeedData(payload) {
      if (!payload || typeof payload !== 'object') return;
      if (Array.isArray(payload.archiveMatches)) archiveMatches = payload.archiveMatches;
      if (Array.isArray(payload.players)) playersDirectory = payload.players;
      if (payload.matchesByLeague && typeof payload.matchesByLeague === 'object') {
        var mKeys = Object.keys(payload.matchesByLeague);
        for (var i = 0; i < mKeys.length; i++) {
          matchesByLeague[mKeys[i]] = payload.matchesByLeague[mKeys[i]];
        }
      }
      if (payload.standingsByLeague && typeof payload.standingsByLeague === 'object') {
        var sKeys = Object.keys(payload.standingsByLeague);
        for (var j = 0; j < sKeys.length; j++) {
          standingsByLeague[sKeys[j]] = payload.standingsByLeague[sKeys[j]];
        }
      }
    }

    function syncLeague() {
      var lg = getLeague(currentLeague);
      var st = document.getElementById('syncStatus');
      var notice = document.getElementById('noticeBox');
      st.innerHTML = 'جاري الجلب...';

      if (externalFeedUrl) {
        fetchJsonWithFallback(externalFeedUrl, function (data) {
          applyExternalFeedData(data);
          st.innerHTML = 'محدّث • كل 90 ث';
          notice.style.display = 'none';
          renderAll();
        }, function (err) {
          st.innerHTML = 'تنبيه المصدر';
          notice.style.display = 'block';
          notice.innerHTML = 'تعذر جلب ملف البيانات الخارجي (' + err + ').';
          renderAll();
        });
        return;
      }

      if (lg.openligaShortcut) {
        var mUrl = 'https://api.openligadb.de/getmatchdata/' + lg.openligaShortcut + '/' + lg.openligaSeason;
        var tUrl = 'https://api.openligadb.de/getbltable/' + lg.openligaShortcut + '/' + lg.openligaSeason;
        var done = 0;
        var errs = [];

        function finish() {
          done++;
          if (done < 2) return;
          var okM = matchesByLeague[lg.code] && matchesByLeague[lg.code].length > 0;
          var okT = standingsByLeague[lg.code] && standingsByLeague[lg.code].length > 0;
          if (okM || okT) {
            st.innerHTML = 'محدّث • كل 90 ث';
            notice.style.display = 'none';
          } else {
            st.innerHTML = 'غير متاح';
            notice.style.display = 'block';
            notice.innerHTML = 'تعذر جلب البيانات الحية لبطولة "' + lg.name + '" (' + errs.join(' | ') + ').';
          }
          renderAll();
        }

        fetchJsonWithFallback(mUrl, function (d) { matchesByLeague[lg.code] = parseOpenLigaMatches(d, lg); finish(); }, function (e) { errs.push('مباريات: ' + e); finish(); });
        fetchJsonWithFallback(tUrl, function (d) { standingsByLeague[lg.code] = parseOpenLigaStandings(d); finish(); }, function (e) { errs.push('ترتيب: ' + e); finish(); });
      } else if (lg.tsdbId) {
        var nextUrl = TSDB_BASE + '/eventsnextleague.php?id=' + lg.tsdbId;
        var lastUrl = TSDB_BASE + '/eventslast.php?id=' + lg.tsdbId;
        var tblUrl = TSDB_BASE + '/lookuptable.php?l=' + lg.tsdbId + '&s=' + encodeURIComponent(lg.tsdbSeason);
        var steps = 0;
        var collected = [];
        var tsErrs = [];

        function finishTs() {
          steps++;
          if (steps < 3) return;
          matchesByLeague[lg.code] = collected;
          var okM = collected.length > 0;
          var okT = standingsByLeague[lg.code] && standingsByLeague[lg.code].length > 0;
          if (okM || okT) {
            st.innerHTML = 'محدّث • كل 90 ث';
            notice.style.display = 'none';
          } else {
            st.innerHTML = 'غير متاح';
            notice.style.display = 'block';
            notice.innerHTML = 'لم ترجع خدمة المصدر بيانات لبطولة "' + lg.name + '" حالياً' + (tsErrs.length ? ' (' + tsErrs.join(' | ') + ')' : '') + '. يمكنك ربط ملف JSON للبيانات من الزر بالأعلى.';
          }
          renderAll();
        }

        fetchJsonWithFallback(nextUrl, function (d) {
          var arr = d && Array.isArray(d.events) ? d.events : [];
          for (var i = 0; i < arr.length; i++) collected.push(parseTsdbEvent(arr[i], lg, true));
          finishTs();
        }, function (e) { tsErrs.push('قادمة: ' + e); finishTs(); });

        fetchJsonWithFallback(lastUrl, function (d) {
          var arr = d && Array.isArray(d.results) ? d.results : [];
          for (var i = 0; i < arr.length; i++) collected.push(parseTsdbEvent(arr[i], lg, false));
          finishTs();
        }, function (e) { tsErrs.push('سابقة: ' + e); finishTs(); });

        fetchJsonWithFallback(tblUrl, function (d) {
          var arr = d && Array.isArray(d.table) ? d.table : [];
          var mapped = [];
          for (var i = 0; i < arr.length; i++) {
            var r = arr[i];
            var gf = r.intGoalsFor !== undefined ? Number(r.intGoalsFor) : '-';
            var ga = r.intGoalsAgainst !== undefined ? Number(r.intGoalsAgainst) : '-';
            var gd = (typeof gf === 'number' && typeof ga === 'number' && !isNaN(gf) && !isNaN(ga)) ? ((gf - ga > 0 ? '+' : '') + (gf - ga)) : '-';
            mapped.push({
              pos: r.intRank || (i + 1),
              team: translateTeam(r.strTeam || 'فريق'),
              p: r.intPlayed !== undefined ? r.intPlayed : '-',
              w: r.intWin !== undefined ? r.intWin : '-',
              d: r.intDraw !== undefined ? r.intDraw : '-',
              l: r.intLoss !== undefined ? r.intLoss : '-',
              gf: gf,
              ga: ga,
              gd: gd,
              pts: r.intPoints !== undefined ? r.intPoints : '-'
            });
          }
          mapped.sort(function (a, b) { return Number(a.pos) - Number(b.pos); });
          standingsByLeague[lg.code] = mapped;
          finishTs();
        }, function (e) { tsErrs.push('ترتيب: ' + e); finishTs(); });
      } else {
        st.innerHTML = 'موسوعة البيانات';
        notice.style.display = 'block';
        notice.innerHTML = 'قسم "' + lg.name + '" مخصص للبيانات الموثّقة المربوطة أو المستوردة من ملف JSON حقيقي (أرشيف ما قبل 2000، كأس العالم، الدوريات الصغرى، واللاعبون وبطولاتهم) دون أي حشو وهمي.';
        renderAll();
      }
    }

              '<div><div style="font-weight:800;font-size:12px;margin-bottom:4px">' + m.away + '</div>' + renderPlayerListRows(m.awayInjuries, true) + '</div>' +
            '</div>' +
            '<div style="font-size:10px;color:#64748b;margin-top:8px">مفتاح الجدول: <span class="inj-plus">+</span> إصابة أو استبعاد</div>' +
          '</div>';
      } else if (modalSubTab === 'lineup') {
        bodyHtml =
          renderDualPitch(m) +
          '<div class="sec-box">' +
            '<div class="sec-h">التشكيلة الأساسية</div>' +
            '<div class="two-teams">' +
              '<div><div style="font-weight:800;font-size:12px;margin-bottom:4px">' + m.home + '</div>' + renderPlayerListRows(m.homeLineup, false) + '</div>' +
              '<div><div style="font-weight:800;font-size:12px;margin-bottom:4px">' + m.away + '</div>' + renderPlayerListRows(m.awayLineup, false) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="sec-box">' +
            '<div class="sec-h">الاحتياط والدكة</div>' +
            '<div class="two-teams">' +
              '<div><div style="font-weight:800;font-size:12px;margin-bottom:4px">دكة ' + m.home + '</div>' + renderPlayerListRows(m.homeBench, false) + '</div>' +
              '<div><div style="font-weight:800;font-size:12px;margin-bottom:4px">دكة ' + m.away + '</div>' + renderPlayerListRows(m.awayBench, false) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="sec-box">' +
            '<div class="sec-h">الإصابات والاستبعاد</div>' +
            '<div class="two-teams">' +
              '<div><div style="font-weight:800;font-size:12px;margin-bottom:4px">' + m.home + '</div>' + renderPlayerListRows(m.homeInjuries, true) + '</div>' +
              '<div><div style="font-weight:800;font-size:12px;margin-bottom:4px">' + m.away + '</div>' + renderPlayerListRows(m.awayInjuries, true) + '</div>' +
            '</div>' +
          '</div>';
      } else {
        bodyHtml = buildStandingsTableHtml(standingsByLeague[currentLeague] || []);
      }

      document.getElementById('detailContent').innerHTML = tabsHtml + '<div class="modal-body">' + bodyHtml + '</div>';
    }

    function closeDetail() {
      document.getElementById('detailModal').style.display = 'none';
    }

    function backdropClose(e) {
      if (e && e.target && e.target.id === 'detailModal') closeDetail();
    }

    function buildStandingsTableHtml(rows) {
      var qEl = document.getElementById('q');
      var q = qEl && qEl.value ? qEl.value.trim().toLowerCase() : '';
      var trs = '';
      for (var i = 0; i < rows.length; i++) {
        var s = rows[i];
        var hay = (String(s.team) + ' ' + String(s.pos)).toLowerCase();
        if (q && hay.indexOf(q) === -1) continue;
        trs += '<tr>' +
          '<td><b>' + s.pos + '</b></td>' +
          '<td class="t-team"><span class="t-badge" style="margin-left:5px">' + initialsBadge(s.team) + '</span>' + s.team + '</td>' +
          '<td>' + s.p + '</td><td>' + s.w + '</td><td>' + s.d + '</td><td>' + s.l + '</td>' +
          '<td>' + s.gf + '</td><td>' + s.ga + '</td><td>' + s.gd + '</td>' +
          '<td><b>' + s.pts + '</b></td>' +
          '<td><span class="form-dots"><span class="dot w"></span><span class="dot d"></span><span class="dot l"></span></span></td>' +
        '</tr>';
      }
      if (!trs) {
        return '<div class="stand-card"><p style="text-align:center;color:#64748b;font-size:12px">لا يوجد جدول ترتيب متاح حالياً</p></div>';
      }
      return '<div class="stand-card"><table>' +
        '<thead><tr><th>#</th><th style="text-align:right">الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>+/-</th><th>نقاط</th><th>نتائج</th></tr></thead>' +
        '<tbody>' + trs + '</tbody>' +
      '</table>' +
      '<div class="legend-row">' +
        '<span class="leg-item"><span class="leg-bar" style="background:#16a34a"></span>دوري الأبطال</span>' +
        '<span class="leg-item"><span class="leg-bar" style="background:#2563eb"></span>كأس الاتحاد الأوروبي</span>' +
        '<span class="leg-item"><span class="leg-bar" style="background:#06b6d4"></span>التأهل لدوري المؤتمر</span>' +
        '<span class="leg-item"><span class="leg-bar" style="background:#f59e0b"></span>تصفيات الهبوط</span>' +
        '<span class="leg-item"><span class="leg-bar" style="background:#dc2626"></span>هبوط</span>' +
      '</div></div>';
    }

    function renderArchiveView(q) {
      var lg = getLeague(currentLeague);
      var list = archiveMatches || [];
      var filtered = [];
      for (var i = 0; i < list.length; i++) {
        var m = list[i];
        var yr = m.year ? Number(m.year) : (m.date ? Number(String(m.date).slice(0, 4)) : 0);
        var isWc = Boolean(m.isWorldCup) || String(m.league || '').indexOf('كأس العالم') !== -1;
        if (archiveFilter === 'pre2000' && !(yr > 0 && yr < 2000)) continue;
        if (archiveFilter === '2000plus' && !(yr >= 2000)) continue;
        if (archiveFilter === 'wc' && !isWc) continue;
        if (q) {
          var hay = ((m.league || '') + ' ' + (m.home || '') + ' ' + (m.away || '') + ' ' + (m.year || '') + ' ' + (m.round || '')).toLowerCase();
          if (hay.indexOf(q) === -1) continue;
        }
        filtered.push(m);
      }
      if (!filtered.length) {
        return '<div class="info-card"><div class="info-title">أرشيف المباريات التاريخية وكأس العالم (' + lg.name + ')</div>' +
          '<div class="info-meta">لا توجد سجلات أرشيف محمّلة حالياً لهذا الفلتر. يمكنك ربط ملف JSON للبيانات التاريخية (من قبل 2000 وكأس العالم والدوريات الصغرى) من زر "ربط ملف/مصدر بيانات JSON" دون أي بيانات وهمية.</div></div>';
      }
      var html = '<div class="grid-cards">';
      for (var j = 0; j < filtered.length; j++) {
        var item = filtered[j];
        html += '<div class="info-card">' +
          '<div class="info-title">' + translateTeam(item.home) + ' (' + (item.scoreOrTime || item.score || '-') + ') ' + translateTeam(item.away) + '</div>' +
          '<div class="info-meta">' + (item.league || 'بطولة') + ' • ' + (item.year || item.date || '') + (item.round ? ' • ' + item.round : '') + '</div>' +
          '<button type="button" class="mini-btn" onclick="openDetail(\'' + item.id + '\')">عرض التفاصيل</button>' +
        '</div>';
      }
      return html + '</div>';
    }

    function renderPlayersView(q) {
      var list = playersDirectory || [];
      var filtered = [];
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var teamTrophies = Array.isArray(p.teamTrophies) ? p.teamTrophies.join(' ') : '';
        var indTrophies = Array.isArray(p.individualTrophies) ? p.individualTrophies.join(' ') : '';
        if (q) {
          var hay = ((p.name || '') + ' ' + (p.team || '') + ' ' + teamTrophies + ' ' + indTrophies).toLowerCase();
          if (hay.indexOf(q) === -1) continue;
        }
        filtered.push(p);
      }
      if (!filtered.length) {
        return '<div class="info-card"><div class="info-title">اللاعبون والبطولات الفردية والجماعية</div>' +
          '<div class="info-meta">لا توجد ملفات لاعبين محمّلة حالياً. عند ربط ملف JSON يحتوي على قائمة اللاعبين وصورهم وبطولاتهم الجماعية والفردية ستظهر هنا كاملة بوضوح.</div></div>';
      }
      var html = '<div class="grid-cards">';
      for (var j = 0; j < filtered.length; j++) {
        var ply = filtered[j];
        var gTags = (ply.teamTrophies || []).map(function (t) { return '<span class="tag green">' + t + '</span>'; }).join('');
        var iTags = (ply.individualTrophies || []).map(function (t) { return '<span class="tag gold">' + t + '</span>'; }).join('');
        html += '<div class="info-card">' +
          '<div class="player-card-top">' +
            '<div class="p-big-ava">' + renderAvatarContent(ply, ply.num || (j + 1)) + '</div>' +
            '<div><div class="info-title" style="margin:0">' + ply.name + '</div><div class="info-meta" style="margin:0">' + translateTeam(ply.team || '') + '</div></div>' +
          '</div>' +
          '<div class="info-meta"><b>بطولات جماعية:</b><br>' + (gTags || '<span class="tag">غير محدد</span>') + '</div>' +
          '<div class="info-meta"><b>بطولات فردية:</b><br>' + (iTags || '<span class="tag">غير محدد</span>') + '</div>' +
        '</div>';
      }
      return html + '</div>';
    }

    function renderAll() {
      var qEl = document.getElementById('q');
      var q = qEl && qEl.value ? qEl.value.trim().toLowerCase() : '';
      var view = document.getElementById('view');

      if (currentSection === 'standings') {
        view.innerHTML = buildStandingsTableHtml(standingsByLeague[currentLeague] || []);
        return;
      }
      if (currentSection === 'archive') {
        view.innerHTML = renderArchiveView(q);
        return;
      }
      if (currentSection === 'players') {
        view.innerHTML = renderPlayersView(q);
        return;
      }

      var lg = getLeague(currentLeague);
      var allMatches = matchesByLeague[currentLeague] || [];
      var filtered = [];

      for (var i = 0; i < allMatches.length; i++) {
        var m = allMatches[i];
        if (statusFilter === 'day' && selectedDate && m.date && m.date !== selectedDate) continue;
        if (statusFilter === 'live' && !m.isLive) continue;
        if (statusFilter === 'fav' && !favTeams[m.home] && !favTeams[m.away]) continue;
        if (q) {
          var hay = (m.league + ' ' + m.home + ' ' + m.away + ' ' + m.round + ' ' + m.date).toLowerCase();
          if (hay.indexOf(q) === -1) continue;
        }
        filtered.push(m);
      }

      if (!filtered.length) {
        view.innerHTML = '<div class="comp-block"><div style="padding:18px;text-align:center;color:#64748b;font-size:12px">لا توجد مباريات متاحة حالياً للفلتر أو البطولة المحددة</div></div>';
        return;
      }

      var rowsHtml = '';
      var lastRound = '';
      for (var j = 0; j < filtered.length; j++) {
        var item = filtered[j];
        var groupKey = (item.round || 'الجولة') + (item.date ? ' • ' + item.date : '');
        if (groupKey && groupKey !== lastRound) {
          rowsHtml += '<div class="round-bar"><span>' + (item.round || 'الجولة') + '</span><span>' + (item.date || '') + '</span></div>';
          lastRound = groupKey;
        }
        rowsHtml += '<div class="match-row">' +
          '<div class="m-status-col ' + (item.isLive ? 'live' : '') + '">' + item.statusLabel + '</div>' +
          '<div class="team-cell home"><span class="t-badge">' + initialsBadge(item.home) + '</span><span>' + item.home + '</span></div>' +
          '<div class="center-score">' + item.scoreOrTime + '</div>' +
          '<div class="team-cell away"><span>' + item.away + '</span><span class="t-badge">' + initialsBadge(item.away) + '</span></div>' +
          '<div class="act-col"><button type="button" class="mini-btn" onclick="openDetail(\'' + item.id + '\')">تفاصيل</button></div>' +
        '</div>';
      }

      var subRangeLabel = (statusFilter === 'day') ? ('تاريخ: ' + selectedDate) : 'المباريات الفاتت والقادمة';
      view.innerHTML = '<div class="comp-block">' +
        '<div class="comp-head"><div><div class="comp-title">' + lg.name + '</div><div class="comp-sub">' + lg.country + '</div></div><div class="comp-sub">' + subRangeLabel + '</div></div>' +
        rowsHtml +
      '</div>';
    }

    renderDaysStrip();
    renderLeagues();
    renderAll();
    syncLeague();
    setInterval(syncLeague, AUTO_SYNC_MS);
  </script>
</body>
</html>
